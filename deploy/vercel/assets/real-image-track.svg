<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">AegisLand real-image benchmark visualization</title>
  <desc id="desc">Original dark research visualization showing a stylized landing pad, protected test split, and AegisLand real-image track labels. This is not a republished KIOS dataset frame.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#08090b"/>
      <stop offset="0.58" stop-color="#121417"/>
      <stop offset="1" stop-color="#050607"/>
    </linearGradient>
    <radialGradient id="glow" cx="72%" cy="58%" r="52%">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".13"/>
      <stop offset=".45" stop-color="#ffffff" stop-opacity=".035"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="pad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f5f5f5" stop-opacity=".86"/>
      <stop offset="1" stop-color="#b9bdc2" stop-opacity=".30"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
    <clipPath id="clip"><rect x="0" y="0" width="1600" height="900" rx="0"/></clipPath>
  </defs>

  <g clip-path="url(#clip)">
    <rect width="1600" height="900" fill="url(#bg)"/>
    <rect width="1600" height="900" fill="url(#glow)"/>

    <g opacity=".15" stroke="#e8e9ea" stroke-width="1">
      <path d="M620 900 1058 370M820 900 1120 370M1020 900 1182 370M1220 900 1244 370M1420 900 1306 370"/>
      <path d="M485 810H1490M545 720H1455M605 640H1420M662 570H1385M715 508H1350M763 453H1320M806 405H1290"/>
    </g>

    <ellipse cx="1120" cy="650" rx="320" ry="85" fill="#ffffff" opacity=".04" filter="url(#soft)"/>

    <g transform="translate(1060 585) rotate(-7)">
      <path d="M-205 -118 196 -82 214 122 -218 94Z" fill="#0c0d0f" stroke="#ffffff" stroke-opacity=".22" stroke-width="2"/>
      <path d="M-140 -65 130 -40 140 72 -150 53Z" fill="url(#pad)" opacity=".72"/>
      <path d="M-46 -49 45 -40 50 60 -52 52Z" fill="none" stroke="#111316" stroke-width="18" opacity=".78"/>
      <path d="M-39 4 45 11M2 -44 -1 57" stroke="#111316" stroke-width="13" opacity=".78"/>
      <rect x="-166" y="-88" width="330" height="174" fill="none" stroke="#ffffff" stroke-width="3" stroke-dasharray="14 9" opacity=".88"/>
      <path d="M-166 -88h28M-166 -88v28M164 -88h-28M164 -88v28M-166 86h28M-166 86v-28M164 86h-28M164 86v-28" stroke="#ffffff" stroke-width="6"/>
    </g>

    <g fill="none" stroke="#ffffff" opacity=".34">
      <circle cx="1060" cy="585" r="244"/>
      <circle cx="1060" cy="585" r="306" stroke-dasharray="4 12"/>
      <path d="M1060 242v58M1060 870v-58M717 585h58M1403 585h-58"/>
    </g>

    <g font-family="Arial,Helvetica,sans-serif" fill="#f4f4f4">
      <text x="92" y="104" font-size="23" font-weight="700" letter-spacing="7">AEGISLAND</text>
      <text x="92" y="214" font-size="18" font-weight="700" letter-spacing="4" fill="#a7aaae">REAL-IMAGE TRACK</text>
      <text x="92" y="296" font-size="68" font-weight="500" letter-spacing="-3">From synthetic</text>
      <text x="92" y="368" font-size="68" font-weight="500" letter-spacing="-3">to actual camera data.</text>
      <text x="92" y="432" font-size="25" fill="#b7babf">KIOS landing-pad benchmark · protected temporal evaluation</text>

      <g font-size="18" fill="#a7aaae" letter-spacing="2">
        <text x="92" y="578">TOTAL LABELED FRAMES</text>
        <text x="92" y="684">PROTECTED TEST</text>
        <text x="330" y="578">DEVELOPMENT TRAIN</text>
        <text x="330" y="684">VALIDATION</text>
      </g>
      <g font-size="47" font-weight="500">
        <text x="92" y="632">422</text>
        <text x="92" y="738">86</text>
        <text x="330" y="632">252</text>
        <text x="330" y="738">64</text>
      </g>
      <text x="92" y="826" font-size="16" fill="#7f8389" letter-spacing="1.1">ORIGINAL PROJECT VISUALIZATION · NOT A RE-PUBLISHED DATASET FRAME</text>
    </g>

    <g transform="translate(1300 112)" font-family="Arial,Helvetica,sans-serif">
      <rect x="0" y="0" width="208" height="54" rx="27" fill="#ffffff" opacity=".08" stroke="#ffffff" stroke-opacity=".16"/>
      <circle cx="28" cy="27" r="5" fill="#ffffff"/>
      <text x="48" y="34" fill="#e9e9e9" font-size="15" letter-spacing="1.2">EVIDENCE FIRST</text>
    </g>
  </g>
</svg>
