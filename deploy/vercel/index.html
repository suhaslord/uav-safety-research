<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#fff">
  <title>AegisLand — Research Cockpit</title>
  <link rel="icon" type="image/svg+xml" href="https://cdn.jsdelivr.net/gh/suhaslord/uav-safety-research@cc621c7ea3aec64be32c66626f33d79e46e363c0/dashboard/aegis-mark.svg">
  <style>
    html,body{margin:0;background:#fff;color:#171a20;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}
    #boot{min-height:100vh;display:grid;place-items:center}.inner{display:grid;gap:18px;justify-items:center}
    .lock{display:flex;align-items:center;gap:12px}.mark{width:44px;height:44px;display:grid;place-items:center;background:#171a20;color:#fff;border-radius:12px;box-shadow:0 10px 28px rgba(23,26,32,.18)}
    .mark img{width:44px;height:44px;display:block}.word{font-size:15px;font-weight:600;letter-spacing:.24em}small{color:#5c5e62}
  </style>
</head>
<body>
  <div id="boot"><div class="inner"><div class="lock"><span class="mark"><img src="https://cdn.jsdelivr.net/gh/suhaslord/uav-safety-research@cc621c7ea3aec64be32c66626f33d79e46e363c0/dashboard/aegis-mark.svg" alt=""></span><span class="word">AEGISLAND</span></div><small>Loading AegisLand research archive…</small></div></div>
  <script>
    (async()=>{
      const started=performance.now();
      const commit='cc621c7ea3aec64be32c66626f33d79e46e363c0';
      const base=`https://cdn.jsdelivr.net/gh/suhaslord/uav-safety-research@${commit}/dashboard/`;
      const favicon=`${base}aegis-mark.svg`;
      const path=location.pathname;
      let source='index.html',mode='home';
      if(path.startsWith('/phases/')){
        mode='archive';
        source=(path==='/phases/'||path==='/phases')?'phases/index.html':'phases/phase.html';
      }
      try{
        const r=await fetch(base+source,{cache:'no-store'});
        if(!r.ok)throw new Error('source '+r.status);
        let h=await r.text();
        if(mode==='home'){
          const homeCss=`<style id="aegis-home-frontier-css">
            .wordmark{display:inline-flex!important;align-items:center;gap:9px;letter-spacing:.18em!important}.home-brand-mark{width:28px;height:28px;border-radius:9px;background:#171a20;display:inline-grid;place-items:center;position:relative;box-shadow:0 7px 20px rgba(23,26,32,.17);flex:0 0 auto}.home-brand-mark:before,.home-brand-mark:after{content:"";position:absolute;width:2px;height:15px;top:6px;background:#fff;border-radius:2px}.home-brand-mark:before{transform:rotate(25deg);left:9px}.home-brand-mark:after{transform:rotate(-25deg);right:9px}.home-brand-mark i{width:10px;height:2px;background:#fff;border-radius:2px;position:absolute;top:16px}.home-brand-mark b{position:absolute;width:5px;height:5px;border-radius:50%;background:#2f6fed;right:3px;top:3px;box-shadow:0 0 0 2px rgba(47,111,237,.22)}
            .home-model-rail{background:#fff;border-top:1px solid #e5e5e7;border-bottom:1px solid #e5e5e7;padding:22px clamp(20px,5vw,72px) 18px;overflow:hidden}.home-model-rail-head{display:flex;align-items:end;justify-content:space-between;gap:20px;margin-bottom:15px}.home-model-rail-head p{margin:0;color:#6b6d70;font-size:10px;font-weight:700;letter-spacing:.13em;text-transform:uppercase}.home-model-rail-head strong{font-size:13px;font-weight:600}.home-model-rail-head a{font-size:11px;color:#5c5e62;border-bottom:1px solid #bbb;padding-bottom:2px}.home-model-scroll{overflow-x:auto;scrollbar-width:thin;padding-bottom:5px}.home-model-track{display:grid;grid-template-columns:repeat(12,minmax(76px,1fr));position:relative;min-width:980px}.home-model-track:before{content:"";position:absolute;left:3%;right:3%;top:14px;height:1px;background:#c9cacc}.home-model-step{position:relative;display:grid;justify-items:center;gap:6px;padding:0 4px;text-align:center;color:#6b6d70;transition:transform .2s ease,color .2s ease}.home-model-step:hover{transform:translateY(-2px);color:#171a20}.home-model-step i{width:9px;height:9px;border:2px solid #9fa0a3;background:#fff;border-radius:50%;z-index:1;margin-top:10px}.home-model-step span{font-size:9px;letter-spacing:.08em}.home-model-step strong{font-size:10px;font-weight:600;line-height:1.15}.home-model-step.current{color:#171a20}.home-model-step.current i{width:13px;height:13px;margin-top:8px;background:#2f6fed;border-color:#2f6fed;box-shadow:0 0 0 5px rgba(47,111,237,.13)}.home-model-step.current strong{font-weight:750}.home-model-step.gap{opacity:.6}
            .phase10r-frontier{background:#171a20;color:#fff;padding:24px clamp(24px,7vw,120px);display:grid;grid-template-columns:minmax(0,1fr) auto;gap:28px;align-items:center;border-top:1px solid rgba(255,255,255,.12)}.phase10r-frontier-copy{display:grid;gap:6px}.phase10r-frontier-kicker{margin:0;color:#9fa0a3;font-size:10px;font-weight:600;letter-spacing:.14em;text-transform:uppercase}.phase10r-frontier strong{font-size:clamp(17px,2vw,24px);font-weight:500;letter-spacing:-.02em}.phase10r-frontier p{margin:0;color:#c7c7c7;font-size:13px;line-height:1.55}.phase10r-frontier-metrics{display:flex;gap:22px;align-items:center}.phase10r-frontier-metrics span{display:grid;gap:2px;min-width:86px}.phase10r-frontier-metrics b{font-size:18px;font-weight:500}.phase10r-frontier-metrics small{color:#9fa0a3;font-size:9px;text-transform:uppercase;letter-spacing:.08em}.phase10r-frontier a{color:#fff;border-bottom:1px solid rgba(255,255,255,.45);padding-bottom:2px}
            @media(max-width:767px){.home-model-rail{padding-left:20px;padding-right:20px}.home-model-rail-head{align-items:flex-start}.home-model-track{min-width:900px}.home-model-step strong{font-size:9px}.phase10r-frontier{grid-template-columns:1fr;padding:22px 20px}.phase10r-frontier-metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.phase10r-frontier-metrics span{min-width:0}.phase10r-frontier-metrics b{font-size:16px}}
          </style>`;
          const rail=`<section id="homeModelRail" class="home-model-rail" aria-label="AegisLand model and research phase timeline"><div class="home-model-rail-head"><div><p>Research progression</p><strong>Every model stays reachable.</strong></div><a href="/phases/">Open full archive ↗</a></div><div class="home-model-scroll"><div class="home-model-track"><a class="home-model-step" href="/phases/phase1/"><i></i><span>01</span><strong>Phase 1</strong></a><a class="home-model-step" href="/phases/phase2/"><i></i><span>02</span><strong>Phase 2</strong></a><a class="home-model-step" href="/phases/phase3/"><i></i><span>03</span><strong>Phase 3</strong></a><a class="home-model-step gap" href="/phases/phase4/"><i></i><span>04</span><strong>Phase 4</strong></a><a class="home-model-step" href="/phases/phase5/"><i></i><span>05</span><strong>Phase 5</strong></a><a class="home-model-step" href="/phases/phase6/"><i></i><span>06</span><strong>Phase 6</strong></a><a class="home-model-step" href="/phases/phase6b/"><i></i><span>07</span><strong>Phase 6B</strong></a><a class="home-model-step" href="/phases/phase7/"><i></i><span>08</span><strong>Phase 7</strong></a><a class="home-model-step" href="/phases/phase8/"><i></i><span>09</span><strong>Phase 8</strong></a><a class="home-model-step" href="/phases/phase9/"><i></i><span>10</span><strong>Phase 9</strong></a><a class="home-model-step" href="/phases/phase10/"><i></i><span>11</span><strong>Phase 10</strong></a><a class="home-model-step current" href="/phases/phase10r/" aria-current="page"><i></i><span>12</span><strong>Phase 10R</strong></a></div></div></section><section id="phase10rFrontier" class="phase10r-frontier" aria-label="Latest published Phase 10R frozen holdout frontier"><div class="phase10r-frontier-copy"><p class="phase10r-frontier-kicker">Latest published frontier · Phase 10R frozen holdout</p><strong>Average ambiguous-view error fell sharply. Tail risk, availability, and calibration under shift did not.</strong><p>Final all-gates verdict: mixed / failed overall · frozen without retuning · <a href="/phases/phase10r/">open Phase 10R ↗</a></p></div><div class="phase10r-frontier-metrics" aria-label="Phase 10R frozen holdout metrics"><span><b>79.2%</b><small>lateral MAE gain</small></span><span><b>20.0%</b><small>miss rate</small></span><span><b>84.3%</b><small>95% lat coverage</small></span></div></section>`;

          h=h.replaceAll('href="cockpit.css"',`href="${base}cockpit.css"`)
            .replaceAll('href="cockpit-extension.css"',`href="${base}cockpit-extension.css"`)
            .replaceAll('src="hero-frame.svg"',`src="${base}hero-frame.svg"`)
            .replaceAll('src="cockpit.js"',`src="${base}cockpit.js"`)
            .replaceAll('src="cockpit-extension.js"',`src="${base}cockpit-extension.js"`)
            .replaceAll('href="phase7.html"','href="/phases/phase7/"')
            .replaceAll('phase9-external-perception-validation','main')
            .replaceAll('phase10-temporal-metric-perception','main')
            .replaceAll('phase10r1-p0-forensics-infrastructure','main')
            .replaceAll('phase10r-generalization-validation','main')
            .replaceAll('phase10r-frozen-holdout','main')
            .replace('<title>AegisLand — Research Cockpit</title>','<title>AegisLand — Phase 10R Frozen Frontier</title>')
            .replace('AegisLand research cockpit — simulation evidence, provenance, and external perception validation.','AegisLand Phase 10R frozen holdout — simulation-only evidence on perception reliability under appearance and geometry shift.')
            .replace('<a class="wordmark" href="#top" aria-label="AegisLand home">AEGISLAND</a>','<a class="wordmark" href="#top" aria-label="AegisLand home"><span class="home-brand-mark" aria-hidden="true"><i></i><b></b></span><span>AEGISLAND</span></a>')
            .replace('<a class="phase-link" href="/phases/phase7/">Phase 7</a>','<a class="phase-link" href="/phases/phase10r/">Phase 10R</a>')
            .replace('simulation-only research prototype','simulation-only research · latest published frontier')
            .replace('External perception evidence you can inspect, not just trust.','Phase 10R frozen holdout: mean error fell, but tail risk and calibration still broke under shift.')
            .replace('<a class="button primary" href="#result">Explore the result</a>','<a class="button primary" href="/phases/phase10r/">Open Phase 10R</a>')
            .replace(/<a class="button secondary" href="[^"]+" target="_blank" rel="noreferrer">Read protocol<\/a>/,'<a class="button secondary" href="https://github.com/suhaslord/uav-safety-research/blob/main/docs/phase10r_frozen_holdout_result.md" target="_blank" rel="noreferrer">Read frozen record</a>')
            .replace('<span>Phase 9</span>','<span>Phase 10R</span>')
            .replace('<span>external_perception_seen</span>','<span>phase10r_frozen_holdout</span><span>mixed / failed overall</span>')
            .replace('Stylized ArUco landing target used in Phase 9 camera validation.','Stylized landing target representing the frozen Phase 10R perception-reliability holdout.')
            .replace('<span><strong>67</strong><small>pose-linked frames</small></span>\n          <span><strong>24.684 s</strong><small>groundtruth stream</small></span>\n          <span><strong>1,237</strong><small>groundtruth samples</small></span>','<span><strong>1,440</strong><small>truth-visible frames</small></span>\n          <span><strong>36</strong><small>holdout sequences</small></span>\n          <span><strong>0.0%</strong><small>false positives</small></span>')
            .replace('<span>Phase 9 camera target</span>','<span>Phase 10R frozen holdout</span>')
            .replace('<span>visual motif · raw evidence remains traceable below</span>','<span>latest published frontier · evidence frozen without retuning</span>')
            .replace('<span>seen evidence · no safety verdict</span>','<span>frozen holdout · no post-holdout retuning</span>')
            .replace('Audited evidence · checking current CI…','Phase 10R is the current published frontier · checking current CI…')
            .replace('and the current Phase 9 draft all remain linked to their GitHub record.','and the current Phase 10R frozen holdout all remain linked to their GitHub record.')
            .replace('</head>',`<link rel="icon" type="image/svg+xml" href="${favicon}">${homeCss}</head>`)
            .replace('<section id="result"',`${rail}<section id="result"`);
        }else if(mode==='archive'){
          if(path==='/phases/phase10r/'||path==='/phases/phase10r'){
            h=h.replace('<body class="archive-shell">','<body class="archive-shell" data-phase="phase10r">');
          }
          h=h.replaceAll('href="/phase-archive.css"',`href="${base}phase-archive.css"`)
            .replaceAll('href="/phase-signatures.css"',`href="${base}phase-signatures.css"`)
            .replaceAll('href="/phase-responsive.css"',`href="${base}phase-responsive.css"`)
            .replaceAll('src="/phase-data.js"',`src="${base}phase-data.js"`)
            .replaceAll('src="/phase-runtime.js"',`src="${base}phase-runtime.js"`)
            .replaceAll('src="/phase-signatures.js"',`src="${base}phase-signatures.js"`)
            .replaceAll('src="/tesla-mobile.js"',`src="${base}tesla-mobile.js"`)
            .replaceAll('src="/phase-hero-fix.js"',`src="${base}phase-hero-fix.js"`)
            .replaceAll('phase9-external-perception-validation','main')
            .replaceAll('phase10-temporal-metric-perception','main')
            .replaceAll('phase10r1-p0-forensics-infrastructure','main')
            .replaceAll('phase10r-generalization-validation','main')
            .replaceAll('phase10r-frozen-holdout','main')
            .replace('</head>',`<link rel="icon" type="image/svg+xml" href="${favicon}"></head>`)
            .replace('</body>',`<script src="${base}phase10r-archive.js"><\/script></body>`);
        }
        await new Promise(x=>setTimeout(x,Math.max(0,500-(performance.now()-started))));
        document.open();document.write(h);document.close();
      }catch(e){
        document.querySelector('small').textContent='AegisLand source could not be loaded.';
      }
    })();
  </script>
</body>
</html>
