<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#fff"><title>AegisLand — Research Cockpit</title><link rel="icon" type="image/svg+xml" href="/favicon.svg?v=3"><link rel="shortcut icon" href="/favicon.ico?v=3"><style>html,body{margin:0;background:#fff;color:#171a20;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}#boot{min-height:100vh;display:grid;place-items:center}.inner{display:grid;gap:16px;justify-items:center}.mark{width:44px;height:44px;border-radius:12px;background:#171a20;color:#fff;display:grid;place-items:center;font-weight:700}.word{font-size:14px;font-weight:650;letter-spacing:.24em}small{color:#6b6d70}</style></head><body><div id="boot"><div class="inner"><div class="mark">A</div><div class="word">AEGISLAND</div><small>Loading latest research cockpit…</small></div></div><script>(async()=>{const rev='4d1b25e4bb83a1125cd2f1d7b34654d1bb2656b8';const base=`https://cdn.jsdelivr.net/gh/suhaslord/uav-safety-research@${rev}/dashboard/`;const motion=`${base}glass-ui.css`;const path=location.pathname;const isArchive=path.startsWith('/phases/');const isPhase11=path==='/phases/phase11/'||path==='/phases/phase11';const isArchiveIndex=path==='/phases/'||path==='/phases';const source=isArchive?(isPhase11?'phases/phase11.html':(isArchiveIndex?'phases/index.html':'phases/phase.html')):'index.html';const archivePatch=`<script>(()=>{document.addEventListener('DOMContentLoaded',()=>{const top=document.querySelector('.top-end .primary');if(top){top.textContent='Phase 11 · Latest';top.href='/phases/phase11/'}if(location.pathname==='/phases/'||location.pathname==='/phases'){const big=document.querySelector('.index-hero .big');if(big)big.textContent='From the first safety supervisor to PX4/Gazebo evidence, frozen Phase 10R distribution-shift testing, and Phase 11 P14R — the latest and strongest AegisLand model yet. Positive results, mismatches, near-misses and failed gates all stay visible.';const map=document.getElementById('archiveMap');if(map&&!document.getElementById('phase11ArchiveEra')){const era=document.createElement('section');era.className='era';era.id='phase11ArchiveEra';era.innerHTML='<header><span>05</span><h2>Phase 11 · Current reliability frontier</h2></header><div class="track"><a class="phase-link" href="/phases/phase11/"><span>Phase 11 · P14R · Latest model</span><strong>Strongest AegisLand model yet: high protected availability, robust uncertainty coverage, independent rescue, and one preserved tail-efficiency failure.</strong><small>Study closed · mixed protected-validation result · latest model</small><i>→</i></a></div>';map.appendChild(era)}}else if(location.pathname!='/phases/phase11/'&&location.pathname!='/phases/phase11'){const rail=document.querySelector('#phaseRail,.phase-rail');if(rail&&!rail.querySelector('a[href="/phases/phase11/"]')){const step=document.createElement('a');step.className='rail-step frontier';step.href='/phases/phase11/';step.innerHTML='<span>13</span><i></i><strong>Phase 11\\nLatest</strong>';rail.appendChild(step)}if(location.pathname.includes('/phase10/')){const k=document.querySelector('.hero-copy .kicker');if(k&&k.textContent.includes('Current frontier'))k.textContent=k.textContent.replace('Current frontier','External-perception milestone')}}});})();<\/script>`;try{const r=await fetch(base+source,{cache:'no-store'});if(!r.ok)throw new Error('source '+r.status);let h=await r.text();if(!isArchive){h=h.replace('</head>',`<link rel="icon" type="image/svg+xml" href="/favicon.svg?v=3"><link rel="shortcut icon" href="/favicon.ico?v=3"></head>`).replace('</body>',`<script src="${base}cursor-cubes.js"><\/script><script src="${base}global-interactions.js"><\/script></body>`)}else{if(path==='/phases/phase10r/'||path==='/phases/phase10r')h=h.replace('<body class="archive-shell">','<body class="archive-shell" data-phase="phase10r">');const assets=['phase-archive.css','phase-signatures.css','phase-responsive.css','phase-hero-scenes.css','glass-ui.css'];for(const a of assets)h=h.replaceAll(`href="/${a}"`,`href="${base}${a}"`);const scripts=['phase-data.js','phase-runtime.js','phase-signatures.js','tesla-mobile.js','phase-hero-fix.js','phase10r-archive.js','phase-hero-scenes.js'];for(const a of scripts)h=h.replaceAll(`src="/${a}"`,`src="${base}${a}"`);h=h.replaceAll('phase9-external-perception-validation','main').replaceAll('phase10-temporal-metric-perception','main').replaceAll('phase10r1-p0-forensics-infrastructure','main').replaceAll('phase10r-generalization-validation','main').replaceAll('phase10r-frozen-holdout','main').replace('</head>',`<link rel="stylesheet" href="${base}global-interactions.css"><link rel="icon" type="image/svg+xml" href="/favicon.svg?v=3"><link rel="shortcut icon" href="/favicon.ico?v=3"></head>`).replace('</body>',`${archivePatch}<script src="${base}global-interactions.js"><\/script></body>`)}document.open();document.write(h);document.close()}catch(e){const status=document.querySelector('small');if(status)status.textContent='AegisLand source could not be loaded.';console.error(e)}})();</script></body></html>
