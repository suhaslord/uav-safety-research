<!doctype html>

  <style>html,body{margin:0;background:#fff;color:#171a20;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}#boot{min-height:100vh;display:grid;place-items:center}.inner{display:grid;gap:16px;justify-items:center}.mark{width:44px;height:44px;border-radius:4px;background:#171a20;color:#fff;display:grid;place-items:center;font-weight:500}.word{font-size:14px;font-weight:500;letter-spacing:.24em}small{color:#5c5e62}</style>
</head>
<body>
<div id="boot"><div class="inner"><div class="mark">A</div><div class="word">AEGISLAND</div><small>Loading research archive…</small></div></div>
<script>
(async()=>{
const rev='2b7543fe9b0794c6bec8540e5d33c16e00fa6a67';const base=`https://cdn.jsdelivr.net/gh/suhaslord/uav-safety-research@${rev}/dashboard/`;const favicon='/favicon.svg?v=2';const motion=`${base}glass-ui.css`;const legacyHero=`${base}hero-legacy-interactive.css`;const cursorCubes=`${base}cursor-cubes.js`;const interactionCss=`${base}global-interactions.css`;const interactionJs=`${base}global-interactions.js`;const path=location.pathname;const isArchive=path==='/phases'||path.startsWith('/phases/');const source=isArchive?((path==='/phases/'||path==='/phases')?'phases/index.html':'phases/phase.html'):'index.html';
const homePatch=`<script>(()=>{const q=(s)=>document.querySelector(s),qa=(s)=>[...document.querySelectorAll(s)];document.title='AegisLand — Phase 11 P14R';const desc=q('meta[name="description"]');if(desc)desc.content='AegisLand Phase 11 P14R — current research frontier with high availability, robust uncertainty coverage, and one protected tail-efficiency failure.';const phase=q('.site-header .phase-link');if(phase){phase.textContent='Phase 11';phase.href='/phases/phase11/'}const kicker=q('main .hero .kicker');if(kicker)kicker.textContent='simulation-only research · Phase 11 P14R';const sub=q('main .hero .hero-subtitle');if(sub)sub.textContent='P14R passed every required seen-transfer gate and preserved ~96% protected 95% coverage with 98.53% availability. One locked lateral tail-efficiency gate stopped final confirmation.';const actionStyle=document.createElement('style');actionStyle.textContent='.hero-actions{justify-content:flex-start!important;align-items:center!important;gap:12px!important;margin-left:0!important;margin-right:0!important;width:100%!important}.hero-actions a{flex:0 0 auto!important;width:auto!important;min-width:164px!important;margin:0!important;padding-left:24px!important;padding-right:24px!important;font-weight:500!important}@media(max-width:560px){.hero-actions{display:grid!important;grid-template-columns:1fr!important}.hero-actions a{width:100%!important;min-width:0!important}}';document.head.appendChild(actionStyle);const actions=qa('main .hero .hero-actions a');if(actions[0]){actions[0].textContent='Open Phase 11';actions[0].href='/phases/phase11/'}if(actions[1]){actions[1].textContent='Read final report';actions[1].href='https://github.com/suhaslord/uav-safety-research/blob/main/docs/phase11_final_report.md'}const meta=q('main .hero .hero-meta');if(meta)meta.innerHTML='<span>Phase 11 · P14R</span><span>robust groupwise conformal envelope</span><span>current frontier · mixed protected result</span><span>safety acceptance: false</span>';const tele=q('main .hero .hero-telemetry');if(tele)tele.innerHTML='<span><strong>98.53%</strong><small>protected availability</small></span><span><strong>96.17%</strong><small>lateral 95% coverage</small></span><span><strong>94.63%</strong><small>rescue recovery</small></span>';const word=q('.site-header .wordmark');if(word)word.innerHTML='<span style="width:28px;height:28px;border-radius:4px;background:#171a20;color:#fff;display:inline-grid;place-items:center;margin-right:9px;font-size:12px;font-weight:500">A</span><span>AEGISLAND</span>';const hero=q('main .hero');if(hero&&!q('#phase11Summary')){const section=document.createElement('section');section.id='phase11Summary';section.style.cssText='min-height:72vh;display:flex;align-items:center;justify-content:center;text-align:center;padding:80px 24px;background:#f4f4f4;color:#171a20';section.innerHTML='<div style="width:min(680px,100%);display:flex;flex-direction:column;align-items:center"><p style="margin:0 0 16px;color:#393c41;font-size:14px;line-height:20px;font-weight:400">Phase 11 · P14R</p><h2 style="margin:0;font-size:40px;line-height:48px;font-weight:500;letter-spacing:normal;color:#171a20">Phase 11 P14R</h2><p style="margin:18px 0 0;max-width:620px;color:#393c41;font-size:14px;line-height:20px;font-weight:400">The current AegisLand research frontier passed every required seen-transfer gate. Protected validation preserved high coverage and availability, while one locked lateral tail-efficiency gate correctly prevented final confirmation.</p><p style="margin:14px 0 0;color:#5c5e62;font-size:14px;line-height:20px;font-weight:400">Protected validation: 10 of 11 required gate families passed.</p><a href="/phases/phase11/" style="margin-top:28px;min-width:200px;min-height:40px;padding:0 20px;border-radius:4px;background:#3e6ae1;color:#fff;display:inline-flex;align-items:center;justify-content:center;text-decoration:none;font-size:14px;font-weight:500;line-height:16.8px">Explore Phase 11</a></div>';hero.insertAdjacentElement('afterend',section)}if(hero&&!q('#homeModelRail')){const phases=['1','2','3','4','5','6','6b','7','8','9','10','10r','11'];const rail=document.createElement('section');rail.id='homeModelRail';rail.style.cssText='background:#fff;padding:24px clamp(20px,5vw,72px);overflow-x:auto';rail.innerHTML='<div style="display:flex;justify-content:space-between;gap:20px;margin-bottom:16px"><div><div style="font-size:14px;line-height:20px;color:#5c5e62;font-weight:400">Research progression</div><div style="font-size:14px;line-height:20px;color:#171a20;font-weight:500">Every model stays reachable.</div></div><a class="home-archive-link" href="/phases/" style="font-size:14px;line-height:20px;color:#5c5e62;font-weight:400">Open full archive</a></div><div class="home-rail-grid" style="display:grid;grid-template-columns:repeat(13,minmax(76px,1fr));min-width:1060px;gap:0">'+phases.map((p,i)=>'<a class="home-rail-step '+(p==='11'?'active':'')+'" href="/phases/phase'+p+'/" style="text-align:center;font-size:14px;line-height:20px;font-weight:500;color:'+(p==='11'?'#3e6ae1':'#393c41')+'">'+String(i+1).padStart(2,'0')+'<br>Phase '+(p==='10r'?'10R':p.toUpperCase())+'</a>').join('')+'</div>';const anchor=q('#phase11Summary')||hero;anchor.insertAdjacentElement('afterend',rail)}const media=document.querySelector('.hero-media');if(media)media.setAttribute('aria-label','Historical Phase 9 camera visualization retained below current Phase 11 research summary')})();<\/script>`;
const archivePatch=`<script>(()=>{document.addEventListener('DOMContentLoaded',()=>{if(!document.getElementById('aegisTeslaArchiveFix')){const style=document.createElement('style');style.id='aegisTeslaArchiveFix';style.textContent='.top-btn.primary{background:#3e6ae1!important;color:#fff!important}.aegis-mini-mark{box-shadow:none!important;border-radius:4px!important}.aegis-mini-mark b{box-shadow:none!important}#phase11ArchiveEra h2,#phase11ArchiveEra .phase-link strong{font-weight:500!important;letter-spacing:normal!important}.phase-rail{grid-template-columns:repeat(13,minmax(0,1fr))!important}@media(max-width:980px){.phase-rail{grid-template-columns:repeat(13,92px)!important}}@media(max-width:430px){.phase-rail{grid-template-columns:repeat(13,82px)!important}}';document.head.appendChild(style)}const top=document.querySelector('.top-end .primary');if(top){top.textContent='Phase 11';top.href='/phases/phase11/'}if(location.pathname==='/phases/'||location.pathname==='/phases'){const big=document.querySelector('.index-hero .big');if(big)big.textContent='From the first safety supervisor to PX4/Gazebo evidence, frozen Phase 10R shift testing, and Phase 11 P14R. Positive results, mismatches, near-misses and failed gates all stay visible.';const map=document.getElementById('archiveMap');if(map&&!document.getElementById('phase11ArchiveEra')){const era=document.createElement('section');era.className='era';era.id='phase11ArchiveEra';era.innerHTML='<header><span>05</span><h2>Phase 11 P14R</h2></header><div class="track"><a class="phase-link" href="/phases/phase11/"><span>Current research frontier</span><strong>High availability and robust uncertainty coverage, with one protected tail-efficiency boundary still visible.</strong><small>Study closed · mixed protected-validation result</small><i>→</i></a></div>';map.appendChild(era)}}else{const rail=document.querySelector('#phaseRail,.phase-rail');if(rail&&!rail.querySelector('a[href="/phases/phase11/"]')){const step=document.createElement('a');step.className='rail-step frontier';step.href='/phases/phase11/';step.innerHTML='<span>13</span><i></i><strong>Phase 11\\nP14R</strong>';rail.appendChild(step)}}});})();<\/script>`;
try{const r=await fetch(base+source,{cache:'no-store'});if(!r.ok)throw new Error('source '+r.status);let h=await r.text();if(!isArchive){h=h.replaceAll('href="cockpit.css"',`href="${base}cockpit.css"`).replaceAll('href="cockpit-extension.css"',`href="${base}cockpit-extension.css"`).replaceAll('src="hero-frame.svg"',`src="${base}hero-frame.svg"`).replaceAll('src="cockpit.js"',`src="${base}cockpit.js"`).replaceAll('src="cockpit-extension.js"',`src="${base}cockpit-extension.js"`).replaceAll('href="phase7.html"','href="/phases/phase7/"').replaceAll('phase9-external-perception-validation','main').replaceAll('phase10-temporal-metric-perception','main').replaceAll('phase10r1-p0-forensics-infrastructure','main').replaceAll('phase10r-generalization-validation','main').replaceAll('phase10r-frozen-holdout','main').replace('</head>',`<link rel="stylesheet" href="${motion}"><link rel="stylesheet" href="${legacyHero}"><link rel="stylesheet" href="${interactionCss}"><link rel="icon" type="image/svg+xml" href="${favicon}"><link rel="shortcut icon" href="/favicon.ico?v=2"></head>`).replace('</body>',`${homePatch}<script src="${cursorCubes}"><\/script><script src="${interactionJs}"><\/script></body>`)}else{if(path==='/phases/phase10r/'||path==='/phases/phase10r')h=h.replace('<body class="archive-shell">','<body class="archive-shell" data-phase="phase10r">');const assets=['phase-archive.css','phase-signatures.css','phase-responsive.css','phase-hero-scenes.css','glass-ui.css'];for(const a of assets)h=h.replaceAll(`href="/${a}"`,`href="${base}${a}"`);const scripts=['phase-data.js','phase-runtime.js','phase-signatures.js','tesla-mobile.js','phase-hero-fix.js','phase10r-archive.js','phase-hero-scenes.js'];for(const a of scripts)h=h.replaceAll(`src="/${a}"`,`src="${base}${a}"`);h=h.replaceAll('phase9-external-perception-validation','main').replaceAll('phase10-temporal-metric-perception','main').replaceAll('phase10r1-p0-forensics-infrastructure','main').replaceAll('phase10r-generalization-validation','main').replaceAll('phase10r-frozen-holdout','main').replace('</head>',`<link rel="stylesheet" href="${interactionCss}"><link rel="icon" type="image/svg+xml" href="${favicon}"><link rel="shortcut icon" href="/favicon.ico?v=2"></head>`).replace('</body>',`${archivePatch}<script src="${interactionJs}"><\/script></body>`)}h=h.replace('</head>','<link rel="stylesheet" href="/tesla-strict.css?v=2"></head>');document.open();document.write(h);document.close()}catch(e){const status=document.querySelector('small');if(status)status.textContent='AegisLand source could not be loaded.';console.error(e)}})();
</script>
</body></html>
