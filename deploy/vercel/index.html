<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#fff">
  <title>AegisLand — Research Cockpit</title>
  <link rel="icon" type="image/svg+xml" href="https://cdn.jsdelivr.net/gh/suhaslord/uav-safety-research@cc621c7ea3aec64be32c66626f33d79e46e363c0/dashboard/aegis-mark.svg">
  <style>
    html,body{margin:0;background:#fff;color:#171a20;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}
    #boot{min-height:100vh;display:grid;place-items:center}.inner{display:grid;gap:18px;justify-items:center}
    .lock{display:flex;align-items:center;gap:12px}.mark{width:44px;height:44px;display:grid;place-items:center;background:#171a20;color:#fff;border-radius:12px;box-shadow:0 10px 28px rgba(23,26,32,.18)}
    .mark img{width:44px;height:44px;display:block}.word{font-size:15px;font-weight:600;letter-spacing:.24em}small{color:#5c5e62}
  </style>
</head>
<body>
  <div id="boot"><div class="inner"><div class="lock"><span class="mark"><img src="https://cdn.jsdelivr.net/gh/suhaslord/uav-safety-research@cc621c7ea3aec64be32c66626f33d79e46e363c0/dashboard/aegis-mark.svg" alt=""></span><span class="word">AEGISLAND</span></div><small>Loading AegisLand research archive…</small></div></div>
  <script>
    (async()=>{
      const started=performance.now();
      const commit='cc621c7ea3aec64be32c66626f33d79e46e363c0';
      const base=`https://cdn.jsdelivr.net/gh/suhaslord/uav-safety-research@${commit}/dashboard/`;
      const favicon=`${base}aegis-mark.svg`;
      const path=location.pathname;
      let source='index.html',mode='home';
      if(path.startsWith('/phases/')){
        mode='archive';
        source=(path==='/phases/'||path==='/phases')?'phases/index.html':'phases/phase.html';
      }
      try{
        const r=await fetch(base+source,{cache:'no-store'});
        if(!r.ok)throw new Error('source '+r.status);
        let h=await r.text();
        if(mode==='home'){
          h=h.replaceAll('href="cockpit.css"',`href="${base}cockpit.css"`)
            .replaceAll('href="cockpit-extension.css"',`href="${base}cockpit-extension.css"`)
            .replaceAll('src="hero-frame.svg"',`src="${base}hero-frame.svg"`)
            .replaceAll('src="cockpit.js"',`src="${base}cockpit.js"`)
            .replaceAll('src="cockpit-extension.js"',`src="${base}cockpit-extension.js"`)
            .replaceAll('href="phase7.html"','href="/phases/phase7/"')
            .replaceAll('phase9-external-perception-validation','main')
            .replaceAll('phase10-temporal-metric-perception','main')
            .replaceAll('phase10r1-p0-forensics-infrastructure','main')
            .replaceAll('phase10r-generalization-validation','main')
            .replaceAll('phase10r-frozen-holdout','main')
            .replace('</head>',`<link rel="icon" type="image/svg+xml" href="${favicon}"><link rel="stylesheet" href="${base}phase-signatures.css"></head>`)
            .replace('</body>',`<script src="${base}phase-signatures.js"><\/script><script src="${base}phase10r-frontier.js"><\/script></body>`);
        }else if(mode==='archive'){
          if(path==='/phases/phase10r/'||path==='/phases/phase10r'){
            h=h.replace('<body class="archive-shell">','<body class="archive-shell" data-phase="phase10r">');
          }
          h=h.replaceAll('href="/phase-archive.css"',`href="${base}phase-archive.css"`)
            .replaceAll('href="/phase-signatures.css"',`href="${base}phase-signatures.css"`)
            .replaceAll('href="/phase-responsive.css"',`href="${base}phase-responsive.css"`)
            .replaceAll('src="/phase-data.js"',`src="${base}phase-data.js"`)
            .replaceAll('src="/phase-runtime.js"',`src="${base}phase-runtime.js"`)
            .replaceAll('src="/phase-signatures.js"',`src="${base}phase-signatures.js"`)
            .replaceAll('src="/tesla-mobile.js"',`src="${base}tesla-mobile.js"`)
            .replaceAll('src="/phase-hero-fix.js"',`src="${base}phase-hero-fix.js"`)
            .replaceAll('phase9-external-perception-validation','main')
            .replaceAll('phase10-temporal-metric-perception','main')
            .replaceAll('phase10r1-p0-forensics-infrastructure','main')
            .replaceAll('phase10r-generalization-validation','main')
            .replaceAll('phase10r-frozen-holdout','main')
            .replace('</head>',`<link rel="icon" type="image/svg+xml" href="${favicon}"></head>`)
            .replace('</body>',`<script src="${base}phase10r-archive.js"><\/script></body>`);
        }
        await new Promise(x=>setTimeout(x,Math.max(0,500-(performance.now()-started))));
        document.open();document.write(h);document.close();
      }catch(e){
        document.querySelector('small').textContent='AegisLand source could not be loaded.';
      }
    })();
  </script>
</body>
</html>
