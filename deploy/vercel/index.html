<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#fff">
  <title>AegisLand — Research Cockpit</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=4">
  <link rel="shortcut icon" href="/favicon.ico?v=4">
  <style>
    html,body{margin:0;background:#fff;color:#171a20;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}
    #boot{min-height:100vh;display:grid;place-items:center}.inner{display:grid;gap:16px;justify-items:center}
    .mark{width:44px;height:44px;border-radius:12px;background:#171a20;color:#fff;display:grid;place-items:center;font-weight:700}
    .word{font-size:14px;font-weight:650;letter-spacing:.24em}small{color:#6b6d70}
  </style>
</head>
<body>
  <div id="boot"><div class="inner"><div class="mark">A</div><div class="word">AEGISLAND</div><small>Loading research archive…</small></div></div>
  <script>
  (async () => {
    const designRev = '2b7543fe9b0794c6bec8540e5d33c16e00fa6a67';
    const patchRev = 'a721bd22928ef077e92cb74db038410c1fc5fa51';
    const base = `https://cdn.jsdelivr.net/gh/suhaslord/uav-safety-research@${designRev}/dashboard/`;
    const patchBase = `https://cdn.jsdelivr.net/gh/suhaslord/uav-safety-research@${patchRev}/deploy/vercel/`;
    const path = location.pathname;
    const isArchive = path === '/phases' || path.startsWith('/phases/');
    const isPhase11 = path === '/phases/phase11' || path === '/phases/phase11/';
    const source = isArchive
      ? (isPhase11 ? 'phases/phase11.html' : ((path === '/phases' || path === '/phases/') ? 'phases/index.html' : 'phases/phase.html'))
      : 'index.html';

    const favicon = '/favicon.svg?v=4';
    const interactionCss = `${base}global-interactions.css`;
    const interactionJs = `${base}global-interactions.js`;
    const cursorCubes = `${base}cursor-cubes.js`;
    const contentPatch = `${patchBase}content-patch.js`;
    const consistencyHotfix = `${patchBase}content-consistency-hotfix.js`;

    const branchReplacements = [
      'phase9-external-perception-validation',
      'phase10-temporal-metric-perception',
      'phase10r1-p0-forensics-infrastructure',
      'phase10r-generalization-validation',
      'phase10r-frozen-holdout'
    ];

    const normalizeBranches = html => {
      let out = html;
      for (const branch of branchReplacements) out = out.replaceAll(branch, 'main');
      return out;
    };

    const scriptTag = src => '<script src="' + src + '"></' + 'script>';

    try {
      const response = await fetch(base + source, {cache:'no-store'});
      if (!response.ok) throw new Error(`source ${response.status}`);
      let html = await response.text();

      if (!isArchive) {
        html = html
          .replaceAll('href="cockpit.css"', `href="${base}cockpit.css"`)
          .replaceAll('href="cockpit-extension.css"', `href="${base}cockpit-extension.css"`)
          .replaceAll('src="hero-frame.svg"', `src="${base}hero-frame.svg"`)
          .replaceAll('src="cockpit.js"', `src="${base}cockpit.js"`)
          .replaceAll('src="cockpit-extension.js"', `src="${base}cockpit-extension.js"`)
          .replaceAll('href="phase7.html"', 'href="/phases/phase7/"');
        html = normalizeBranches(html);
        html = html.replace('</head>',
          `<link rel="stylesheet" href="${base}glass-ui.css">` +
          `<link rel="stylesheet" href="${base}hero-legacy-interactive.css">` +
          `<link rel="stylesheet" href="${interactionCss}">` +
          `<link rel="icon" type="image/svg+xml" href="${favicon}">` +
          '<link rel="shortcut icon" href="/favicon.ico?v=4"></head>'
        );
        html = html.replace('</body>',
          scriptTag(contentPatch) +
          scriptTag(consistencyHotfix) +
          scriptTag(cursorCubes) +
          scriptTag(interactionJs) +
          '</body>'
        );
      } else {
        if (path === '/phases/phase10r' || path === '/phases/phase10r/') {
          html = html.replace('<body class="archive-shell">', '<body class="archive-shell" data-phase="phase10r">');
        }
        for (const asset of ['phase-archive.css','phase-signatures.css','phase-responsive.css','phase-hero-scenes.css','glass-ui.css']) {
          html = html.replaceAll(`href="/${asset}"`, `href="${base}${asset}"`);
        }
        for (const asset of ['phase-data.js','phase-runtime.js','phase-signatures.js','tesla-mobile.js','phase-hero-fix.js','phase10r-archive.js','phase-hero-scenes.js']) {
          html = html.replaceAll(`src="/${asset}"`, `src="${base}${asset}"`);
        }
        html = normalizeBranches(html);
        html = html.replace('</head>',
          `<link rel="stylesheet" href="${interactionCss}">` +
          `<link rel="icon" type="image/svg+xml" href="${favicon}">` +
          '<link rel="shortcut icon" href="/favicon.ico?v=4"></head>'
        );
        html = html.replace('</body>',
          scriptTag(contentPatch) +
          scriptTag(consistencyHotfix) +
          scriptTag(interactionJs) +
          '</body>'
        );
      }

      document.open();
      document.write(html);
      document.close();
    } catch (error) {
      const status = document.querySelector('#boot small');
      if (status) status.textContent = 'AegisLand source could not be loaded.';
      console.error(error);
    }
  })();
  </script>
</body>
</html>
