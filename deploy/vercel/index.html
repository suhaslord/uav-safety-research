<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#fff">
  <title>AegisLand — Research Cockpit</title>
  <style>
    html,body{margin:0;background:#fff;color:#171a20;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}
    #boot{min-height:100vh;display:grid;place-items:center}.inner{display:grid;gap:16px;justify-items:center}.mark{width:44px;height:44px;border-radius:12px;background:#171a20;color:#fff;display:grid;place-items:center;font-weight:700}.word{font-size:14px;font-weight:650;letter-spacing:.24em}small{color:#6b6d70}
  </style>
</head>
<body>
<div id="boot"><div class="inner"><div class="mark">A</div><div class="word">AEGISLAND</div><small>Loading research archive…</small></div></div>
<script>
(async()=>{
  const rev='7e0e4ff65ac9036fe2c70ae0a64a7b4835fb2b7f';
  const base=`https://cdn.jsdelivr.net/gh/suhaslord/uav-safety-research@${rev}/dashboard/`;
  const favicon=`${base}aegis-mark.svg`;
  const motion=`${base}glass-ui.css`;
  const legacyHero=`${base}hero-legacy-interactive.css`;
  const cursorCubes=`${base}cursor-cubes.js`;
  const interactionCss=`${base}global-interactions.css`;
  const interactionJs=`${base}global-interactions.js`;
  const path=location.pathname;
  const isArchive=path.startsWith('/phases/');
  const source=isArchive?((path==='/phases/'||path==='/phases')?'phases/index.html':'phases/phase.html'):'index.html';
  const homePatch=`<script>(()=>{
    const q=(s)=>document.querySelector(s),qa=(s)=>[...document.querySelectorAll(s)];
    document.title='AegisLand — Phase 10R Frozen Frontier';
    const desc=q('meta[name="description"]');if(desc)desc.content='AegisLand Phase 10R frozen holdout — simulation-only perception reliability research.';
    const phase=q('.site-header .phase-link');if(phase){phase.textContent='Phase 10R';phase.href='/phases/phase10r/'}
    const kicker=q('main .hero .kicker');if(kicker)kicker.textContent='simulation-only research · latest published frontier';
    const sub=q('main .hero .hero-subtitle');if(sub)sub.textContent='Phase 10R frozen holdout: mean error fell, but tail risk and calibration still broke under shift.';
    const actions=qa('main .hero .hero-actions a');if(actions[0]){actions[0].textContent='Open Phase 10R';actions[0].href='/phases/phase10r/'}if(actions[1]){actions[1].textContent='Read frozen record';actions[1].href='https://github.com/suhaslord/uav-safety-research/blob/main/docs/phase10r_frozen_holdout_result.md'}
    const meta=q('main .hero .hero-meta');if(meta)meta.innerHTML='<span>Phase 10R</span><span>phase10r_frozen_holdout</span><span>mixed / failed overall</span><span>safety acceptance: false</span>';
    const tele=q('main .hero .hero-telemetry');if(tele)tele.innerHTML='<span><strong>1,440</strong><small>truth-visible frames</small></span><span><strong>36</strong><small>holdout sequences</small></span><span><strong>0.0%</strong><small>false positives</small></span>';
    const word=q('.site-header .wordmark');if(word)word.innerHTML='<span style="width:28px;height:28px;border-radius:9px;background:#171a20;color:#fff;display:inline-grid;place-items:center;margin-right:9px;font-size:12px">A</span><span>AEGISLAND</span>';
    const hero=q('main .hero');if(hero&&!q('#homeModelRail')){const phases=['1','2','3','4','5','6','6b','7','8','9','10','10r'];const rail=document.createElement('section');rail.id='homeModelRail';rail.style.cssText='background:#fff;border-top:1px solid rgba(23,26,32,.08);border-bottom:1px solid rgba(23,26,32,.08);padding:22px clamp(20px,5vw,72px);overflow-x:auto';rail.innerHTML='<div style="display:flex;justify-content:space-between;gap:20px;margin-bottom:16px"><div><div style="font-size:10px;letter-spacing:.13em;color:#6b6d70;text-transform:uppercase">Research progression</div><strong style="font-size:13px">Every model stays reachable.</strong></div><a class="home-archive-link" href="/phases/" style="font-size:11px">Open full archive ↗</a></div><div class="home-rail-grid" style="display:grid;grid-template-columns:repeat(12,minmax(76px,1fr));min-width:980px;gap:0">'+phases.map((p,i)=>'<a class="home-rail-step '+(p==='10r'?'active':'')+'" href="/phases/phase'+p+'/" style="text-align:center;font-size:10px;font-weight:'+(p==='10r'?'700':'500')+'">'+String(i+1).padStart(2,'0')+'<br>Phase '+(p==='10r'?'10R':p.toUpperCase())+'</a>').join('')+'</div>';hero.insertAdjacentElement('afterend',rail)}
  })();<\/script>`;
  try{
    const r=await fetch(base+source,{cache:'no-store'});if(!r.ok)throw new Error('source '+r.status);let h=await r.text();
    if(!isArchive){
      h=h.replaceAll('href="cockpit.css"',`href="${base}cockpit.css"`)
        .replaceAll('href="cockpit-extension.css"',`href="${base}cockpit-extension.css"`)
        .replaceAll('src="hero-frame.svg"',`src="${base}hero-frame.svg"`)
        .replaceAll('src="cockpit.js"',`src="${base}cockpit.js"`)
        .replaceAll('src="cockpit-extension.js"',`src="${base}cockpit-extension.js"`)
        .replaceAll('href="phase7.html"','href="/phases/phase7/"')
        .replaceAll('phase9-external-perception-validation','main')
        .replaceAll('phase10-temporal-metric-perception','main')
        .replaceAll('phase10r1-p0-forensics-infrastructure','main')
        .replaceAll('phase10r-generalization-validation','main')
        .replaceAll('phase10r-frozen-holdout','main')
        .replace('</head>',`<link rel="stylesheet" href="${motion}"><link rel="stylesheet" href="${legacyHero}"><link rel="stylesheet" href="${interactionCss}"><link rel="icon" type="image/svg+xml" href="${favicon}"></head>`)
        .replace('</body>',`${homePatch}<script src="${cursorCubes}"><\/script><script src="${interactionJs}"><\/script></body>`);
    }else{
      if(path==='/phases/phase10r/'||path==='/phases/phase10r')h=h.replace('<body class="archive-shell">','<body class="archive-shell" data-phase="phase10r">');
      const assets=['phase-archive.css','phase-signatures.css','phase-responsive.css','phase-hero-scenes.css','glass-ui.css'];
      for(const a of assets)h=h.replaceAll(`href="/${a}"`,`href="${base}${a}"`);
      const scripts=['phase-data.js','phase-runtime.js','phase-signatures.js','tesla-mobile.js','phase-hero-fix.js','phase10r-archive.js','phase-hero-scenes.js'];
      for(const a of scripts)h=h.replaceAll(`src="/${a}"`,`src="${base}${a}"`);
      h=h.replaceAll('phase9-external-perception-validation','main')
        .replaceAll('phase10-temporal-metric-perception','main')
        .replaceAll('phase10r1-p0-forensics-infrastructure','main')
        .replaceAll('phase10r-generalization-validation','main')
        .replaceAll('phase10r-frozen-holdout','main')
        .replace('</head>',`<link rel="stylesheet" href="${interactionCss}"><link rel="icon" type="image/svg+xml" href="${favicon}"></head>`)
        .replace('</body>',`<script src="${interactionJs}"><\/script></body>`);
    }
    document.open();document.write(h);document.close();
  }catch(e){const status=document.querySelector('small');if(status)status.textContent='AegisLand source could not be loaded.';console.error(e)}
})();
</script>
</body>
</html>
