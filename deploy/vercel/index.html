der compound shift.';const phase=q('.site-header .phase-link');if(phase){phase.textContent='Phase 11';phase.href='/phases/phase11/'}const kicker=q('main .hero .kicker');if(kicker)kicker.textContent='simulation-only research · strongest AegisLand model yet';const sub=q('main .hero .hero-subtitle');if(sub)sub.textContent='P14R passed every required seen-transfer gate and preserved ~96% protected 95% coverage with 98.53% availability. One locked lateral tail-efficiency gate stopped final confirmation.';const actionStyle=document.createElement('style');actionStyle.textContent='.hero-actions{justify-content:flex-start!important;align-items:center!important;gap:12px!important;margin-left:0!important;margin-right:0!important;width:100%!important}.hero-actions a{flex:0 0 auto!important;width:auto!important;min-width:164px!important;margin:0!important;padding-left:24px!important;padding-right:24px!important}@media(max-width:560px){.hero-actions{display:grid!important;grid-template-columns:1fr!important}.hero-actions a{width:100%!important;min-width:0!important}}';document.head.appendChild(actionStyle);const actions=qa('main .hero .hero-actions a');if(actions[0]){actions[0].textContent='Open Phase 11';actions[0].href='/phases/phase11/'}if(actions[1]){actions[1].textContent='Read final report';actions[1].href='https://github.com/suhaslord/uav-safety-research/blob/main/docs/phase11_final_report.md'}const meta=q('main .hero .hero-meta');if(meta)meta.innerHTML='<span>Phase 11 · P14R</span><span>robust groupwise conformal envelope</span><span>strongest yet · mixed protected result</span><span>safety acceptance: false</span>';const tele=q('main .hero .hero-telemetry');if(tele)tele.innerHTML='<span><strong>98.53%</strong><small>protected availability</small></span><span><strong>96.17%</strong><small>lateral 95% coverage</small></span><span><strong>94.63%</strong><small>rescue recovery</small></span>';const word=q('.site-header .wordmark');if(word)word.innerHTML='<span style="width:2 lementById('phase11ArchiveEra')){const era=document.createElement('section');era.className='era';era.id='phase11ArchiveEra';era.innerHTML='<header><span>05</span><h2>Phase 11 · Reliability frontier</h2></header><div class="track"><a class="phase-link" href="/phases/phase11/"><span>Phase 11 · P14R</span><strong>Strongest AegisLand model yet: robust coverage, high availability, one protected tail-efficiency boundary.</strong><small>Study closed · mixed protected-validation result</small><i>→</i></a></div>';map.appendChild(era)}}else if(location.pathname!='/phases/phase11/'&&location.pathname!='/phases/phase11'){const rail=document.querySelector('#phaseRail,.phase-rail');if(rail&&!rail.querySelector('a[href="/phases/phase11/"]')){const step=document.createElement('a');step.className='rail-step frontier';step.href='/phases/phase11/';step.innerHTML='<span>13</span><i></i><strong>Phase 11\nP14R</strong>';rail.appendChild(step)}}});})();<\/script>`;try{const r=await fetch(base+source,{cache:'no-store'});if(!r.ok)throw new Error('source '+r.status);let h=await r.text();if(!isArchive){h=h.replaceAll('href="cockpit.css"',`href="${base}cockpit.css"`).replaceAll('href="cockpit-extension.css"',`href="${base}cockpit-extension.css"`).replaceAll('src="hero-frame.svg"',`src="${base}hero-frame.svg"`).replaceAll('src="cockpit.js"',`src="${base}cockpit.js"`).replaceAll('src="cockpit-extension.js"',`src="${base}cockpit-extension.js"`).replaceAll('href="phase7.html"','href="/phases/phase7/"').replaceAll('phase9-external-perception-validation','main').replaceAll('phase10-temporal-metric-perception','main').replaceAll('phase10r1-p0-forensics-infrastructure','main').replaceAll('phase10r-generalization-validation','main').replaceAll('phase10r-frozen-holdout','main').replace('</head>',`<link rel="stylesheet" href="${motion}"><link rel="stylesheet" href="${legacyHero}"><link rel="stylesheet" href="${interactionCss}"><link rel="icon" type="image/svg+xml" href="${favicon}"><link rel="shortcut icon" href="/favicon.ico?v=2"></head>`).replace('</body>',`${homePatch}<script src="${cursorCubes}"><\/script><script src="${interactionJs}"><\/script></body>`)}else{if(path==='/phases/phase10r/'||path==='/phases/phase10r')h=h.replace('<body class="archive-shell">','<body class="archive-shell" data-phase="phase10r">');const assets=['phase-archive.css','phase-signatures.css','phase-responsive.css','phase-hero-scenes.css','glass-ui.css'];for(const a of assets)h=h.replaceAll(`href="/${a}"`,`href="${base}${a}"`);const scripts=['phase-data.js','phase-runtime.js','phase-signatures.js','tesla-mobile.js','phase-hero-fix.js','phase10r-archive.js','phase-hero-scenes.js'];for(const a of scripts)h=h.replaceAll(`src="/${a}"`,`src="${base}${a}"`);h=h.replaceAll('phase9-external-perception-validation','main').replaceAll('phase10-temporal-metric-perception','main').replaceAll('phase10r1-p0-forensics-infrastructure','main').replaceAll('phase10r-generalization-validation','main').replaceAll('phase10r-frozen-holdout','main').replace('</head>',`<link rel="stylesheet" href="${interactionCss}"><link rel="icon" type="image/svg+xml" href="${favicon}"><link rel="shortcut icon" href="/favicon.ico?v=2"></head>`).replace('</body>',`${archivePatch}<script src="${interactionJs}"><\/script></body>`)}document.open();document.write(h);document.close()}catch(e){const status=document.querySelector('small');if(status)status.textContent='AegisLand source could not be loaded.';console.error(e)}})();</script></body></html>
