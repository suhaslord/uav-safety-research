<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" role="img">
  <title>Phase 10R miss forensics</title>
  <rect width="1200" height="420" fill="#0B1220"/>
  <text x="40" y="48" fill="#E8EEF7" font-family="Georgia, serif" font-size="26" font-weight="700">Read-only miss forensics</text>
  <text x="40" y="78" fill="#9AA8BC" font-family="ui-sans-serif,sans-serif" font-size="14">Descriptive geometry only — not a detector threshold</text>
  <rect x="60" y="120" width="520" height="240" rx="12" fill="#121A2B" stroke="#334155" stroke-width="2"/>
  <rect x="90" y="150" width="460" height="180" fill="#0B1220" stroke="#1E2A3F"/>
  <rect x="95" y="200" width="70" height="70" fill="#080808" stroke="#FB7185" stroke-width="2"/>
  <rect x="108" y="213" width="18" height="18" fill="#D1D5DB"/>
  <rect x="130" y="225" width="22" height="22" fill="#D1D5DB"/>
  <text x="180" y="235" fill="#FB7185" font-family="ui-monospace,monospace" font-size="14">edge / partial footprint</text>
  <text x="180" y="258" fill="#9AA8BC" font-family="ui-sans-serif,sans-serif" font-size="13">4/5 misses: edge-margin ratio &lt; 1.0</text>
  <rect x="640" y="120" width="500" height="240" rx="12" fill="#121A2B" stroke="#1E2A3F"/>
  <text x="670" y="160" fill="#2DD4BF" font-family="ui-monospace,monospace" font-size="14">TRUTH-VISIBLE MISSES</text>
  <text x="670" y="200" fill="#E8EEF7" font-family="ui-monospace,monospace" font-size="14">frames  27 · 35 · 36 · 46 · 47</text>
  <text x="670" y="235" fill="#9AA8BC" font-family="ui-sans-serif,sans-serif" font-size="14">median miss edge-margin  0.480</text>
  <text x="670" y="265" fill="#9AA8BC" font-family="ui-sans-serif,sans-serif" font-size="14">median detect edge-margin  2.656</text>
  <text x="670" y="300" fill="#F59E0B" font-family="ui-sans-serif,sans-serif" font-size="14">no threshold selected from these frames</text>
  <text x="670" y="330" fill="#FB7185" font-family="ui-monospace,monospace" font-size="14">Phase 10R preregistration: PENDING</text>
</svg>
