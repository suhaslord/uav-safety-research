<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" role="img">
  <title>Phase 10 gate scorecard</title>
  <rect width="1200" height="380" fill="#0B1220"/>
  <text x="40" y="48" fill="#E8EEF7" font-family="Georgia, serif" font-size="26" font-weight="700">Phase 10 preregistered gate scorecard</text>
  <text x="40" y="78" fill="#9AA8BC" font-family="ui-sans-serif,sans-serif" font-size="14">Frozen after exposure — no retuning</text>
  <rect x="40" y="110" width="540" height="220" rx="14" fill="#121A2B" stroke="#34D399" stroke-width="2"/>
  <text x="70" y="155" fill="#34D399" font-family="ui-monospace,monospace" font-size="16">PASSED</text>
  <text x="70" y="195" fill="#E8EEF7" font-family="ui-sans-serif,sans-serif" font-size="15">metric availability drop ≤ 2 pp</text>
  <text x="70" y="225" fill="#E8EEF7" font-family="ui-sans-serif,sans-serif" font-size="15">no false-positive regression</text>
  <text x="70" y="255" fill="#E8EEF7" font-family="ui-sans-serif,sans-serif" font-size="15">median norm. residual &lt; 2 (both axes)</text>
  <text x="70" y="295" fill="#9AA8BC" font-family="ui-sans-serif,sans-serif" font-size="13">uncertainty honesty generalized</text>
  <rect x="620" y="110" width="540" height="220" rx="14" fill="#121A2B" stroke="#FB7185" stroke-width="2"/>
  <text x="650" y="155" fill="#FB7185" font-family="ui-monospace,monospace" font-size="16">FAILED</text>
  <text x="650" y="195" fill="#E8EEF7" font-family="ui-sans-serif,sans-serif" font-size="15">≥50% lateral MAE reduction</text>
  <text x="650" y="225" fill="#E8EEF7" font-family="ui-sans-serif,sans-serif" font-size="15">≥50% altitude MAE reduction</text>
  <text x="650" y="255" fill="#E8EEF7" font-family="ui-sans-serif,sans-serif" font-size="15">≥35% lateral / altitude p95 reduction</text>
  <text x="650" y="295" fill="#9AA8BC" font-family="ui-sans-serif,sans-serif" font-size="13">ArUco-only holdout left no point-error to rescue</text>
</svg>
