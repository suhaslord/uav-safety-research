<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
  <title id="title">Phase 9 ArUco target motif</title>
  <desc id="desc">A crisp, simplified visual motif based on the landing target used in the Phase 9 Gazebo camera validation.</desc>
  <rect width="1200" height="900" fill="#d2d2d2"/>
  <g transform="translate(660 470) rotate(-27)">
    <rect x="-235" y="-235" width="470" height="470" fill="#080808"/>
    <rect x="-135" y="-100" width="92" height="92" fill="#a7a7a7"/>
    <rect x="-42" y="-42" width="112" height="112" fill="#a7a7a7"/>
    <rect x="70" y="-145" width="150" height="150" fill="#a7a7a7"/>
    <rect x="74" y="-10" width="82" height="202" fill="#a7a7a7"/>
    <rect x="28" y="-28" width="78" height="78" fill="#080808"/>
  </g>
  <g fill="#8c8c8c" opacity="0.85">
    <rect x="88" y="82" width="92" height="20" transform="rotate(54 88 82)"/>
    <rect x="250" y="30" width="118" height="18" transform="rotate(67 250 30)"/>
    <rect x="1045" y="62" width="88" height="16" transform="rotate(105 1045 62)"/>
  </g>
</svg>
