<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#0b1118">
  <meta name="description" content="AegisLand frozen simulation-only research phase detail.">
  <title>AegisLand — Frozen phase</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=5">
  <link rel="stylesheet" href="/aegisland.css?v=4">
  <link rel="stylesheet" href="/phase-polish.css?v=1">
  <link rel="stylesheet" href="/phase-polish-fixes.css?v=1">
  <link rel="stylesheet" href="/phase-polish-v2.css?v=1">
  <link rel="stylesheet" href="/phase-personalization.css?v=1">
  <link rel="stylesheet" href="/research-workspace.css?v=1">
</head>
<body class="phase-polish-shell research-workspace">
  <a class="skip-link" href="#phaseRoot">Skip to phase result</a>
  <header class="signature-nav">
    <a class="signature-brand" href="/" aria-label="AegisLand home"><span class="signature-brand__mark" aria-hidden="true"></span><span>AEGISLAND</span></a>
    <nav class="signature-nav__links" aria-label="Frozen phase navigation"><a href="/phases/">All phases</a><a href="/">Research home</a><a href="https://github.com/suhaslord/uav-safety-research" target="_blank" rel="noreferrer">GitHub ↗</a></nav>
    <button class="mobile-menu-toggle" id="mobileMenuToggle" type="button" aria-expanded="false" aria-controls="mobileMenuSheet">Menu</button>
  </header>

  <nav class="mobile-menu-sheet" id="mobileMenuSheet" aria-label="Mobile navigation" aria-hidden="true">
    <div class="mobile-menu-head"><strong>AEGISLAND</strong><button class="mobile-menu-close" type="button" aria-label="Close navigation">Close</button></div>
    <div class="mobile-menu-links"><a href="/phases/">All phases</a><a href="/">Research home</a><a href="/phases/phase22/">Current evidence</a></div>
    <div class="mobile-menu-meta"><a href="/phases/">Archive</a><a href="https://github.com/suhaslord/uav-safety-research" target="_blank" rel="noreferrer">GitHub ↗</a></div>
  </nav>

  <main class="signature-shell phase-detail" id="phaseRoot">
    <a class="phase-detail__back" href="/phases/">← ALL PHASES</a>
    <div id="phaseContent" aria-live="polite"></div>
  </main>

  <footer class="signature-footer"><div class="signature-shell signature-footer__inner"><div>AegisLand · frozen simulation-only research archive</div><div><code>simulation_only=true · safety_acceptance=false · controller_tuning_allowed=false</code></div></div></footer>

  <script src="/phase-taxonomy.js?v=1"></script>
  <script src="/frozen-lineage.js?v=3"></script>
  <script>
    (() => {
      const lineage = window.AEGIS_FROZEN_LINEAGE;
      const taxonomy = window.AEGIS_PHASE_TAXONOMY;
      const match = location.pathname.match(/\/phases\/(phase(?:12|13a|13b|13c|1[4-9]|2[0-2]))\/?$/i);
      const slug = match ? match[1].toLowerCase() : '';
      const phase = lineage && lineage.bySlug[slug];
      const root = document.getElementById('phaseContent');
      if (!phase) {
        document.title = 'AegisLand — Phase not found';
        root.innerHTML = `<section class="archive-hero"><div class="signature-kicker">Archive lookup</div><h1>That phase is not in this frozen archive.</h1><p>Use the archive page to open one of the published Phase 12–22 records.</p><div class="signature-actions"><a class="signature-button signature-button--primary" href="/phases/">Open all phases</a></div></section>`;
        return;
      }

      const meta = taxonomy?.bySlug?.[slug];
      const category = meta ? taxonomy?.categoryById?.[meta.category] : null;
      document.title = `${phase.label} — ${phase.title} · AegisLand`;
      const phaseIndex = lineage.phases.findIndex((item) => item.slug === slug);
      const prev = lineage.phases[phaseIndex - 1];
      const next = lineage.phases[phaseIndex + 1];
      const metrics = phase.metrics.map(([label, value]) => `<div class="phase-metric"><strong>${value}</strong><span>${label}</span></div>`).join('');
      const hashes = [
        phase.resultSha ? `<div class="phase-hash">result / evidence SHA<br>${phase.resultSha}</div>` : '',
        phase.candidateSha ? `<div class="phase-hash">frozen candidate SHA<br>${phase.candidateSha}</div>` : ''
      ].join('');
      const verdictClass = phase.verdict === 'PASS' ? 'verdict-chip--pass' : 'verdict-chip--fail';

      root.innerHTML = `
        <section class="phase-detail__hero">
          <div>
            <div class="workspace-context"><span>${category ? category.name : 'Frozen evidence'}</span><span>${phase.label}</span><span>${phase.stage}</span></div>
            <div class="signature-kicker">Frozen evidence record</div>
            <h1>${phase.title}</h1>
            <p class="phase-detail__summary">${phase.summary}</p>
          </div>
          <aside class="phase-verdict-panel" data-verdict="${phase.verdict}" aria-label="Locked phase verdict">
            <span>LOCKED VERDICT</span>
            <strong>${phase.verdict}</strong>
            <span>${phase.note}</span>
          </aside>
        </section>

        <section class="phase-detail__metrics-band" aria-label="Evidence snapshot">${metrics}</section>

        <section class="phase-detail__body">
          <article class="phase-detail__panel">
            <span class="phase-detail__eyebrow">Recorded finding</span>
            <h2>What this phase supports.</h2>
            <p>${phase.finding}</p>
            <div class="claim-boundary"><b>EVIDENCE BOUNDARY //</b> ${lineage.boundary.statement}</div>
          </article>
          <aside class="phase-detail__panel phase-detail__panel--evidence">
            <span class="phase-detail__eyebrow">Source integrity</span>
            <div style="display:flex;justify-content:space-between;align-items:center;gap:12px"><h2 style="font-size:24px;margin:0">Frozen record</h2><span class="verdict-chip ${verdictClass}">${phase.verdict}</span></div>
            <p>This page is tied to the frozen lineage. Hashes are shown when the phase record publishes them; later phases cannot rewrite this verdict.</p>
            ${hashes || '<div class="phase-hash">No phase-specific result hash is published in this compact lineage record.</div>'}
          </aside>
        </section>

        <section class="phase-detail__context">
          <div class="phase-detail__context-grid">
            <div><span class="phase-detail__eyebrow">Why it stays frozen</span><h2>${phase.note}</h2></div>
            <p>A later phase can ask a new question, but it cannot go back and change this result. Passes and failures stay visible so the lineage can be checked without hindsight edits.</p>
          </div>
        </section>

        <nav class="phase-detail__nav" aria-label="Frozen phase navigation">
          ${prev ? `<a class="signature-button" href="/phases/${prev.slug}/">← ${prev.label}</a>` : '<a class="signature-button" href="/phases/phase11/">← Phase 11</a>'}
          ${next ? `<a class="signature-button signature-button--primary" href="/phases/${next.slug}/">${next.label} →</a>` : '<a class="signature-button signature-button--primary" href="/">Research home →</a>'}
        </nav>`;
    })();

    (() => {
      const b = document.getElementById('mobileMenuToggle');
      const m = document.getElementById('mobileMenuSheet');
      const c = m.querySelector('.mobile-menu-close');
      const set = (open) => {
        b.setAttribute('aria-expanded', String(open));
        m.setAttribute('aria-hidden', String(!open));
        m.classList.toggle('open', open);
        document.body.classList.toggle('menu-open', open);
      };
      b.addEventListener('click', () => set(b.getAttribute('aria-expanded') !== 'true'));
      c.addEventListener('click', () => set(false));
      m.querySelectorAll('a').forEach((a) => a.addEventListener('click', () => set(false)));
      document.addEventListener('keydown', (event) => { if (event.key === 'Escape') set(false); });
    })();
  </script>
  <script src="/phase-personalization.js?v=1"></script>
  <script src="/research-workspace.js?v=1"></script>
</body>
</html>
