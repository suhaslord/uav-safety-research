name: Phase 6E Perception Confirmation

on:
  push:
    paths:
      - '.github/workflows/phase6e-perception-confirmation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  perception-confirmation:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Full test suite
        run: pytest -q
      - name: Run preregistered Phase 6E confirmation
        run: |
          python scripts/run_phase6e_perception_confirmation.py \
            --samples 40 \
            --calibration-seed 616161 \
            --out results/phase6e_perception_confirmation
      - name: Upload Phase 6E confirmation artifact
        uses: actions/upload-artifact@v4
        with:
          name: phase6e-perception-confirmation
          path: results/phase6e_perception_confirmation
          if-no-files-found: error
          retention-days: 60
