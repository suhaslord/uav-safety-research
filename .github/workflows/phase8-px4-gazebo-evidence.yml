name: Phase 8 PX4 Gazebo Evidence

on:
  workflow_dispatch:
  push:
    branches:
      - phase8-px4-gazebo-evidence

jobs:
  px4-gazebo-evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install AegisLand evidence dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" pyulog mavsdk

      - name: Verify frozen Phase 8 comparison head is ancestor
        run: |
          git merge-base --is-ancestor bd62e3b31431306fd9d897f560be7325d711d21a HEAD
          git diff --exit-code bd62e3b31431306fd9d897f560be7325d711d21a -- \
            src/uav_safety/trace_validation.py \
            src/uav_safety/external_trace.py \
            scripts/run_phase8_trace_validation.py

      - name: Export genuine frozen Phase 7 surrogate trace
        run: |
          mkdir -p /tmp/phase8-evidence
          python scripts/export_phase7_surrogate_trace.py \
            --seed 979797 \
            --calibration-seed 616161 \
            --condition clean \
            --out /tmp/phase8-evidence/phase7_surrogate.csv \
            --metadata-out /tmp/phase8-evidence/phase7_surrogate_metadata.json

      - name: Clone pinned PX4 stable release
        run: |
          git clone --branch v1.17.0 --depth 1 --recursive https://github.com/PX4/PX4-Autopilot.git /tmp/PX4-Autopilot
          git -C /tmp/PX4-Autopilot rev-parse HEAD | tee /tmp/phase8-evidence/px4_git_sha.txt

      - name: Install PX4 SITL and Gazebo dependencies
        run: |
          sudo env DEBIAN_FRONTEND=noninteractive bash /tmp/PX4-Autopilot/Tools/setup/ubuntu.sh --no-nuttx

      - name: Start PX4 SITL with Gazebo X500 vision model
        run: |
          cd /tmp/PX4-Autopilot
          export HEADLESS=1
          export PX4_SIM_SPEED_FACTOR=1
          export PX4_PARAM_SDLOG_PROFILE=129
          export PX4_PARAM_COM_RCL_EXCEPT=4
          (make px4_sitl gz_x500_vision </dev/null > /tmp/phase8-evidence/px4_gazebo.log 2>&1) &
          echo $! > /tmp/phase8-evidence/px4_make.pid

      - name: Run reproducible PX4/Gazebo mission
        run: |
          set +e
          timeout --signal=TERM --kill-after=15s 240s \
            python scripts/run_px4_gazebo_mission.py \
              --connection udpin://0.0.0.0:14540 \
              --metadata-out /tmp/phase8-evidence/px4_mission_metadata.json
          status=$?
          if [ "$status" -ne 0 ]; then
            echo "PX4/Gazebo mission failed or timed out with status $status"
            echo "--- tail of PX4/Gazebo log ---"
            tail -n 300 /tmp/phase8-evidence/px4_gazebo.log || true
            exit "$status"
          fi

      - name: Stop simulator and locate raw ULog
        if: always()
        run: |
          sleep 5
          if [ -f /tmp/phase8-evidence/px4_make.pid ]; then
            kill "$(cat /tmp/phase8-evidence/px4_make.pid)" || true
          fi
          sleep 2
          find /tmp/PX4-Autopilot -type f -name '*.ulg' -print | sort | tee /tmp/phase8-evidence/ulog_candidates.txt
          ULOG="$(find /tmp/PX4-Autopilot -type f -name '*.ulg' -printf '%T@ %p\n' | sort -n | tail -1 | cut -d' ' -f2-)"
          if [ -n "$ULOG" ] && [ -f "$ULOG" ]; then
            cp "$ULOG" /tmp/phase8-evidence/px4_gazebo_raw.ulg
          fi

      - name: Require and convert genuine PX4 ULog
        run: |
          test -s /tmp/phase8-evidence/px4_gazebo_raw.ulg
          python scripts/px4_ulog_to_phase8_trace.py \
            /tmp/phase8-evidence/px4_gazebo_raw.ulg \
            --out /tmp/phase8-evidence/px4_gazebo_external.csv \
            --metadata-out /tmp/phase8-evidence/px4_trace_metadata.json \
            --rate-hz 20

      - name: Run frozen Phase 8 comparison on real external simulator trace
        run: |
          python scripts/run_phase8_trace_validation.py \
            /tmp/phase8-evidence/phase7_surrogate.csv \
            /tmp/phase8-evidence/px4_gazebo_external.csv \
            --out /tmp/phase8-evidence/comparison \
            --git-sha "$GITHUB_SHA" \
            --external-evidence-status external_simulator_seen \
            --surrogate-source "frozen Phase 7 simulator at bd62e3b31431306fd9d897f560be7325d711d21a" \
            --external-source "PX4 v1.17.0 SITL + Gazebo gz_x500_vision; raw ULog preserved"
          python scripts/validate_result_manifest.py \
            /tmp/phase8-evidence/comparison/result_manifest.json \
            --schema aegisland.phase8.result-bundle.v1

      - name: Write evidence provenance receipt
        run: |
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          root = Path('/tmp/phase8-evidence')
          def h(name):
              p = root / name
              return hashlib.sha256(p.read_bytes()).hexdigest()
          comparison = json.loads((root/'comparison/trace_comparison.json').read_text())
          receipt = {
              'aegis_evidence_branch_sha': os.environ['GITHUB_SHA'],
              'frozen_phase8_head': 'bd62e3b31431306fd9d897f560be7325d711d21a',
              'px4_release': 'v1.17.0',
              'px4_git_sha': (root/'px4_git_sha.txt').read_text().strip(),
              'raw_ulog_sha256': h('px4_gazebo_raw.ulg'),
              'external_trace_sha256': h('px4_gazebo_external.csv'),
              'surrogate_trace_sha256': h('phase7_surrogate.csv'),
              'external_evidence_status': comparison['external_evidence_status'],
              'claim_level': comparison['claim_level'],
              'overall_diagnostic': comparison['overall_diagnostic'],
              'status_counts': comparison['status_counts'],
              'comparison_input_hashes': comparison['input_hashes'],
              'safety_acceptance': comparison['safety_acceptance'],
              'controller_tuning_allowed': comparison['controller_tuning_allowed'],
          }
          (root/'evidence_receipt.json').write_text(json.dumps(receipt, indent=2, sort_keys=True)+'\n')
          print(json.dumps(receipt, indent=2))
          assert receipt['external_evidence_status'] == 'external_simulator_seen'
          assert receipt['safety_acceptance'] is False
          assert receipt['controller_tuning_allowed'] is False
          PY

      - name: Upload genuine PX4/Gazebo evidence bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase8-px4-gazebo-evidence
          path: /tmp/phase8-evidence
          if-no-files-found: error
          retention-days: 30
