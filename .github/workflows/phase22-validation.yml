name: Phase 22 frozen additive context transfer protected validation

on:
  push:
    branches: [phase22/frozen-additive-context-transfer]
    paths:
      - .github/workflows/phase22-validation.yml

permissions:
  contents: read
  actions: read

env:
  P22_TRANSFER_RUN: '34042700363'
  P22_TRANSFER_SCI: 5a4acab87796dbbf36fdef85101b84f45c5717b9
  P22_TRANSFER_RESULT_SHA: af8d9f5f95e1e86a550cc98a9f40e27548279e89c3b969f8f78db2cd51d115ab
  P22_FIT_RUN: '34042362702'
  P22_FIT_CANDIDATE_SHA: 62e75d7b39088c2e66f1cc6be4d180501b79632f2f6847af1fbe0bd96be17551
  P12_RUN: '34004695243'
  P12_SHA: e2372ca597cdd983f098f1a45524c077798114c59a62bf9faccefd17b67a4991
  P14_RUN: '34010431456'
  P14_SHA: 0443d4e45a1966c77544c5c9965de8caec6e622c79ef8c2ce47aee82a3c95981
  P17_FIT_RUN: '34011621058'
  P17_FIT_SHA: 2ca52a418f5616e0e83ef84d0c9238ee429260cd4de7a553356b0c1bba44d8e0
  P21_FINAL_RUN: '34015012804'
  P21_FINAL_SHA: bc85a746cf1b770fb4119feb3979789975ed5201065d94de47c6dcc3a051d9ee
  P22_VALIDATION_SEED: '2222223'

jobs:
  validation:
    runs-on: ubuntu-24.04
    steps:
      - name: Guard evidence exposure
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          T=$(gh api '/repos/${{ github.repository }}/actions/artifacts?name=phase22-transfer&per_page=100' --jq '[.artifacts[]|select(.expired==false)]|length')
          V=$(gh api '/repos/${{ github.repository }}/actions/artifacts?name=phase22-validation&per_page=100' --jq '[.artifacts[]|select(.expired==false)]|length')
          test "$T" = 1
          test "$V" = 0 || { echo "Phase 22 validation artifact already exists"; exit 1; }

      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }

      - name: Verify scientific implementation remained frozen after transfer
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pytest -q tests/test_phase22_frozen_additive_context_transfer.py
          CHANGED=$(git diff --name-only "$P22_TRANSFER_SCI"..HEAD)
          BAD=$(printf '%s\n' "$CHANGED" | grep -Ev '^(docs/phase22_transfer_result\.md|\.github/workflows/phase22-validation\.yml)$' || true)
          test -z "$BAD" || { echo "Unauthorized post-transfer scientific change:"; echo "$BAD"; exit 1; }
          grep -q "$P22_TRANSFER_RESULT_SHA" docs/phase22_transfer_result.md

      - name: Recover exact Phase 22 transfer result
        uses: actions/download-artifact@v4
        with: { name: phase22-transfer, path: p22transfer, github-token: '${{ github.token }}', repository: suhaslord/uav-safety-research, run-id: '${{ env.P22_TRANSFER_RUN }}' }

      - name: Recover exact Phase 22 fit
        uses: actions/download-artifact@v4
        with: { name: phase22-fit, path: p22fit, github-token: '${{ github.token }}', repository: suhaslord/uav-safety-research, run-id: '${{ env.P22_FIT_RUN }}' }

      - name: Recover Phase 12
        uses: actions/download-artifact@v4
        with: { name: phase12-development-v3, path: p12, github-token: '${{ github.token }}', repository: suhaslord/uav-safety-research, run-id: '${{ env.P12_RUN }}' }

      - name: Recover Phase 14
        uses: actions/download-artifact@v4
        with: { name: phase14-bridge-candidate, path: p14, github-token: '${{ github.token }}', repository: suhaslord/uav-safety-research, run-id: '${{ env.P14_RUN }}' }

      - name: Recover Phase 17 fit
        uses: actions/download-artifact@v4
        with: { name: phase17-fit-candidate, path: p17fit, github-token: '${{ github.token }}', repository: suhaslord/uav-safety-research, run-id: '${{ env.P17_FIT_RUN }}' }

      - name: Recover exact Phase 21 final result
        uses: actions/download-artifact@v4
        with: { name: phase21-final, path: p21f, github-token: '${{ github.token }}', repository: suhaslord/uav-safety-research, run-id: '${{ env.P21_FINAL_RUN }}' }

      - name: Verify exact identities and freeze validation head
        run: |
          TRANSFER=$(find p22transfer -path '*/results/phase22_transfer/transfer_result.json' -print -quit)
          FIT=$(find p22fit -path '*/results/phase22_fit/fit_candidate.json' -print -quit)
          P12=$(find p12 -path '*/results/phase12_candidate_v3/candidate_freeze.json' -print -quit)
          P14=$(find p14 -path '*/results/phase14_fit/bridge_candidate.json' -print -quit)
          P17=$(find p17fit -path '*/results/phase17_fit/fit_candidate.json' -print -quit)
          P21=$(find p21f -path '*/results/phase21_final/final_result.json' -print -quit)
          test -n "$TRANSFER"; test -n "$FIT"; test -n "$P12"; test -n "$P14"; test -n "$P17"; test -n "$P21"
          echo "$P22_TRANSFER_RESULT_SHA  $TRANSFER" | sha256sum -c -
          echo "$P22_FIT_CANDIDATE_SHA  $FIT" | sha256sum -c -
          echo "$P12_SHA  $P12" | sha256sum -c -
          echo "$P14_SHA  $P14" | sha256sum -c -
          echo "$P17_FIT_SHA  $P17" | sha256sum -c -
          echo "$P21_FINAL_SHA  $P21" | sha256sum -c -
          python - <<'PY'
          import json
          from pathlib import Path
          t=json.loads(next(Path('p22transfer').rglob('transfer_result.json')).read_text())
          f=json.loads(next(Path('p22fit').rglob('fit_candidate.json')).read_text())
          assert t['phase22_pass'] is True
          assert t['phase22_fit_candidate_sha256']=='62e75d7b39088c2e66f1cc6be4d180501b79632f2f6847af1fbe0bd96be17551'
          assert f['fit_eligible'] is True and f['interaction_terms_retained'] is False
          PY
          echo "P22_FIT_FILE=$FIT" >> "$GITHUB_ENV"
          echo "P12_FILE=$P12" >> "$GITHUB_ENV"
          echo "P14_FILE=$P14" >> "$GITHUB_ENV"
          echo "P17_FILE=$P17" >> "$GITHUB_ENV"
          echo "P21_FILE=$P21" >> "$GITHUB_ENV"
          echo "P22_VALIDATION_SCI=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Expose Phase 22 protected validation evidence exactly once
        run: |
          rm -rf results/phase22_validation
          python scripts/run_phase22_frozen_additive_context_transfer.py --stage validation --phase12-candidate "$P12_FILE" --phase14-bridge "$P14_FILE" --phase17-fit-candidate "$P17_FILE" --phase21-final-result "$P21_FILE" --fit-candidate "$P22_FIT_FILE" --expected-fit-sha256 "$P22_FIT_CANDIDATE_SHA" --out results/phase22_validation --git-sha "$P22_VALIDATION_SCI" 2>&1 | tee phase22-validation.log
          test -f results/phase22_validation/validation_result.json

      - name: Verify permanent validation boundary and record verdict
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          r=json.loads(Path('results/phase22_validation/validation_result.json').read_text())
          assert r['schema']=='aegisland.phase22.frozen-additive-context-transfer.validation-result.v1'
          assert r['evaluated_seed_seen_after_run']==int(os.environ['P22_VALIDATION_SEED'])
          assert r['families']==list(range(2385,2409))
          assert r['scientific_git_sha']==os.environ['P22_VALIDATION_SCI']
          assert r['phase22_fit_candidate_sha256']==os.environ['P22_FIT_CANDIDATE_SHA']
          assert r['factorial_context_count']==32 and len(r['contexts'])==32
          assert len(r['gates'])==10
          assert r['q90_is_descriptive_only'] is True and r['no_refit'] is True
          assert r['interaction_terms_retained'] is False and r['zero_adaptation'] is True
          print('PHASE22_VALIDATION_PASS='+str(bool(r['phase22_pass'])).lower())
          print(json.dumps(r['gates'],indent=2,sort_keys=True))
          print(json.dumps(r['rmse_prediction'],indent=2,sort_keys=True))
          print(json.dumps(r['mae_prediction'],indent=2,sort_keys=True))
          PY

      - name: Upload permanent Phase 22 validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase22-validation
          path: |
            results/phase22_validation/
            phase22-validation.log
          if-no-files-found: error
          retention-days: 90
