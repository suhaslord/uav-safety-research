name: Frozen archive presentation check

on:
  pull_request:
    paths:
      - 'deploy/vercel/**'
      - 'dashboard/**'
      - '.github/workflows/site-frozen-archive-check.yml'
  push:
    branches:
      - 'site/**'
    paths:
      - 'deploy/vercel/**'
      - 'dashboard/**'
      - '.github/workflows/site-frozen-archive-check.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Assert frozen archive presentation
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'data-site-shell="native frozen-archive"' deploy/vercel/index.html
          grep -q 'data-editorial-media="local-v2"' deploy/vercel/index.html
          grep -q 'href="/aegisland.css?v=' deploy/vercel/index.html
          ! grep -q 'href="/signature.css?v=' deploy/vercel/index.html
          grep -q 'href="/research-home.css?v=' deploy/vercel/index.html
          grep -q 'href="/research-media.css?v=' deploy/vercel/index.html
          grep -q 'Model VASE · answer so far' deploy/vercel/index.html
          grep -q 'Can the system know when its landing estimate is unreliable?' deploy/vercel/index.html
          grep -q 'Frozen simulation · Phase 22' deploy/vercel/index.html
          grep -q 'href="/model-vase/">Model VASE' deploy/vercel/index.html
          grep -q 'href="/failure-atlas/">Open Failure Atlas' deploy/vercel/index.html
          grep -q 'href="/model-vase/">How the evidence fits together' deploy/vercel/index.html
          grep -q 'These are different experiments. They have not been joined into one tested model.' deploy/vercel/index.html
          grep -q '"source": "/model-vase/"' deploy/vercel/vercel.json
          grep -q 'Model VASE is a system architecture, not a newly trained vision network.' deploy/vercel/model-vase.html
          grep -q 'No flight-safety claim' deploy/vercel/index.html
          grep -q 'name="aegis-evidence-boundary"' deploy/vercel/index.html
          grep -q 'home-lineage__track' deploy/vercel/index.html
          grep -q '6 PASS / 7 FAIL' deploy/vercel/index.html
          test "$(grep -o 'NASA field image · context only' deploy/vercel/index.html | wc -l)" -eq 1
          grep -q 'src="/media/perception/kios_clean.jpg"' deploy/vercel/index.html
          grep -q 'src="/media/perception/kios_occlusion.jpg"' deploy/vercel/index.html

          test -f deploy/vercel/phase-polish.css
          test -f deploy/vercel/phase-reading-responsive.css
          test -f deploy/vercel/research-home.css
          test -f deploy/vercel/research-media.css
          test -f dashboard/phase-taxonomy.js
          test -f dashboard/phase-personalization.css
          test -f dashboard/phase-personalization.js
          test -f dashboard/phase-visuals.js
          test -f dashboard/phase-editorial-media.css
          test -f dashboard/phase-editorial-media.js
          for ASSET in phase01-context.jpg phase02-context.jpg acero-ground-control.jpg phase04-context.jpg phase05-context.jpg acero-uav-flight.jpg phase06b-context.jpg phase07-context.jpg phase08-context.jpg acero-uav-landing.jpg phase10-context.jpg phase10r-context.jpg stereo-uav-preflight.jpg phase12-context.jpg phase13a-context.jpg phase13b-context.jpg phase13c-context.jpg phase14-context.jpg phase15-context.jpg phase16-context.jpg phase17-context.jpg phase18-context.jpg phase19-context.jpg phase20-context.jpg phase21-context.jpg phase22-context.jpg; do
            test -s "deploy/vercel/media/$ASSET"
          done
          grep -q 'href="/phase-polish.css?v=' dashboard/phases/index.html
          grep -q 'href="/phase-polish.css?v=' dashboard/phases/frozen.html
          grep -q 'href="/phase-polish.css?v=' dashboard/phases/phase.html
          grep -q 'href="/phase-reading-responsive.css?v=' dashboard/phases/frozen.html
          grep -q 'href="/phase-reading-responsive.css?v=' dashboard/phases/phase.html
          grep -q 'href="/phase-reading-responsive.css?v=' deploy/vercel/phase11.html
          grep -q 'href="/phase-personalization.css?v=' dashboard/phases/index.html
          grep -q 'href="/phase-personalization.css?v=' dashboard/phases/frozen.html
          grep -q 'href="/phase-personalization.css?v=' dashboard/phases/phase.html
          grep -q 'href="/phase-editorial-media.css?v=' dashboard/phases/frozen.html
          grep -q 'href="/phase-editorial-media.css?v=' dashboard/phases/phase.html
          grep -q 'src="/phase-visuals.js?v=' dashboard/phases/frozen.html
          grep -q 'src="/phase-visuals.js?v=' dashboard/phases/phase.html
          grep -q 'src="/phase-editorial-media.js?v=' dashboard/phases/frozen.html
          grep -q 'src="/phase-editorial-media.js?v=' dashboard/phases/phase.html
          ! grep -q 'href="/signature.css?v=' dashboard/phases/index.html
          ! grep -q 'href="/signature.css?v=' dashboard/phases/frozen.html
          grep -q 'Keep every result in view.' dashboard/phases/index.html
          grep -q 'href="/model-vase/"' dashboard/phases/index.html
          grep -q 'Research categories' dashboard/phases/index.html
          grep -q 'const phase = lineage && lineage.bySlug\[slug\]' dashboard/phases/frozen.html
          grep -q 'phase-taxonomy.js' dashboard/phases/frozen.html
          grep -q 'phase-personalization.js' dashboard/phases/frozen.html

          grep -q "phase1: { category: 'safety-architecture'" dashboard/phase-taxonomy.js
          grep -q "phase22: { category: 'context-transfer'" dashboard/phase-taxonomy.js
          test "$(grep -c "id: '.*'" dashboard/phase-taxonomy.js)" -ge 6
          grep -q 'phase1:' dashboard/phase-visuals.js
          grep -q 'phase22:' dashboard/phase-visuals.js
          test "$(grep -o "phase[0-9][0-9a-z]*:" dashboard/phase-visuals.js | wc -l)" -eq 26

          grep -q "slug: 'phase13a'" deploy/vercel/frozen-lineage.js
          grep -q "slug: 'phase13c'" deploy/vercel/frozen-lineage.js
          grep -q "slug: 'phase22'" deploy/vercel/frozen-lineage.js
          grep -q '0.8319' deploy/vercel/frozen-lineage.js
          grep -q '0.7744' deploy/vercel/frozen-lineage.js
          grep -q '0ddc968b8bd48c2de6d904194b417854913389a8927cff0b15b96c6501f8294c' deploy/vercel/frozen-lineage.js
          grep -q '62e75d7b39088c2e66f1cc6be4d180501b79632f2f6847af1fbe0bd96be17551' deploy/vercel/frozen-lineage.js
          grep -q '668d065714dde279857bc0e196f0ef7cc5e182ed' deploy/vercel/frozen-lineage.js
          grep -q 'sha256:78fa8d0d5a0df2a59d2d65a3e30abb1e8c948c1f3b9b66a2cb262f00adb971cb' deploy/vercel/frozen-lineage.js

          test "$(grep -c "verdict: 'PASS'" deploy/vercel/frozen-lineage.js)" -eq 6
          test "$(grep -c "verdict: 'FAIL'" deploy/vercel/frozen-lineage.js)" -eq 7

          grep -q '/dashboard/phases/frozen.html' deploy/vercel/vercel.json
          grep -q '/dashboard/phase-taxonomy.js' deploy/vercel/vercel.json
          grep -q '/dashboard/phase-personalization.css' deploy/vercel/vercel.json
          grep -q '/dashboard/phase-personalization.js' deploy/vercel/vercel.json
          grep -q '/dashboard/phase-visuals.js' deploy/vercel/vercel.json
          grep -q '/dashboard/phase-editorial-media.css' deploy/vercel/vercel.json
          grep -q '/dashboard/phase-editorial-media.js' deploy/vercel/vercel.json
          grep -q '0.8319' deploy/vercel/index.html
          grep -q '0.7744' deploy/vercel/index.html
          grep -q '100%' deploy/vercel/index.html
          grep -q 'simulation_only=true' deploy/vercel/index.html
          grep -q 'safety_acceptance=false' deploy/vercel/index.html
          grep -q 'controller_tuning_allowed=false' deploy/vercel/index.html
