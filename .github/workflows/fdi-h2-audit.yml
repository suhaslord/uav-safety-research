name: FDI H2 fast audit and detector tests

on:
  push:
    branches:
      - "research/fdi-h2-*"
    paths:
      - "scripts/audit_fdi_h2_artifact.py"
      - "tests/test_fdi_h2_audit.py"
      - "experiments/ornik_fdi_webots/test_fdi_h2.py"
      - "experiments/ornik_fdi_webots/evaluate_fdi_h2.py"
      - ".github/workflows/fdi-h2-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fdi-h2-fast-${{ github.ref }}
  cancel-in-progress: true

jobs:
  synthetic-audit-and-frozen-rule:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile H2 code without accessing protected evidence
        run: |
          set -euo pipefail
          python -m compileall -q scripts/audit_fdi_h2_artifact.py tests/test_fdi_h2_audit.py experiments/ornik_fdi_webots/evaluate_fdi_h2.py experiments/ornik_fdi_webots/test_fdi_h2.py
      - name: Synthetic independent evidence-audit checks
        run: python -m unittest discover -s tests -p 'test_fdi_h2_audit.py' -v
      - name: Frozen detector and scenario regression tests
        run: python -m unittest discover -s experiments/ornik_fdi_webots -p 'test_fdi_h2.py' -v
