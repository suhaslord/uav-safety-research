name: Production UI QA

# Post-deployment production verification for the real-data homepage plus the full phase archive.
on:
  push:
    branches: [main]
    paths:
      - '.github/qa/production-ui-qa.mjs'
      - '.github/qa/exhaustive-visual-audit.mjs'
      - '.github/qa/editorial-media-smoke.mjs'
      - '.github/qa/mobile-menu-smoke.mjs'
      - '.github/workflows/production-ui-qa.yml'
      - 'dashboard/**'
      - 'deploy/vercel/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  production-ui-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Wait for real-data production release
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://aegisland-research-cockpit.vercel.app'
          HOME_URL="$BASE/?real_data_ready=1"
          for i in {1..90}; do
            HTML=$(curl --fail --silent --show-error --location "$HOME_URL" || true)
            if printf '%s' "$HTML" | grep -q 'data-site-shell="native real-data"' \
              && printf '%s' "$HTML" | grep -q 'KIOS Aerial Landing Pad' \
              && printf '%s' "$HTML" | grep -q '422 REAL VIDEO FRAMES' \
              && printf '%s' "$HTML" | grep -q '30.6%'; then
              echo '✓ real-data homepage is live'
              exit 0
            fi
            sleep 2
          done
          echo 'Timed out waiting for the real-data production release.'
          exit 1

      - name: Run production browser QA
        env:
          QA_BASE_URL: https://aegisland-research-cockpit.vercel.app
        run: node .github/qa/production-ui-qa.mjs

      - name: Run exhaustive screenshot audit
        env:
          QA_BASE_URL: https://aegisland-research-cockpit.vercel.app
        run: node .github/qa/exhaustive-visual-audit.mjs

      - name: Run phase editorial media smoke
        env:
          QA_BASE_URL: https://aegisland-research-cockpit.vercel.app
        run: node .github/qa/editorial-media-smoke.mjs

      - name: Run mobile interaction smoke
        env:
          QA_BASE_URL: https://aegisland-research-cockpit.vercel.app
        run: node .github/qa/mobile-menu-smoke.mjs

      - name: Upload screenshots and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aegisland-production-ui-qa
          path: qa-artifacts/
          if-no-files-found: warn
          retention-days: 14
