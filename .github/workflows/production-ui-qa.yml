name: Production UI QA

# Final post-READY production verification.
on:
  push:
    branches: [main]
    paths:
      - '.github/qa/production-ui-qa.mjs'
      - '.github/qa/exhaustive-visual-audit.mjs'
      - '.github/qa/editorial-media-smoke.mjs'
      - '.github/qa/mobile-menu-smoke.mjs'
      - '.github/workflows/production-ui-qa.yml'
      - 'dashboard/**'
      - 'deploy/vercel/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  production-ui-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Wait for live UI consistency release
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://aegisland-research-cockpit.vercel.app'
          HOME_URL="$BASE/?ui_consistency_ready=1"
          CSS_URL="$BASE/phase-ui-consistency.css?v=1"
          for i in {1..60}; do
            HTML=$(curl --fail --silent --show-error --location "$HOME_URL" || true)
            rm -f /tmp/ui-consistency.css /tmp/ui-consistency.headers
            if printf '%s' "$HTML" | grep -q 'data-editorial-media="local-v2"' \
              && curl --fail --silent --show-error --location --dump-header /tmp/ui-consistency.headers "$CSS_URL" -o /tmp/ui-consistency.css \
              && grep -qi '^content-type: text/css' /tmp/ui-consistency.headers \
              && grep -q 'Cross-template UI consistency pass' /tmp/ui-consistency.css \
              && grep -q '#phaseLimitations span' /tmp/ui-consistency.css; then
              for ASSET in acero-uav-flight.jpg acero-ground-control.jpg stereo-uav-preflight.jpg acero-uav-landing.jpg phase01-context.jpg phase22-context.jpg; do
                curl --fail --silent --show-error --location "$BASE/media/$ASSET" >/dev/null
              done
              echo '✓ live UI consistency release and editorial media are ready'
              exit 0
            fi
            sleep 2
          done
          echo 'Timed out waiting for the live UI consistency release.'
          exit 1

      - name: Run production browser QA
        env:
          QA_BASE_URL: https://aegisland-research-cockpit.vercel.app
        run: node .github/qa/production-ui-qa.mjs

      - name: Run exhaustive 84-screenshot visual audit
        env:
          QA_BASE_URL: https://aegisland-research-cockpit.vercel.app
        run: node .github/qa/exhaustive-visual-audit.mjs

      - name: Run editorial media smoke
        env:
          QA_BASE_URL: https://aegisland-research-cockpit.vercel.app
        run: node .github/qa/editorial-media-smoke.mjs

      - name: Run mobile menu interaction smoke
        env:
          QA_BASE_URL: https://aegisland-research-cockpit.vercel.app
        run: node .github/qa/mobile-menu-smoke.mjs

      - name: Upload screenshots, video, and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aegisland-production-ui-qa
          path: qa-artifacts/
          if-no-files-found: warn
          retention-days: 14
