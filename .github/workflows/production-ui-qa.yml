name: Production UI QA

# Final post-READY production verification.
on:
  push:
    branches: [main]
    paths:
      - '.github/qa/production-ui-qa.mjs'
      - '.github/qa/exhaustive-visual-audit.mjs'
      - '.github/qa/editorial-media-smoke.mjs'
      - '.github/qa/mobile-menu-smoke.mjs'
      - '.github/workflows/production-ui-qa.yml'
      - 'dashboard/**'
      - 'deploy/vercel/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  production-ui-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Wait for expanded local editorial media release
        shell: bash
        run: |
          set -euo pipefail
          URL='https://aegisland-research-cockpit.vercel.app/?editorial_media_ready=2'
          for i in {1..40}; do
            HTML=$(curl --fail --silent --show-error --location "$URL" || true)
            if printf '%s' "$HTML" | grep -q 'data-editorial-media="local-v2"'; then
              for ASSET in acero-uav-flight.jpg acero-ground-control.jpg stereo-uav-preflight.jpg acero-uav-landing.jpg phase01-context.jpg phase22-context.jpg; do
                curl --fail --silent --show-error --location "https://aegisland-research-cockpit.vercel.app/media/$ASSET" >/dev/null
              done
              echo '✓ expanded local editorial media release is ready'
              exit 0
            fi
            sleep 2
          done
          echo 'Timed out waiting for expanded local editorial media release.'
          exit 1

      - name: Run production browser QA
        env:
          QA_BASE_URL: https://aegisland-research-cockpit.vercel.app
        run: node .github/qa/production-ui-qa.mjs

      - name: Run exhaustive 84-screenshot visual audit
        env:
          QA_BASE_URL: https://aegisland-research-cockpit.vercel.app
        run: node .github/qa/exhaustive-visual-audit.mjs

      - name: Run editorial media smoke
        env:
          QA_BASE_URL: https://aegisland-research-cockpit.vercel.app
        run: node .github/qa/editorial-media-smoke.mjs

      - name: Run mobile menu interaction smoke
        env:
          QA_BASE_URL: https://aegisland-research-cockpit.vercel.app
        run: node .github/qa/mobile-menu-smoke.mjs

      - name: Upload screenshots, video, and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aegisland-production-ui-qa
          path: qa-artifacts/
          if-no-files-found: warn
          retention-days: 14
