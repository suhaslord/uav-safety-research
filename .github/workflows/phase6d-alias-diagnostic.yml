name: Phase 6D Alias Detector Diagnostic

on:
  push:
    paths:
      - '.github/workflows/phase6d-alias-diagnostic.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  detector-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run already-seen alias detector diagnostic
        run: |
          python scripts/diagnose_phase6d_alias_false_positives.py \
            --calibration-seed 616161 \
            --out results/phase6d_alias_false_positive_diagnostic
      - name: Upload detector diagnostic
        uses: actions/upload-artifact@v4
        with:
          name: phase6d-alias-detector-diagnostic
          path: results/phase6d_alias_false_positive_diagnostic
          if-no-files-found: error
          retention-days: 45
