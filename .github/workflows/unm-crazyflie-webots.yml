name: UNM Crazyflie Webots Baseline

on:
  push:
    branches:
      - research/unm-crazyflie-webots-baseline
    paths:
      - "experiments/unm_crazyflie/**"
      - ".github/workflows/unm-crazyflie-webots.yml"
  pull_request:
    branches:
      - main
    paths:
      - "experiments/unm_crazyflie/**"
      - ".github/workflows/unm-crazyflie-webots.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  webots-baseline-and-faults:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out research repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install analysis dependencies
        run: python -m pip install --disable-pip-version-check numpy matplotlib

      - name: Validate analysis logic before simulator run
        run: |
          python experiments/unm_crazyflie/test_analysis.py
          python experiments/unm_crazyflie/test_mitigation.py
          python experiments/unm_crazyflie/test_fault_indicator_metrics.py

      - name: Fetch pinned official Bitcraze simulation
        run: |
          git clone https://github.com/bitcraze/crazyflie-simulation.git bitcraze-crazyflie-simulation
          git -C bitcraze-crazyflie-simulation checkout 7e93752dbc803af2488c1db46bb79b3da55f5d8c
          test "$(git -C bitcraze-crazyflie-simulation rev-parse HEAD)" = "7e93752dbc803af2488c1db46bb79b3da55f5d8c"

      - name: Install deterministic logger controller into stock Webots project
        run: |
          mkdir -p bitcraze-crazyflie-simulation/simulator_files/webots/controllers/unm_baseline_controller
          cp experiments/unm_crazyflie/unm_baseline_controller.py \
            bitcraze-crazyflie-simulation/simulator_files/webots/controllers/unm_baseline_controller/unm_baseline_controller.py

          python - <<'PY'
          from pathlib import Path
          world = Path("bitcraze-crazyflie-simulation/simulator_files/webots/worlds/crazyflie_world.wbt")
          text = world.read_text()
          needle = "Crazyflie {\n}\n"
          replacement = 'Crazyflie {\n  controller "unm_baseline_controller"\n  supervisor TRUE\n}\n'
          if needle not in text:
              raise SystemExit("Could not identify the stock Crazyflie node to patch")
          world.write_text(text.replace(needle, replacement, 1))
          print(world.read_text())
          PY

      - name: Run genuine Webots calibration baseline headlessly
        env:
          WEBOTS_IMAGE: cyberbotics/webots:R2025a-ubuntu22.04
        run: |
          mkdir -p experiments/unm_crazyflie/results
          docker pull "$WEBOTS_IMAGE"

          docker run --rm \
            -v "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" \
            -w "$GITHUB_WORKSPACE/bitcraze-crazyflie-simulation" \
            -e UNM_TELEMETRY_PATH="$GITHUB_WORKSPACE/experiments/unm_crazyflie/results/webots_baseline.csv" \
            -e UNM_COMMAND_PROFILE=baseline \
            "$WEBOTS_IMAGE" \
            bash -lc 'apt-get update -qq && DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends python3-numpy >/dev/null && xvfb-run --auto-servernum webots --version && timeout --signal=TERM 45s xvfb-run --auto-servernum webots --mode=fast --no-rendering --stdout --stderr --minimize --batch simulator_files/webots/worlds/crazyflie_world.wbt'

          test -s experiments/unm_crazyflie/results/webots_baseline.csv
          head -5 experiments/unm_crazyflie/results/webots_baseline.csv
          tail -5 experiments/unm_crazyflie/results/webots_baseline.csv

      - name: Run independent no-fault Webots holdout trajectory
        env:
          WEBOTS_IMAGE: cyberbotics/webots:R2025a-ubuntu22.04
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" \
            -w "$GITHUB_WORKSPACE/bitcraze-crazyflie-simulation" \
            -e UNM_TELEMETRY_PATH="$GITHUB_WORKSPACE/experiments/unm_crazyflie/results/webots_holdout.csv" \
            -e UNM_COMMAND_PROFILE=holdout \
            "$WEBOTS_IMAGE" \
            bash -lc 'apt-get update -qq && DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends python3-numpy >/dev/null && timeout --signal=TERM 45s xvfb-run --auto-servernum webots --mode=fast --no-rendering --stdout --stderr --minimize --batch simulator_files/webots/worlds/crazyflie_world.wbt'

          test -s experiments/unm_crazyflie/results/webots_holdout.csv
          head -5 experiments/unm_crazyflie/results/webots_holdout.csv
          tail -5 experiments/unm_crazyflie/results/webots_holdout.csv

      - name: Run frozen single-fault matrix
        run: |
          python experiments/unm_crazyflie/analyze_faults.py \
            experiments/unm_crazyflie/results/webots_baseline.csv \
            --out-dir experiments/unm_crazyflie/results

      - name: Run dropout-timing and estimator diagnostics
        run: |
          python experiments/unm_crazyflie/analyze_extended.py \
            experiments/unm_crazyflie/results/webots_baseline.csv \
            --results-dir experiments/unm_crazyflie/results
          cp experiments/unm_crazyflie/TECHNICAL_EXPLAINER.md \
            experiments/unm_crazyflie/results/TECHNICAL_EXPLAINER.md
          test -s experiments/unm_crazyflie/results/dropout_timing_sweep_2s.csv
          test -s experiments/unm_crazyflie/results/residual_uncertainty_detector.csv
          test -s experiments/unm_crazyflie/results/06_dropout_timing_vs_max_error.png
          cat experiments/unm_crazyflie/results/EXTENDED_RESULTS.md

      - name: Validate fault-indicator detection performance
        run: |
          python experiments/unm_crazyflie/validate_fault_indicators.py \
            experiments/unm_crazyflie/results/webots_baseline.csv \
            --out experiments/unm_crazyflie/results/fault_indicator_validation.csv \
            --seeds 30
          test -s experiments/unm_crazyflie/results/fault_indicator_validation.csv
          cat experiments/unm_crazyflie/results/fault_indicator_validation.csv

      - name: Validate frozen thresholds on unseen nominal trajectory
        run: |
          python experiments/unm_crazyflie/validate_nominal_holdout.py \
            experiments/unm_crazyflie/results/webots_baseline.csv \
            experiments/unm_crazyflie/results/webots_holdout.csv \
            --out experiments/unm_crazyflie/results/nominal_holdout_validation.json
          test -s experiments/unm_crazyflie/results/nominal_holdout_validation.json
          cat experiments/unm_crazyflie/results/nominal_holdout_validation.json

      - name: Compare simple fault mitigation strategies
        run: |
          python experiments/unm_crazyflie/analyze_mitigation.py \
            experiments/unm_crazyflie/results/webots_baseline.csv \
            --results-dir experiments/unm_crazyflie/results
          test -s experiments/unm_crazyflie/results/mitigation_trial_metrics.csv
          test -s experiments/unm_crazyflie/results/mitigation_aggregate.csv
          test -s experiments/unm_crazyflie/results/MITIGATION_RESULTS.md
          cat experiments/unm_crazyflie/results/MITIGATION_RESULTS.md

      - name: Write provenance
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          data = {
              "bitcraze_repository": "bitcraze/crazyflie-simulation",
              "bitcraze_commit": "7e93752dbc803af2488c1db46bb79b3da55f5d8c",
              "webots_image": "cyberbotics/webots:R2025a-ubuntu22.04",
              "calibration_profile": "baseline",
              "holdout_profile": "holdout",
              "experiment_repository": os.environ["GITHUB_REPOSITORY"],
              "experiment_commit": os.environ["GITHUB_SHA"],
              "workflow_run_id": os.environ["GITHUB_RUN_ID"],
          }
          Path("experiments/unm_crazyflie/results/provenance.json").write_text(
              json.dumps(data, indent=2) + "\n"
          )
          PY

      - name: Show result summary
        run: cat experiments/unm_crazyflie/results/RESULTS.md

      - name: Upload Webots evidence and fault results
        uses: actions/upload-artifact@v4
        with:
          name: unm-crazyflie-webots-results
          path: experiments/unm_crazyflie/results/
          if-no-files-found: error
          retention-days: 30
