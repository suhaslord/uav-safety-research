name: Detector conservative photometric pilot

on:
  pull_request:
    paths:
      - 'scripts/prepare_detector_robustness_augmentation.py'
      - 'scripts/train_detector_robustness_candidate.py'
      - 'tests/test_detector_robustness_augmentation.py'
      - 'docs/detector_robustness_candidate.md'
      - '.github/workflows/detector-robustness-pilot.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  development-only-comparison:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      YOLO_CONFIG_DIR: /tmp/Ultralytics
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install development ML stack
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]' py7zr
          python -m pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          python -m pip install ultralytics

      - name: Unit tests and untrusted-fixture guards
        run: pytest -q tests/test_detector_robustness_augmentation.py

      - name: Install official archive extractor
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y p7zip-full

      - name: Restore authenticated KIOS archive cache
        uses: actions/cache@v4
        with:
          path: .cache/phase25/airisim_dataset2.7z
          key: phase25-kios-archive-13682584-865515c2d8f5e9cd9b2ee1e1ec294270

      - name: Reconstruct SHA-verified KIOS split
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/detector_robustness-kios"
          if test -f .cache/phase25/airisim_dataset2.7z; then
            cp .cache/phase25/airisim_dataset2.7z "$RUNNER_TEMP/detector_robustness-kios/airisim_dataset2.7z"
          fi
          for attempt in 1 2 3; do
            if python scripts/download_kios_real_landing_dataset.py \
              --out "$RUNNER_TEMP/detector_robustness-kios" --accept-download --extract; then
              break
            fi
            rm -f "$RUNNER_TEMP/detector_robustness-kios/airisim_dataset2.7z"
            if test "$attempt" -eq 3; then
              exit 1
            fi
            sleep $((attempt * 5))
          done
          python scripts/prepare_kios_real_yolo_split.py \
            --dataset-root "$RUNNER_TEMP/detector_robustness-kios/extracted" \
            --out "$RUNNER_TEMP/detector_robustness-split"

      - name: Create train-only camera-stress images
        run: |
          python -m scripts.prepare_detector_robustness_augmentation \
            --split-root "$RUNNER_TEMP/detector_robustness-split" \
            --out "$RUNNER_TEMP/detector_robustness-aug" \
            --seed 20261013 --variants 1 --mode matched --replace-fraction 0.15 --train-condition-set photometric

      - name: Train baseline and candidate, compare only untouched development validation
        run: |
          python -m scripts.train_detector_robustness_candidate \
            --source-root "$RUNNER_TEMP/detector_robustness-split" \
            --candidate-root "$RUNNER_TEMP/detector_robustness-aug" \
            --out "$RUNNER_TEMP/detector_robustness-comparison" \
            --initialization yolo11n.pt --epochs 12 --imgsz 320 \
            --batch 16 --seed 20261013 --device cpu

      - name: Archive descriptive pilot and authenticated development checkpoints
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: detector-conservative-photometric-dev-pilot
          path: |
            ${{ runner.temp }}/detector_robustness-aug/receipt.json
            ${{ runner.temp }}/detector_robustness-comparison/comparison.json
            ${{ runner.temp }}/detector_robustness-comparison/training/baseline/weights/best.pt
            ${{ runner.temp }}/detector_robustness-comparison/training/candidate/weights/best.pt
            ${{ runner.temp }}/detector_robustness-comparison/training/baseline/results.csv
            ${{ runner.temp }}/detector_robustness-comparison/training/candidate/results.csv
          if-no-files-found: error
          retention-days: 30
