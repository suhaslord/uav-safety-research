name: Real detector baseline

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/real-detector-baseline.yml'
      - 'src/uav_safety/real_landing_dataset.py'
      - 'src/uav_safety/real_split.py'
      - 'scripts/download_kios_real_landing_dataset.py'
      - 'scripts/prepare_kios_real_yolo_split.py'
      - 'scripts/build_real_image_stress_suite.py'
      - 'scripts/train_real_landing_detector.py'
      - 'tests/test_real_landing_dataset.py'
      - 'tests/test_real_split.py'

permissions:
  contents: read

concurrency:
  group: real-detector-baseline
  cancel-in-progress: true

jobs:
  train-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install project and CPU ML stack
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          python -m pip install ultralytics

      - name: Run split and ingestion tests
        run: pytest -q tests/test_real_landing_dataset.py tests/test_real_split.py

      - name: Install 7-Zip
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y p7zip-full

      - name: Download and verify KIOS dataset
        run: |
          python scripts/download_kios_real_landing_dataset.py \
            --out "$RUNNER_TEMP/kios" \
            --accept-download \
            --extract

      - name: Freeze temporal development/test split
        run: |
          python scripts/prepare_kios_real_yolo_split.py \
            --dataset-root "$RUNNER_TEMP/kios/extracted" \
            --out "$RUNNER_TEMP/kios_split"
          cat "$RUNNER_TEMP/kios_split/SPLIT.md"

      - name: Build held-out real-image stress suite
        run: |
          python scripts/build_real_image_stress_suite.py \
            --split-root "$RUNNER_TEMP/kios_split" \
            --out "$RUNNER_TEMP/kios_stress" \
            --seed 20260915

      - name: Train real-image detector and evaluate clean plus stress tests
        env:
          YOLO_CONFIG_DIR: ${{ runner.temp }}/Ultralytics
        run: |
          python scripts/train_real_landing_detector.py \
            --data "$RUNNER_TEMP/kios_split/data.yaml" \
            --stress-root "$RUNNER_TEMP/kios_stress" \
            --out results/real_detector \
            --model yolo11n.pt \
            --epochs 12 \
            --imgsz 320 \
            --batch 16 \
            --seed 20260915

      - name: Save split record next to results
        run: |
          cp "$RUNNER_TEMP/kios_split/SPLIT.md" results/real_detector/SPLIT.md
          cp "$RUNNER_TEMP/kios_split/split_manifest.csv" results/real_detector/split_manifest.csv
          cat results/real_detector/summary.md

      - uses: actions/upload-artifact@v4
        with:
          name: kios-real-detector-baseline
          path: |
            results/real_detector/summary.md
            results/real_detector/summary.json
            results/real_detector/robustness_metrics.csv
            results/real_detector/SPLIT.md
            results/real_detector/split_manifest.csv
            results/real_detector/training/landing_pad_yolo11n/results.csv
            results/real_detector/training/landing_pad_yolo11n/weights/best.pt
          if-no-files-found: error
          retention-days: 30
