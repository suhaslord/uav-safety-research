name: AegisLand human craft grade

on:
  push:
    branches:
      - main
      - 'fix/**'
      - 'chatgpt/**'
    paths:
      - 'deploy/vercel/**'
      - 'dashboard/**'
      - '.github/qa/craft-grade.mjs'
      - '.github/qa/mobile-density-smoke.mjs'
      - '.github/qa/local-vercel-server.mjs'
      - '.github/workflows/craft-grade.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  craft-grade:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Fetch licensed editorial media
        run: node deploy/vercel/fetch-editorial-media.mjs

      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Start local Vercel mirror
        shell: bash
        run: |
          node .github/qa/local-vercel-server.mjs >/tmp/aegis-local.log 2>&1 &
          echo $! >/tmp/aegis-local.pid
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173/ >/dev/null; then
              curl --fail --silent --head http://127.0.0.1:4173/craft-polish.css | grep -qi 'content-type: text/css'
              echo '✓ local mirror ready'
              exit 0
            fi
            sleep 1
          done
          cat /tmp/aegis-local.log
          exit 1

      - name: Grade 20 human craft gates
        env:
          QA_BASE_URL: http://127.0.0.1:4173
        run: node .github/qa/craft-grade.mjs

      - name: Grade real-device mobile density
        env:
          QA_BASE_URL: http://127.0.0.1:4173
        run: node .github/qa/mobile-density-smoke.mjs

      - name: Upload craft evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aegisland-human-craft-grade
          path: |
            qa-artifacts/craft-grade/
            qa-artifacts/mobile-density/
          if-no-files-found: warn
          retention-days: 14
