name: Ornik FDI Webots pilot

on:
  pull_request:
    branches: [main]
    paths:
      - "experiments/ornik_fdi_webots/**"
      - ".github/workflows/ornik-fdi-webots-pilot.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  webots-fdi-pilot:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out AegisLand
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install CPU analysis dependency
        run: python -m pip install --disable-pip-version-check "numpy==2.2.6"

      - name: Fetch pinned Bitcraze Crazyflie Webots model
        run: |
          git clone --no-checkout https://github.com/bitcraze/crazyflie-simulation.git bitcraze-crazyflie-simulation
          git -C bitcraze-crazyflie-simulation checkout 7e93752dbc803af2488c1db46bb79b3da55f5d8c
          test "$(git -C bitcraze-crazyflie-simulation rev-parse HEAD)" = "7e93752dbc803af2488c1db46bb79b3da55f5d8c"

      - name: Install the AegisLand telemetry controller in the pinned Webots world
        run: |
          mkdir -p bitcraze-crazyflie-simulation/simulator_files/webots/controllers/ornik_fdi_controller
          cp experiments/ornik_fdi_webots/webots_fdi_controller.py \
            bitcraze-crazyflie-simulation/simulator_files/webots/controllers/ornik_fdi_controller/ornik_fdi_controller.py
          python - <<'PY'
          from pathlib import Path
          world = Path("bitcraze-crazyflie-simulation/simulator_files/webots/worlds/crazyflie_world.wbt")
          text = world.read_text()
          needle = "Crazyflie {\n}\n"
          replacement = 'Crazyflie {\n  controller "ornik_fdi_controller"\n  supervisor TRUE\n}\n'
          if needle not in text:
              raise SystemExit("Could not identify the stock Crazyflie node to patch")
          world.write_text(text.replace(needle, replacement, 1))
          PY

      - name: Generate paired healthy and single-motor-loss trajectories in Webots
        env:
          WEBOTS_IMAGE: cyberbotics/webots:R2025a-ubuntu22.04
        run: |
          mkdir -p experiments/ornik_fdi_webots/results/raw
          docker pull "$WEBOTS_IMAGE"
          docker run --rm \
            -v "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" \
            -w "$GITHUB_WORKSPACE/bitcraze-crazyflie-simulation" \
            -e GITHUB_WORKSPACE="$GITHUB_WORKSPACE" \
            "$WEBOTS_IMAGE" bash -lc '
              set -e
              apt-get update -qq
              DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends python3-numpy >/dev/null
              xvfb-run --auto-servernum webots --version
              for seed in 11 23 47; do
                for motor in 0 1 2 3 4; do
                  export FDI_SEED="$seed"
                  export FDI_FAILED_MOTOR="$motor"
                  export FDI_TELEMETRY_PATH="$GITHUB_WORKSPACE/experiments/ornik_fdi_webots/results/raw/seed${seed}_motor${motor}.csv"
                  timeout --signal=TERM 60s xvfb-run --auto-servernum webots --mode=fast --no-rendering --stdout --stderr --minimize --batch simulator_files/webots/worlds/crazyflie_world.wbt
                  test -s "$FDI_TELEMETRY_PATH"
                done
              done
            '

      - name: Fit pilot detector and write held-out report
        run: |
          python experiments/ornik_fdi_webots/train_pilot.py \
            --input-dir experiments/ornik_fdi_webots/results/raw \
            --output-dir experiments/ornik_fdi_webots/results
          cp experiments/ornik_fdi_webots/README.md experiments/ornik_fdi_webots/results/PROTOCOL.md

      - name: Upload raw software-simulation evidence and pilot outputs
        uses: actions/upload-artifact@v4
        with:
          name: aegisland-ornik-webots-fdi-pilot
          path: experiments/ornik_fdi_webots/results/
          if-no-files-found: error
          retention-days: 30
