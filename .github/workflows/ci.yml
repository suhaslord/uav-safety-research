name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - name: Compile package and scripts
        run: python -m compileall -q src scripts tests
      - name: Check Research Cockpit JavaScript
        run: |
          node --check dashboard/cockpit.js
          node --check dashboard/cockpit-extension.js
          node --check dashboard/app.js
          node --check dashboard/phase-data.js
          node --check dashboard/phase-runtime.js
          node --check dashboard/phase-signatures.js
          node --check dashboard/tesla-mobile.js
          node --check dashboard/aegis-current.js
      - name: Check Phase 8 Trace Lab JavaScript
        run: node --check phase8_dashboard/app.js
      - name: Unit tests
        run: pytest -q
      - name: V3 smoke benchmark
        run: python scripts/run_v3_comparison.py --episodes 2 --seed 12345 --profiles clean mixed --out /tmp/aegis-v3-smoke
      - name: Robustness smoke benchmark
        run: python scripts/run_robustness_suite.py --axis bias_magnitude --episodes 1 --seed 24680 --out /tmp/aegis-robustness-smoke
      - name: Seed-family aggregation regression smoke test
        run: python scripts/run_robustness_suite.py --axis seed_families --episodes 1 --seed 11223 --out /tmp/aegis-seed-family-smoke
      - name: Image perception smoke benchmark
        run: python scripts/run_image_perception_benchmark.py --samples 3 --seed 13579 --out /tmp/aegis-image-smoke
      - name: Phase 6 image-to-Aegis smoke benchmark
        run: python scripts/run_phase6_image_landing.py --episodes 2 --seed 626262 --calibration-seed 616161 --calibration-samples 12 --out /tmp/aegis-phase6-smoke
      - name: Phase 6 selective-perception smoke benchmark
        run: python scripts/run_phase6_selective_perception.py --sequences 1 --frames 12 --seed 636363 --calibration-seed 616161 --calibration-samples 12 --out /tmp/aegis-phase6-selective-smoke
      - name: Phase 6B paired landing smoke benchmark
        run: python scripts/run_phase6b_landing.py --episodes 1 --seed 626262 --calibration-seed 616161 --temporal-calibration-samples 12 --component-calibration-samples 32 --out /tmp/aegis-phase6b-smoke
      - name: Phase 7 external-validity smoke benchmark
        run: |
          python scripts/run_phase7_external_validity.py --episodes 1 --seed 979797 --calibration-seed 616161 --temporal-calibration-samples 12 --component-calibration-samples 32 --conditions clean mixed --faults independent shared_lateral_bias --plants legacy phase7 --out /tmp/aegis-phase7-smoke
          python scripts/validate_result_manifest.py /tmp/aegis-phase7-smoke/result_manifest.json
      - name: Phase 8 trace-validation smoke pipeline
        run: |
          python scripts/generate_phase8_fixture_traces.py --rows 60 --out /tmp/aegis-phase8-inputs
          python scripts/run_phase8_trace_validation.py \
            /tmp/aegis-phase8-inputs/phase7_surrogate_fixture.csv \
            /tmp/aegis-phase8-inputs/external_simulator_fixture.csv \
            --out /tmp/aegis-phase8-smoke \
            --git-sha "$GITHUB_SHA" \
            --external-evidence-status fixture_non_authoritative
          python scripts/validate_result_manifest.py \
            /tmp/aegis-phase8-smoke/result_manifest.json \
            --schema aegisland.phase8.result-bundle.v1
      - name: Phase 9 perception-trace smoke pipeline
        run: |
          rm -rf /tmp/aegis-phase9-smoke
          python scripts/generate_phase9_perception_fixture.py \
            --rows 24 \
            --seed 909090 \
            --out /tmp/aegis-phase9-smoke
          python scripts/validate_phase9_perception_trace.py \
            /tmp/aegis-phase9-smoke/perception_trace.csv \
            --frame-root /tmp/aegis-phase9-smoke \
            --verify-frame-hashes \
            --summary-out /tmp/aegis-phase9-smoke/validation_summary.json
      - name: Phase 6 clean abstention diagnostic
        run: python scripts/diagnose_phase6_episode.py --condition clean --episodes 1 --calibration-samples 30
      - name: Phase 6 occlusion abstention diagnostic
        run: python scripts/diagnose_phase6_episode.py --condition occlusion --episodes 1 --calibration-samples 30
