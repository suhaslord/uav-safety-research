name: Phase 11 P9 candidate freeze

on:
  push:
    branches:
      - phase11-p9-soft-update-direct-conformal
    paths:
      - .github/workflows/phase11-p9-freeze.yml

permissions:
  contents: read
  actions: read

jobs:
  freeze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install project
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run P9 preregistered invariants
        run: pytest -q tests/test_phase11_p9_soft_update_direct_conformal.py
      - name: Generate fit and grouped-calibration evidence only
        run: |
          rm -rf results/phase11_p9_freeze
          python scripts/run_phase11_p9_soft_update_direct_conformal.py \
            --stage freeze \
            --out results/phase11_p9_freeze \
            --git-sha "${GITHUB_SHA}" | tee phase11-p9-freeze.log
          test -f results/phase11_p9_freeze/fit_frames.csv
          test -f results/phase11_p9_freeze/calibration_frames.csv
          test -f results/phase11_p9_freeze/candidate_freeze.json
          test -f results/phase11_p9_freeze/manifest.json
          test ! -f results/phase11_p9_freeze/transfer_frames.csv
          test ! -f results/phase11_p9_freeze/transfer_result.json
          test ! -f results/phase11_p9_freeze/validation_frames.csv
          test ! -f results/phase11_p9_freeze/validation_result.json
      - name: Candidate freeze digest
        run: |
          sha256sum results/phase11_p9_freeze/candidate_freeze.json
          sha256sum results/phase11_p9_freeze/manifest.json
          cat results/phase11_p9_freeze/candidate_freeze.json
      - uses: actions/upload-artifact@v4
        with:
          name: phase11-p9-candidate-freeze
          path: |
            results/phase11_p9_freeze/
            phase11-p9-freeze.log
          if-no-files-found: error
          retention-days: 30
