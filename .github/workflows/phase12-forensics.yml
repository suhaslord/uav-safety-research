name: Phase 12 width-tail forensics

on:
  push:
    branches: [phase12/adaptive-normalized-conformal]
    paths:
      - .github/workflows/phase12-forensics.yml
      - scripts/analyze_phase12_width_tail.py
      - scripts/run_phase12_adaptive_normalized_conformal.py
      - scripts/run_phase12_adaptive_normalized_conformal_v2.py
      - scripts/run_phase11_p14r_robust_group_envelope.py
      - scripts/run_phase11_p14_bounded_independent_rescue.py
      - scripts/run_phase11_p9_soft_update_direct_conformal.py

permissions:
  contents: read
  actions: read

jobs:
  forensics:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install project
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Compile diagnostic tooling
        run: |
          python -m compileall -q scripts/analyze_phase12_width_tail.py
      - name: Recover exact closed Phase 11 P14R predecessor candidate
        uses: actions/download-artifact@v4
        with:
          name: phase11-p14r-candidate-freeze
          path: predecessor_artifact
          github-token: ${{ github.token }}
          repository: suhaslord/uav-safety-research
          run-id: 31979250287
      - name: Verify predecessor candidate digest
        run: |
          PREDECESSOR=$(find predecessor_artifact -name candidate_freeze.json -print -quit)
          test -n "$PREDECESSOR"
          echo "bba1b7be7565b470af80db502e6fa5d969bc86c712e322557c06b30e49bd9c86  $PREDECESSOR" | sha256sum -c -
          echo "PREDECESSOR=$PREDECESSOR" >> "$GITHUB_ENV"
      - name: Run permanently-seen Phase 12 forensics only
        run: |
          rm -rf results/phase12_forensics
          python scripts/analyze_phase12_width_tail.py \
            --predecessor "$PREDECESSOR" \
            --out results/phase12_forensics \
            --git-sha "$GITHUB_SHA" | tee phase12-forensics.log
          test -f results/phase12_forensics/phase12_width_tail_forensics.json
          test ! -e results/phase12_transfer
          test ! -e results/phase12_validation
          test ! -e results/phase12_final
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('results/phase12_forensics/phase12_width_tail_forensics.json').read_text())
          assert r['development_only'] is True
          assert r['forbidden_seeds_untouched'] == [858858, 869869, 913913, 924924, 935935]
          print('PHASE12_FORENSICS_SEEN_EVIDENCE_ONLY=true')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: phase12-width-tail-forensics
          path: |
            results/phase12_forensics/
            phase12-forensics.log
          if-no-files-found: error
          retention-days: 30
