name: Mobile overflow diagnostic

on:
  push:
    branches:
      - aegis-tesla-liquid-glass-repair
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Start local Vercel mirror
        run: |
          node .github/qa/local-vercel-server.mjs > /tmp/aegis-local-server.log 2>&1 &
          for i in {1..30}; do
            curl -fsS http://127.0.0.1:4173/ >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/aegis-local-server.log
          exit 1
      - name: Diagnose homepage overflow
        env:
          QA_BASE_URL: http://127.0.0.1:4173
        run: node .github/qa/mobile-overflow-diagnostic.mjs
