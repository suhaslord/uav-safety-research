name: Phase 11 P14R to P15 final confirmation

on:
  push:
    branches: [phase11-p14r-final-robust-envelope]
    paths:
      - .github/workflows/phase11-p14r-to-p15-final.yml

permissions:
  contents: read
  actions: read

jobs:
  freeze:
    runs-on: ubuntu-24.04
    outputs:
      candidate_sha: ${{ steps.freeze.outputs.candidate_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install project
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Verify frozen P14R scientific head
        run: |
          git fetch --depth=1 origin 58b06089a621264afb886f6aee2acaacf8a8709c
          git diff --exit-code 58b06089a621264afb886f6aee2acaacf8a8709c HEAD -- \
            scripts/run_phase11_p14r_robust_group_envelope.py \
            tests/test_phase11_p14r_robust_group_envelope.py \
            docs/phase11_p14r_robust_group_envelope_preregistration.md \
            docs/phase11_p15_final_holdout_v2_preregistration.md
      - name: Run inherited and P14R invariants
        run: |
          pytest -q \
            tests/test_phase11_p9_soft_update_direct_conformal.py \
            tests/test_phase11_p14_bounded_independent_rescue.py \
            tests/test_phase11_p14r_robust_group_envelope.py
      - id: freeze
        name: Generate fresh fit/calibration and freeze exact candidate
        run: |
          rm -rf results/phase11_p14r_freeze
          python scripts/run_phase11_p14r_robust_group_envelope.py \
            --stage freeze \
            --out results/phase11_p14r_freeze \
            --git-sha "${GITHUB_SHA}" | tee phase11-p14r-freeze.log
          test -f results/phase11_p14r_freeze/candidate_freeze.json
          test ! -e results/phase11_p14r_transfer
          test ! -e results/phase11_p14r_validation
          test ! -e results/phase11_p15_final
          SHA=$(sha256sum results/phase11_p14r_freeze/candidate_freeze.json | awk '{print $1}')
          echo "candidate_sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "P14R_CANDIDATE_SHA256=$SHA"
          cat results/phase11_p14r_freeze/candidate_freeze.json
      - uses: actions/upload-artifact@v4
        with:
          name: phase11-p14r-candidate-freeze
          path: |
            results/phase11_p14r_freeze/
            phase11-p14r-freeze.log
          if-no-files-found: error
          retention-days: 30

  transfer:
    needs: freeze
    runs-on: ubuntu-24.04
    outputs:
      eligible: ${{ steps.gates.outputs.eligible }}
      result_sha: ${{ steps.gates.outputs.result_sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install project
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Verify scientific files still frozen
        run: |
          git fetch --depth=1 origin 58b06089a621264afb886f6aee2acaacf8a8709c
          git diff --exit-code 58b06089a621264afb886f6aee2acaacf8a8709c HEAD -- \
            scripts/run_phase11_p14r_robust_group_envelope.py \
            tests/test_phase11_p14r_robust_group_envelope.py \
            docs/phase11_p14r_robust_group_envelope_preregistration.md \
            docs/phase11_p15_final_holdout_v2_preregistration.md
      - uses: actions/download-artifact@v4
        with:
          name: phase11-p14r-candidate-freeze
          path: candidate_artifact
      - name: Verify exact frozen candidate digest
        run: |
          CANDIDATE=$(find candidate_artifact -name candidate_freeze.json -print -quit)
          test -n "$CANDIDATE"
          echo "${{ needs.freeze.outputs.candidate_sha }}  $CANDIDATE" | sha256sum -c -
          echo "CANDIDATE=$CANDIDATE" >> "$GITHUB_ENV"
      - name: Expose P14R seen transfer exactly once
        run: |
          rm -rf results/phase11_p14r_transfer
          python scripts/run_phase11_p14r_robust_group_envelope.py \
            --stage transfer \
            --candidate "$CANDIDATE" \
            --out results/phase11_p14r_transfer \
            --git-sha "${GITHUB_SHA}" | tee phase11-p14r-transfer.log
          test ! -e results/phase11_p14r_validation
          test ! -e results/phase11_p15_final
      - id: gates
        name: Freeze transfer verdict
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import hashlib, json, pathlib
          p=pathlib.Path('results/phase11_p14r_transfer/transfer_result.json')
          r=json.loads(p.read_text())
          print('eligible=' + str(bool(r['all_primary_gates_pass'])).lower())
          print('result_sha=' + hashlib.sha256(p.read_bytes()).hexdigest())
          print('TRANSFER_ALL_PRIMARY_GATES_PASS=' + str(bool(r['all_primary_gates_pass'])).lower())
          print(json.dumps(r['gates'], sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: phase11-p14r-seen-transfer
          path: |
            results/phase11_p14r_transfer/
            phase11-p14r-transfer.log
          if-no-files-found: error
          retention-days: 30

  validation:
    needs: [freeze, transfer]
    if: needs.transfer.outputs.eligible == 'true'
    runs-on: ubuntu-24.04
    outputs:
      eligible: ${{ steps.gates.outputs.eligible }}
      result_sha: ${{ steps.gates.outputs.result_sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install project
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Verify scientific files still frozen
        run: |
          git fetch --depth=1 origin 58b06089a621264afb886f6aee2acaacf8a8709c
          git diff --exit-code 58b06089a621264afb886f6aee2acaacf8a8709c HEAD -- \
            scripts/run_phase11_p14r_robust_group_envelope.py \
            tests/test_phase11_p14r_robust_group_envelope.py \
            docs/phase11_p14r_robust_group_envelope_preregistration.md \
            docs/phase11_p15_final_holdout_v2_preregistration.md
      - uses: actions/download-artifact@v4
        with:
          name: phase11-p14r-candidate-freeze
          path: candidate_artifact
      - name: Verify exact candidate and transfer eligibility
        run: |
          CANDIDATE=$(find candidate_artifact -name candidate_freeze.json -print -quit)
          echo "${{ needs.freeze.outputs.candidate_sha }}  $CANDIDATE" | sha256sum -c -
          test "${{ needs.transfer.outputs.eligible }}" = "true"
          echo "CANDIDATE=$CANDIDATE" >> "$GITHUB_ENV"
      - name: Expose protected validation exactly once
        run: |
          rm -rf results/phase11_p14r_validation
          python scripts/run_phase11_p14r_robust_group_envelope.py \
            --stage validation \
            --candidate "$CANDIDATE" \
            --out results/phase11_p14r_validation \
            --git-sha "${GITHUB_SHA}" | tee phase11-p14r-validation.log
          test ! -e results/phase11_p15_final
      - id: gates
        name: Freeze protected-validation verdict
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import hashlib, json, pathlib
          p=pathlib.Path('results/phase11_p14r_validation/validation_result.json')
          r=json.loads(p.read_text())
          print('eligible=' + str(bool(r['all_primary_gates_pass'])).lower())
          print('result_sha=' + hashlib.sha256(p.read_bytes()).hexdigest())
          print('VALIDATION_ALL_PRIMARY_GATES_PASS=' + str(bool(r['all_primary_gates_pass'])).lower())
          print(json.dumps(r['gates'], sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: phase11-p14r-protected-validation
          path: |
            results/phase11_p14r_validation/
            phase11-p14r-validation.log
          if-no-files-found: error
          retention-days: 30

  final:
    needs: [freeze, transfer, validation]
    if: needs.validation.outputs.eligible == 'true'
    runs-on: ubuntu-24.04
    outputs:
      passed: ${{ steps.gates.outputs.passed }}
      result_sha: ${{ steps.gates.outputs.result_sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install project
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Verify scientific files still frozen
        run: |
          git fetch --depth=1 origin 58b06089a621264afb886f6aee2acaacf8a8709c
          git diff --exit-code 58b06089a621264afb886f6aee2acaacf8a8709c HEAD -- \
            scripts/run_phase11_p14r_robust_group_envelope.py \
            tests/test_phase11_p14r_robust_group_envelope.py \
            docs/phase11_p14r_robust_group_envelope_preregistration.md \
            docs/phase11_p15_final_holdout_v2_preregistration.md
      - uses: actions/download-artifact@v4
        with:
          name: phase11-p14r-candidate-freeze
          path: candidate_artifact
      - uses: actions/download-artifact@v4
        with:
          name: phase11-p14r-seen-transfer
          path: transfer_artifact
      - uses: actions/download-artifact@v4
        with:
          name: phase11-p14r-protected-validation
          path: validation_artifact
      - name: Verify final-holdout preconditions
        run: |
          CANDIDATE=$(find candidate_artifact -name candidate_freeze.json -print -quit)
          echo "${{ needs.freeze.outputs.candidate_sha }}  $CANDIDATE" | sha256sum -c -
          TC=$(find transfer_artifact -name candidate_freeze.json -print -quit)
          VC=$(find validation_artifact -name candidate_freeze.json -print -quit)
          echo "${{ needs.freeze.outputs.candidate_sha }}  $TC" | sha256sum -c -
          echo "${{ needs.freeze.outputs.candidate_sha }}  $VC" | sha256sum -c -
          python - <<'PY'
          import json, pathlib
          tp=next(pathlib.Path('transfer_artifact').rglob('transfer_result.json'))
          vp=next(pathlib.Path('validation_artifact').rglob('validation_result.json'))
          assert json.loads(tp.read_text())['all_primary_gates_pass'] is True
          assert json.loads(vp.read_text())['all_primary_gates_pass'] is True
          PY
          echo "CANDIDATE=$CANDIDATE" >> "$GITHUB_ENV"
      - name: Expose P15 final holdout exactly once
        run: |
          rm -rf results/phase11_p15_final
          python scripts/run_phase11_p14r_robust_group_envelope.py \
            --stage final \
            --candidate "$CANDIDATE" \
            --out results/phase11_p15_final \
            --git-sha "${GITHUB_SHA}" | tee phase11-p15-final.log
      - id: gates
        name: Freeze Phase 11 final verdict
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import hashlib, json, pathlib
          p=pathlib.Path('results/phase11_p15_final/final_result.json')
          r=json.loads(p.read_text())
          print('passed=' + str(bool(r['all_primary_gates_pass'])).lower())
          print('result_sha=' + hashlib.sha256(p.read_bytes()).hexdigest())
          print('PHASE11_FINAL_PASS=' + str(bool(r['all_primary_gates_pass'])).lower())
          print(json.dumps(r['gates'], sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: phase11-p15-final-holdout
          path: |
            results/phase11_p15_final/
            phase11-p15-final.log
          if-no-files-found: error
          retention-days: 90
