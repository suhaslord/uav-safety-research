name: Phase 11 P12 event-stratified candidate freeze

on:
  push:
    branches:
      - phase11-p12-event-stratified-direct-conformal
    paths:
      - .github/workflows/phase11-p12-freeze.yml

permissions:
  contents: read
  actions: read

jobs:
  freeze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install project
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Verify P12 preregistered invariants
        run: |
          pytest -q tests/test_phase11_p9_soft_update_direct_conformal.py tests/test_phase11_p12_event_stratified_direct_conformal.py
      - name: Generate natural fit and event-stratified calibration only
        run: |
          rm -rf results/phase11_p12_freeze
          python scripts/run_phase11_p12_event_stratified_direct_conformal.py \
            --stage freeze \
            --out results/phase11_p12_freeze \
            --git-sha "${GITHUB_SHA}" | tee phase11-p12-freeze.log
          test -f results/phase11_p12_freeze/fit_frames.csv
          test -f results/phase11_p12_freeze/calibration_frames.csv
          test -f results/phase11_p12_freeze/candidate_freeze.json
          test -f results/phase11_p12_freeze/manifest.json
          test ! -f results/phase11_p12_freeze/transfer_result.json
          test ! -f results/phase11_p12_freeze/validation_result.json
      - name: Freeze digest
        run: |
          sha256sum results/phase11_p12_freeze/candidate_freeze.json
          sha256sum results/phase11_p12_freeze/manifest.json
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('results/phase11_p12_freeze/candidate_freeze.json').read_text())
          print('P12_CALIBRATION_COUNTS='+json.dumps(p['calibration_group_rows'],sort_keys=True))
          print('P12_CALIBRATION_POWER='+json.dumps(p['calibration_power_margin'],sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: phase11-p12-candidate-freeze
          path: |
            results/phase11_p12_freeze/
            phase11-p12-freeze.log
          if-no-files-found: error
          retention-days: 30
