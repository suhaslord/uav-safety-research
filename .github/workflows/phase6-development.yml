name: Phase 6 Development Evaluation

on:
  push:
    paths:
      - '.github/workflows/phase6-development.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  phase6-development:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Unit tests
        run: pytest -q

      - name: Run paired Phase 6 development study
        run: |
          python scripts/run_phase6_image_landing.py \
            --episodes 30 \
            --seed 626262 \
            --calibration-seed 616161 \
            --calibration-samples 180 \
            --severity 1.0 \
            --out results/phase6_development

      - name: Decompose unsafe touchdowns
        run: python scripts/analyze_phase6_failures.py --results results/phase6_development

      - name: Upload Phase 6 development artifact
        uses: actions/upload-artifact@v4
        with:
          name: phase6-development-results
          path: results/phase6_development
          if-no-files-found: error
          retention-days: 30
