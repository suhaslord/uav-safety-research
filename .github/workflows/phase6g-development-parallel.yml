name: Phase 6G Development Parallel Replay

on:
  push:
    paths:
      - '.github/workflows/phase6g-development-parallel.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  condition:
    strategy:
      fail-fast: false
      matrix:
        condition: [clean, blur, low_light, occlusion, mixed]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run locked condition matrix
        run: |
          python scripts/run_phase6g_condition.py \
            --condition "${{ matrix.condition }}" \
            --episodes 50 \
            --seed 838381 \
            --calibration-seed 616161 \
            --out "results/phase6g_parallel/${{ matrix.condition }}"
      - name: Upload condition artifact
        uses: actions/upload-artifact@v4
        with:
          name: phase6g-dev-${{ matrix.condition }}
          path: results/phase6g_parallel/${{ matrix.condition }}
          if-no-files-found: error
          retention-days: 60

  aggregate:
    needs: condition
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Download condition artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: phase6g-dev-*
          path: downloads
      - name: Aggregate deterministic replay
        run: |
          python scripts/aggregate_phase6g_parallel.py \
            --downloads downloads \
            --out results/phase6g_parallel_aggregate
          python scripts/analyze_phase6_failures.py --results results/phase6g_parallel_aggregate
      - name: Check preregistered criteria
        id: criteria
        continue-on-error: true
        run: python scripts/check_phase6g_development.py --results results/phase6g_parallel_aggregate
      - name: Upload aggregate bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase6g-development-parallel-aggregate
          path: results/phase6g_parallel_aggregate
          if-no-files-found: error
          retention-days: 90
      - name: Enforce replay decision
        if: always()
        run: |
          if [ "${{ steps.criteria.outcome }}" != "success" ]; then
            echo "Parallel replay failed the preregistered Phase 6G criteria."
            exit 1
          fi
