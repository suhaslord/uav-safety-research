name: Phase 6G Landing Development

on:
  push:
    paths:
      - '.github/workflows/phase6g-development.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  landing-development:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Full test suite
        run: pytest -q
      - name: Run preregistered paired Phase 6G matrix
        run: |
          python scripts/run_phase6g_development.py \
            --episodes 50 \
            --seed 838381 \
            --calibration-seed 616161 \
            --out results/phase6g_development
      - name: Decompose simulated touchdown failures
        run: python scripts/analyze_phase6_failures.py --results results/phase6g_development
      - name: Check preregistered development criteria
        id: criteria
        continue-on-error: true
        run: python scripts/check_phase6g_development.py --results results/phase6g_development
      - name: Upload Phase 6G development bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase6g-development
          path: results/phase6g_development
          if-no-files-found: error
          retention-days: 90
      - name: Enforce development decision
        if: always()
        run: |
          if [ "${{ steps.criteria.outcome }}" != "success" ]; then
            echo "Phase 6G failed the preregistered development criteria. Preserve results; do not retune under the same label."
            exit 1
          fi
