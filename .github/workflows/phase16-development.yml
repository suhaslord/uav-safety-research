name: Phase 16 matched latency level-dynamics development

on:
  push:
    branches: [phase16/matched-latency-level-dynamics]
    paths:
      - .github/workflows/phase16-development.yml

permissions:
  contents: read
  actions: read

env:
  FROZEN_PHASE12_DEV_RUN_ID: '34004695243'
  FROZEN_PHASE12_CANDIDATE_SHA256: e2372ca597cdd983f098f1a45524c077798114c59a62bf9faccefd17b67a4991
  PHASE14_FIT_RUN_ID: '34010431456'
  PHASE14_BRIDGE_CANDIDATE_SHA256: 0443d4e45a1966c77544c5c9965de8caec6e622c79ef8c2ce47aee82a3c95981
  PHASE16_DEV_SEED: '1616161'

jobs:
  development:
    runs-on: ubuntu-24.04
    steps:
      - name: Refuse second Phase 16 development exposure
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          COUNT=$(gh api \
            -H 'Accept: application/vnd.github+json' \
            '/repos/${{ github.repository }}/actions/artifacts?name=phase16-development&per_page=100' \
            --jq '[.artifacts[] | select(.expired == false)] | length')
          test "$COUNT" = "0" || { echo "Phase 16 development artifact already exists; refusing second exposure"; exit 1; }

      - name: Check out preregistered Phase 16 head
        uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Verify implementation before evidence
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          python -m compileall -q \
            scripts/run_phase16_matched_latency_level_dynamics.py \
            scripts/run_phase13c_compound_attribution.py \
            scripts/run_phase14_uncertainty_recoverability_bridge.py
          pytest -q \
            tests/test_phase13c_compound_attribution.py \
            tests/test_phase14_uncertainty_recoverability_bridge.py \
            tests/test_phase15_recoverability_feasibility_frontier.py \
            tests/test_phase16_matched_latency_level_dynamics.py
          test -f docs/phase16_preregistration.md
          grep -q '1616161' docs/phase16_preregistration.md
          grep -q 'component A from Phase 13C' docs/phase16_preregistration.md
          grep -q 'no innovation response' docs/phase16_preregistration.md
          grep -q 'no severity response' docs/phase16_preregistration.md

      - name: Recover exact frozen Phase 12 candidate
        uses: actions/download-artifact@v4
        with:
          name: phase12-development-v3
          path: frozen_phase12_candidate_artifact
          github-token: ${{ github.token }}
          repository: suhaslord/uav-safety-research
          run-id: ${{ env.FROZEN_PHASE12_DEV_RUN_ID }}

      - name: Recover exact frozen Phase 14 bridge candidate
        uses: actions/download-artifact@v4
        with:
          name: phase14-bridge-candidate
          path: frozen_phase14_bridge_artifact
          github-token: ${{ github.token }}
          repository: suhaslord/uav-safety-research
          run-id: ${{ env.PHASE14_FIT_RUN_ID }}

      - name: Verify predecessor identities and freeze scientific head
        run: |
          P12=$(find frozen_phase12_candidate_artifact -path '*/results/phase12_candidate_v3/candidate_freeze.json' -print -quit)
          BRIDGE=$(find frozen_phase14_bridge_artifact -path '*/results/phase14_fit/bridge_candidate.json' -print -quit)
          test -n "$P12"
          test -n "$BRIDGE"
          echo "$FROZEN_PHASE12_CANDIDATE_SHA256  $P12" | sha256sum -c -
          echo "$PHASE14_BRIDGE_CANDIDATE_SHA256  $BRIDGE" | sha256sum -c -
          echo "PHASE12_CANDIDATE=$P12" >> "$GITHUB_ENV"
          echo "PHASE14_BRIDGE=$BRIDGE" >> "$GITHUB_ENV"
          echo "PHASE16_SCIENTIFIC_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Expose Phase 16 development evidence exactly once
        run: |
          rm -rf results/phase16_development
          python scripts/run_phase16_matched_latency_level_dynamics.py \
            --stage dev \
            --phase12-candidate "$PHASE12_CANDIDATE" \
            --phase14-bridge "$PHASE14_BRIDGE" \
            --out results/phase16_development \
            --git-sha "$PHASE16_SCIENTIFIC_SHA" 2>&1 | tee phase16-development.log
          test -f results/phase16_development/dev_result.json

      - name: Verify result boundary and record verdict
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          r = json.loads(Path('results/phase16_development/dev_result.json').read_text())
          assert r['schema'] == 'aegisland.phase16.matched-latency-level-dynamics.dev-result.v1'
          assert r['evaluated_seed_seen_after_run'] == int(os.environ['PHASE16_DEV_SEED'])
          assert r['families'] == list(range(1713, 1737))
          assert r['scientific_git_sha'] == os.environ['PHASE16_SCIENTIFIC_SHA']
          assert r['phase12_candidate_sha256'] == os.environ['FROZEN_PHASE12_CANDIDATE_SHA256']
          assert r['phase14_bridge_sha256'] == os.environ['PHASE14_BRIDGE_CANDIDATE_SHA256']
          assert r['latency_intervention']['lag_frames'] == 2
          assert r['latency_intervention']['innovation_response'] is False
          assert r['latency_intervention']['severity_response'] is False
          assert r['phase15_failure_preserved'] is True
          assert r['zero_adaptation'] is True
          assert r['simulation_only'] is True
          assert r['safety_acceptance'] is False
          assert r['controller_tuning_allowed'] is False
          assert len(r['gates']) == 10
          print('PHASE16_DEVELOPMENT_PERMANENTLY_SEEN=true')
          print('PHASE16_DEVELOPMENT_PASS=' + str(bool(r['phase16_pass'])).lower())
          print(json.dumps(r['gates'], indent=2, sort_keys=True))
          print(json.dumps(r['context_results'], indent=2, sort_keys=True))
          PY

      - name: Upload permanent Phase 16 development evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase16-development
          path: |
            results/phase16_development/
            phase16-development.log
          if-no-files-found: error
          retention-days: 90
