name: Phase 5 Full Validation

on:
  push:
    paths:
      - '.github/workflows/phase5-full-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Compile all Python
        run: python -m compileall -q src scripts tests
      - name: Full unit test suite
        run: pytest -q

  robustness:
    needs: unit-tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        axis:
          - seed_families
          - degradation_strength
          - reference_quality
          - reference_dropout
          - bias_magnitude
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run ${{ matrix.axis }} robustness study
        run: python scripts/run_robustness_suite.py --axis ${{ matrix.axis }} --episodes 100 --out results/robustness
      - name: Upload ${{ matrix.axis }} results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: robustness-${{ matrix.axis }}
          path: results/robustness/${{ matrix.axis }}
          if-no-files-found: warn
          retention-days: 30

  image-perception:
    needs: unit-tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Synthetic image perception benchmark
        run: python scripts/run_image_perception_benchmark.py --samples 300 --seed 606060 --out results/image_perception
      - name: Upload image benchmark results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: image-perception-1500
          path: results/image_perception
          if-no-files-found: warn
          retention-days: 30
