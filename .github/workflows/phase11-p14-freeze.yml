name: Phase 11 P14 candidate freeze

on:
  push:
    branches: [phase11-p14-bounded-independent-rescue]
    paths:
      - .github/workflows/phase11-p14-freeze.yml

permissions:
  contents: read
  actions: read

jobs:
  freeze:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install project
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Verify P14 scientific protocol unchanged
        run: |
          git fetch --depth=1 origin e02bb0635a92af2e3701154e19ad218f0283cdb4
          git diff --exit-code e02bb0635a92af2e3701154e19ad218f0283cdb4 HEAD -- \
            scripts/run_phase11_p14_bounded_independent_rescue.py \
            tests/test_phase11_p14_bounded_independent_rescue.py \
            docs/phase11_p14_bounded_independent_rescue_preregistration.md \
            docs/phase11_p15_final_holdout_preregistration.md
          pytest -q tests/test_phase11_p9_soft_update_direct_conformal.py tests/test_phase11_p14_bounded_independent_rescue.py
      - uses: actions/download-artifact@v4
        with:
          name: phase11-p14-partition-freeze
          path: partition_artifact
          github-token: ${{ github.token }}
          repository: suhaslord/uav-safety-research
          run-id: 31978541651
      - name: Verify exact partition freeze digest
        run: |
          PARTITION="partition_artifact/results/phase11_p14_partition/partition_freeze.json"
          test -f "$PARTITION"
          echo "69744506d49868848990ac64de5cea20057946b2280b0fcfe0f3cf32c2038387  $PARTITION" | sha256sum -c -
      - name: Generate calibration and freeze candidate only
        run: |
          rm -rf results/phase11_p14_freeze
          python scripts/run_phase11_p14_bounded_independent_rescue.py \
            --stage freeze \
            --partition partition_artifact/results/phase11_p14_partition/partition_freeze.json \
            --out results/phase11_p14_freeze \
            --git-sha "${GITHUB_SHA}" | tee phase11-p14-freeze.log
          test -f results/phase11_p14_freeze/calibration_frames.csv
          test -f results/phase11_p14_freeze/candidate_freeze.json
          test ! -f results/phase11_p14_freeze/transfer_result.json
          test ! -f results/phase11_p14_freeze/validation_result.json
          test ! -e results/phase11_p15_holdout
      - name: Candidate digests
        run: |
          sha256sum results/phase11_p14_freeze/candidate_freeze.json
          sha256sum results/phase11_p14_freeze/manifest.json
          python - <<'PY'
          import json
          from pathlib import Path
          c=json.loads(Path('results/phase11_p14_freeze/candidate_freeze.json').read_text())
          print('P14_CALIBRATION_CELLS='+json.dumps(c['calibration_cell_rows'],sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: phase11-p14-candidate-freeze
          path: |
            results/phase11_p14_freeze/
            phase11-p14-freeze.log
          if-no-files-found: error
          retention-days: 30
