name: Phase 11 P3 candidate freeze

on:
  push:
    branches:
      - phase11-p3-learned-scale-transfer
    paths:
      - scripts/run_phase11_p3_learned_scale_transfer.py
      - tests/test_phase11_p3_learned_scale_transfer.py
      - docs/phase11_p3_learned_scale_preregistration.md
      - .github/workflows/phase11-p3-freeze.yml

permissions:
  contents: read

jobs:
  freeze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install project
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Guard P3 invariants
        run: pytest -q tests/test_phase11_p3_learned_scale_transfer.py
      - name: Generate seen P3 candidate freeze inputs only
        run: |
          rm -rf results/phase11_p3_freeze
          python scripts/run_phase11_p3_learned_scale_transfer.py \
            --stage freeze \
            --out results/phase11_p3_freeze \
            --git-sha "${GITHUB_SHA}" | tee phase11-p3-freeze.log
          test ! -f results/phase11_p3_freeze/validation_frames.csv
          test ! -f results/phase11_p3_freeze/validation_result.json
      - name: Candidate freeze digest
        run: |
          sha256sum results/phase11_p3_freeze/candidate_freeze.json
          sha256sum results/phase11_p3_freeze/transfer_result.json
          cat results/phase11_p3_freeze/candidate_freeze.json
          cat results/phase11_p3_freeze/transfer_result.json
      - uses: actions/upload-artifact@v4
        with:
          name: phase11-p3-candidate-freeze
          path: |
            results/phase11_p3_freeze/
            phase11-p3-freeze.log
          if-no-files-found: error
          retention-days: 30
