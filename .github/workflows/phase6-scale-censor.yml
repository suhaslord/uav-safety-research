name: Phase 6 Scale Censor Benchmark

on:
  push:
    paths:
      - '.github/workflows/phase6-scale-censor.yml'
      - 'scripts/benchmark_phase6_scale_censor.py'
      - 'src/uav_safety/phase6_scale_censor.py'
      - 'tests/test_phase6_scale_censor.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scale-censor:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Full test suite
        run: pytest -q
      - name: Run perception-only scale-censor benchmark
        run: |
          python scripts/benchmark_phase6_scale_censor.py \
            --samples 40 \
            --seed 687431 \
            --calibration-seed 616161 \
            --out results/phase6_scale_censor
      - name: Upload scale-censor artifact
        uses: actions/upload-artifact@v4
        with:
          name: phase6-scale-censor
          path: results/phase6_scale_censor
          if-no-files-found: error
          retention-days: 45
