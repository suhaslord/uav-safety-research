name: Phase 21 orthogonal context spectrum development

on:
  push:
    branches: [phase21/orthogonal-context-spectrum]
    paths:
      - .github/workflows/phase21-development.yml

permissions:
  contents: read
  actions: read

env:
  MAINTENANCE_CI_RUN: '34014408636'
  MAINTENANCE_CI_HEAD: 715cfc4e9d5dffeff3e74bc43ae224d3ec525d48
  P12_RUN: '34004695243'
  P12_SHA: e2372ca597cdd983f098f1a45524c077798114c59a62bf9faccefd17b67a4991
  P14_RUN: '34010431456'
  P14_SHA: 0443d4e45a1966c77544c5c9965de8caec6e622c79ef8c2ce47aee82a3c95981
  P17_FIT_RUN: '34011621058'
  P17_FIT_SHA: 2ca52a418f5616e0e83ef84d0c9238ee429260cd4de7a553356b0c1bba44d8e0
  P20_FINAL_RUN: '34013829943'
  P20_FINAL_SHA: f2a0cf4e1cf0765c3194025eb29072f9663f27e3cdd13b0594cde4643f33934e
  P21_DEV_SEED: '2121211'

jobs:
  development:
    runs-on: ubuntu-24.04
    steps:
      - name: Refuse second Phase 21 development exposure
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          C=$(gh api -H 'Accept: application/vnd.github+json' '/repos/${{ github.repository }}/actions/artifacts?name=phase21-development&per_page=100' --jq '[.artifacts[] | select(.expired == false)] | length')
          test "$C" = "0" || { echo "Phase 21 development artifact already exists"; exit 1; }

      - name: Verify maintenance CI boundary
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          CONCLUSION=$(gh api "/repos/${{ github.repository }}/actions/runs/$MAINTENANCE_CI_RUN" --jq '.conclusion')
          HEAD=$(gh api "/repos/${{ github.repository }}/actions/runs/$MAINTENANCE_CI_RUN" --jq '.head_sha')
          test "$CONCLUSION" = "success"
          test "$HEAD" = "$MAINTENANCE_CI_HEAD"

      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }

      - name: Verify implementation before evidence
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          python -m compileall -q scripts/run_phase21_orthogonal_context_spectrum.py
          pytest -q tests/test_phase13c_pandas_writeable_array_maintenance.py tests/test_phase20_shapley_context_attenuation.py tests/test_phase21_orthogonal_context_spectrum.py
          grep -q '2121211' docs/phase21_preregistration.md
          grep -q 'F_RMSE >= 0.70' docs/phase21_preregistration.md
          grep -q 'all five RMSE first-order effects point toward attenuation' docs/phase21_preregistration.md
          grep -q 'all five MAE first-order effects point toward attenuation' docs/phase21_preregistration.md
          grep -q 'q90 remains descriptive only' docs/phase21_preregistration.md

      - name: Recover Phase 12
        uses: actions/download-artifact@v4
        with: { name: phase12-development-v3, path: p12, github-token: '${{ github.token }}', repository: suhaslord/uav-safety-research, run-id: '${{ env.P12_RUN }}' }

      - name: Recover Phase 14
        uses: actions/download-artifact@v4
        with: { name: phase14-bridge-candidate, path: p14, github-token: '${{ github.token }}', repository: suhaslord/uav-safety-research, run-id: '${{ env.P14_RUN }}' }

      - name: Recover Phase 17 fit
        uses: actions/download-artifact@v4
        with: { name: phase17-fit-candidate, path: p17fit, github-token: '${{ github.token }}', repository: suhaslord/uav-safety-research, run-id: '${{ env.P17_FIT_RUN }}' }

      - name: Recover exact Phase 20 final result
        uses: actions/download-artifact@v4
        with: { name: phase20-final, path: p20f, github-token: '${{ github.token }}', repository: suhaslord/uav-safety-research, run-id: '${{ env.P20_FINAL_RUN }}' }

      - name: Verify exact identities and freeze scientific head
        run: |
          P12=$(find p12 -path '*/results/phase12_candidate_v3/candidate_freeze.json' -print -quit)
          P14=$(find p14 -path '*/results/phase14_fit/bridge_candidate.json' -print -quit)
          P17=$(find p17fit -path '*/results/phase17_fit/fit_candidate.json' -print -quit)
          P20=$(find p20f -path '*/results/phase20_final/final_result.json' -print -quit)
          test -n "$P12"; test -n "$P14"; test -n "$P17"; test -n "$P20"
          echo "$P12_SHA  $P12" | sha256sum -c -
          echo "$P14_SHA  $P14" | sha256sum -c -
          echo "$P17_FIT_SHA  $P17" | sha256sum -c -
          echo "$P20_FINAL_SHA  $P20" | sha256sum -c -
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(next(Path('p20f').rglob('final_result.json')).read_text())
          assert r['phase20_pass'] is True
          assert r['phase19_final_pass_preserved'] is True
          assert r['phase18_failure_preserved_via_phase19'] is True
          assert r['q90_is_descriptive_only'] is True
          assert r['no_refit'] is True and r['zero_adaptation'] is True
          assert r['factorial_context_count'] == 32
          PY
          echo "P12_FILE=$P12" >> "$GITHUB_ENV"
          echo "P14_FILE=$P14" >> "$GITHUB_ENV"
          echo "P17_FILE=$P17" >> "$GITHUB_ENV"
          echo "P20_FILE=$P20" >> "$GITHUB_ENV"
          echo "P21_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Expose Phase 21 development evidence exactly once
        run: |
          rm -rf results/phase21_development
          python scripts/run_phase21_orthogonal_context_spectrum.py --stage dev --phase12-candidate "$P12_FILE" --phase14-bridge "$P14_FILE" --phase17-fit-candidate "$P17_FILE" --phase20-final-result "$P20_FILE" --out results/phase21_development --git-sha "$P21_SHA" 2>&1 | tee phase21-development.log
          test -f results/phase21_development/dev_result.json

      - name: Verify permanent development boundary and record verdict
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          r=json.loads(Path('results/phase21_development/dev_result.json').read_text())
          assert r['schema']=='aegisland.phase21.orthogonal-context-spectrum.dev-result.v1'
          assert r['evaluated_seed_seen_after_run']==int(os.environ['P21_DEV_SEED'])
          assert r['families']==list(range(2217,2241))
          assert r['scientific_git_sha']==os.environ['P21_SHA']
          assert r['phase20_final_pass_preserved'] is True
          assert r['phase19_final_pass_preserved_via_phase20'] is True
          assert r['phase18_failure_preserved_via_phase20'] is True
          assert r['factorial_context_count']==32 and len(r['contexts'])==32
          assert r['q90_is_descriptive_only'] is True
          assert r['no_refit'] is True and r['zero_adaptation'] is True
          assert r['simulation_only'] is True and r['safety_acceptance'] is False and r['controller_tuning_allowed'] is False
          assert len(r['gates'])==10
          print('PHASE21_DEV_PASS='+str(bool(r['phase21_pass'])).lower())
          print(json.dumps(r['gates'],indent=2,sort_keys=True))
          print(json.dumps(r['rmse_endpoint'],indent=2,sort_keys=True))
          print(json.dumps(r['mae_endpoint'],indent=2,sort_keys=True))
          print(json.dumps(r['rmse_walsh_spectrum'],indent=2,sort_keys=True))
          print(json.dumps(r['mae_walsh_spectrum'],indent=2,sort_keys=True))
          PY

      - name: Upload permanent Phase 21 development evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase21-development
          path: |
            results/phase21_development/
            phase21-development.log
          if-no-files-found: error
          retention-days: 90
