name: Publish AegisLand to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'deploy/**'
      - 'dashboard/**'
      - '.github/workflows/github-pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/cache@v4
        with:
          path: .cache/phase25/airisim_dataset2.7z
          key: phase25-kios-archive-13682584-865515c2d8f5e9cd9b2ee1e1ec294270
      - name: Install pinned image reconstruction tools
        run: python -m pip install py7zr==1.1.3 numpy==2.3.5 pandas==2.2.3 Pillow==12.3.0
      - name: Recover and verify all Phase 25 frame images
        run: |
          python scripts/download_kios_real_landing_dataset.py --out .cache/phase25 --accept-download
          python scripts/build_phase25_atlas_images.py \
            --archive .cache/phase25/airisim_dataset2.7z \
            --work .cache/phase25/rebuild \
            --out deploy/vercel/media/phase25
      - name: Fetch credited NASA photographs
        run: node deploy/vercel/fetch-editorial-media.mjs
      - name: Build static routes and project paths
        run: python deploy/github-pages/build.py --base-path /uav-safety-research
      - name: Verify all reconstructed images are in the Pages release
        run: |
          test "$(find _pages/media/phase25 -type f -name '*.jpg' | wc -l)" -eq 516
          grep -q 'preview_count": 516' _pages/media/phase25/manifest.json
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _pages
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish site
        id: deployment
        uses: actions/deploy-pages@v4
