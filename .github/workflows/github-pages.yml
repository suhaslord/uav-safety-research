name: Publish AegisLand to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'deploy/**'
      - 'dashboard/**'
      - '.github/workflows/github-pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch credited NASA photographs
        run: node deploy/vercel/fetch-editorial-media.mjs
      - name: Build static routes and project paths
        run: python deploy/github-pages/build.py --base-path /uav-safety-research
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _pages
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish site
        id: deployment
        uses: actions/deploy-pages@v4
