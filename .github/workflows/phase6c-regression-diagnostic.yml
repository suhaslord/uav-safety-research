name: Phase 6C Regression Diagnostic

on:
  push:
    paths:
      - '.github/workflows/phase6c-regression-diagnostic.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Full test suite
        run: pytest -q
      - name: Replay known Phase 6B regression episodes
        run: |
          python scripts/diagnose_phase6c_regressions.py \
            --calibration-seed 616161 \
            --temporal-calibration-samples 180 \
            --component-calibration-samples 280 \
            --out results/phase6c_regression_diagnostic
      - name: Upload Phase 6C diagnostic
        uses: actions/upload-artifact@v4
        with:
          name: phase6c-regression-diagnostic
          path: results/phase6c_regression_diagnostic
          if-no-files-found: error
          retention-days: 45
