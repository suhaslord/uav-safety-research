name: Emergency Vercel production deploy

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'deploy/vercel/**'
      - 'dashboard/**'
      - '.github/workflows/emergency-vercel-deploy.yml'

permissions:
  contents: read

concurrency:
  group: aegisland-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: team_4fHq5Px7I3sXJ9v8FOyXNOHD
      VERCEL_PROJECT_ID: prj_FNAwpTD02Jrab6rgiwurb13WYjzM

    steps:
      - name: Checkout requested revision
        uses: actions/checkout@v4

      - name: Verify Vercel token is configured
        shell: bash
        run: |
          test -n "$VERCEL_TOKEN" || { echo 'VERCEL_TOKEN is not configured'; exit 1; }

      - name: Fetch phase editorial media
        run: node deploy/vercel/fetch-editorial-media.mjs

      - name: Build self-contained production bundle
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .vercel-release
          mkdir -p .vercel-release
          cp -R deploy/vercel/. .vercel-release/
          cp -R dashboard .vercel-release/dashboard
          mkdir -p .vercel-release/.vercel
          printf '{"orgId":"%s","projectId":"%s"}\n' "$VERCEL_ORG_ID" "$VERCEL_PROJECT_ID" > .vercel-release/.vercel/project.json

      - name: Assert real-data release and preserved archive
        shell: bash
        run: |
          set -euo pipefail
          HOME=.vercel-release/index.html
          grep -q 'data-site-shell="native real-data"' "$HOME"
          grep -q 'KIOS Aerial Landing Pad' "$HOME"
          grep -q '422 REAL VIDEO FRAMES' "$HOME"
          grep -q 'The synthetic heuristic does not transfer well' "$HOME"
          grep -q '76.8%' "$HOME"
          grep -q '30.6%' "$HOME"
          grep -q '0.2176' "$HOME"
          grep -q 'Why no raw frame gallery here?' "$HOME"
          ! grep -q 'src="/media/acero-uav-flight.jpg"' "$HOME"
          ! grep -q 'document.write' "$HOME"
          ! grep -q 'cdn.jsdelivr.net/gh/suhaslord/uav-safety-research' "$HOME" .vercel-release/vercel.json

          test -f .vercel-release/aegisland.css
          test -f .vercel-release/research-workspace.css
          test -f .vercel-release/dashboard/phases/index.html
          test -f .vercel-release/dashboard/phases/frozen.html
          test -f .vercel-release/dashboard/phase-visuals.js
          test -f .vercel-release/frozen-lineage.js

          # Phase/editorial assets remain available for the historical archive even though
          # the homepage itself is now evidence-first and does not use NASA hero imagery.
          for ASSET in phase01-context.jpg phase06b-context.jpg phase16-context.jpg phase22-context.jpg; do
            test -s ".vercel-release/media/$ASSET"
          done

          grep -q 'The archive keeps the detours, not just the wins.' .vercel-release/dashboard/phases/index.html
          node - <<'NODE'
          global.window = {};
          require('./.vercel-release/frozen-lineage.js');
          const d = window.AEGIS_FROZEN_LINEAGE;
          if (!d || d.frozenThrough !== 'Phase 22') throw new Error('frozen frontier mismatch');
          if (d.phases.length !== 13 || d.counts.PASS !== 6 || d.counts.FAIL !== 7) throw new Error('frozen lineage count mismatch');
          if (d.bySlug.phase22.resultSha !== '0ddc968b8bd48c2de6d904194b417854913389a8927cff0b15b96c6501f8294c') throw new Error('Phase 22 result identity mismatch');
          NODE

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Deploy exact bundle to production
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          URL=$(vercel deploy --prod --force --yes --cwd .vercel-release --token="$VERCEL_TOKEN")
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "Production deployment: $URL"

      - name: Verify deployment and public alias
        shell: bash
        run: |
          set -euo pipefail
          DEPLOY_URL='${{ steps.deploy.outputs.url }}'
          PUBLIC_URL='https://aegisland-research-cockpit.vercel.app'

          for URL in "$DEPLOY_URL" "$PUBLIC_URL"; do
            HTML=''
            for i in {1..20}; do
              HTML=$(curl --fail --silent --show-error --location "$URL/?verify=$(date +%s)" || true)
              if printf '%s' "$HTML" | grep -q 'data-site-shell="native real-data"'; then break; fi
              sleep 2
            done
            printf '%s' "$HTML" | grep -q 'data-site-shell="native real-data"'
            printf '%s' "$HTML" | grep -q 'KIOS Aerial Landing Pad'
            printf '%s' "$HTML" | grep -q '422 REAL VIDEO FRAMES'
            printf '%s' "$HTML" | grep -q '76.8%'
            printf '%s' "$HTML" | grep -q '30.6%'
          done

          ARCHIVE=$(curl --fail --silent --show-error --location "$PUBLIC_URL/phases/")
          printf '%s' "$ARCHIVE" | grep -q 'The archive keeps the detours, not just the wins.'
          PHASE22=$(curl --fail --silent --show-error --location "$PUBLIC_URL/phases/phase22/")
          printf '%s' "$PHASE22" | grep -q '10 / 10'
          printf '%s' "$PHASE22" | grep -q 'simulation_only=true'
          echo '✓ real-data homepage live; frozen archive preserved'
