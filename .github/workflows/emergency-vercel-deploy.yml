name: Emergency Vercel production deploy

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aegisland-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: team_4fHq5Px7I3sXJ9v8FOyXNOHD
      VERCEL_PROJECT_ID: prj_FNAwpTD02Jrab6rgiwurb13WYjzM
      PRESERVED_COCKPIT_REF: 2b7543fe9b0794c6bec8540e5d33c16e00fa6a67

    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify Vercel token is configured
        shell: bash
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "VERCEL_TOKEN repository secret is not configured."
            exit 1
          fi

      - name: Build self-contained production bundle
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .vercel-release
          mkdir -p .vercel-release
          cp -R deploy/vercel/. .vercel-release/

          # Preserve the exact approved cockpit revision, but host it on the same
          # Vercel deployment instead of fetching it from jsDelivr at runtime.
          git archive "$PRESERVED_COCKPIT_REF" dashboard | tar -x -C .vercel-release

          python - <<'PY'
          from pathlib import Path
          import json
          import re

          root = Path('.vercel-release')
          index = root / 'index.html'
          text = index.read_text(encoding='utf-8')

          pattern = r"const rev='[^']+';const base=`https://cdn\.jsdelivr\.net/gh/suhaslord/uav-safety-research@\$\{rev\}/dashboard/`;"
          text, n = re.subn(pattern, "const base='/dashboard/';", text, count=1)
          if n != 1:
              raise SystemExit('Could not replace external cockpit CDN base in index.html')
          if 'cdn.jsdelivr.net/gh/suhaslord/uav-safety-research' in text:
              raise SystemExit('External cockpit CDN reference remains in index.html')
          index.write_text(text, encoding='utf-8')

          config_path = root / 'vercel.json'
          config = json.loads(config_path.read_text(encoding='utf-8'))
          config['rewrites'] = [
              r for r in config.get('rewrites', [])
              if not str(r.get('destination', '')).startswith('https://cdn.jsdelivr.net/')
          ]
          config_path.write_text(json.dumps(config, indent=2) + '\n', encoding='utf-8')

          if not (root / 'dashboard' / 'index.html').exists():
              raise SystemExit('Preserved dashboard/index.html missing from release bundle')
          if not (root / 'dashboard' / 'cockpit.css').exists():
              raise SystemExit('Preserved dashboard/cockpit.css missing from release bundle')
          if not (root / 'phase11.html').exists():
              raise SystemExit('Phase 11 page missing from release bundle')
          PY

          mkdir -p .vercel-release/.vercel
          cat > .vercel-release/.vercel/project.json <<EOF
          {"orgId":"$VERCEL_ORG_ID","projectId":"$VERCEL_PROJECT_ID"}
          EOF

      - name: Assert release has no runtime jsDelivr dependency
        shell: bash
        run: |
          set -euo pipefail
          ! grep -R "cdn.jsdelivr.net/gh/suhaslord/uav-safety-research" .vercel-release/index.html .vercel-release/vercel.json
          test -f .vercel-release/dashboard/index.html
          test -f .vercel-release/dashboard/cockpit.css
          test -f .vercel-release/dashboard/cockpit.js
          test -f .vercel-release/phase11.html

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Deploy exact bundle to production
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          URL=$(vercel deploy --prod --force --yes --cwd .vercel-release --token="$VERCEL_TOKEN")
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "Production deployment: $URL"

      - name: Verify deployed bundle and public alias
        shell: bash
        run: |
          set -euo pipefail
          DEPLOY_URL='${{ steps.deploy.outputs.url }}'
          PUBLIC_URL='https://aegisland-research-cockpit.vercel.app'

          for URL in "$DEPLOY_URL" "$PUBLIC_URL"; do
            echo "Checking $URL"
            HTML=$(curl --fail --silent --show-error --location --retry 5 --retry-delay 2 "$URL/")
            printf '%s' "$HTML" | grep -q "const base='/dashboard/'"
            if printf '%s' "$HTML" | grep -q "cdn.jsdelivr.net/gh/suhaslord/uav-safety-research"; then
              echo "External cockpit CDN dependency still present at $URL"
              exit 1
            fi
            curl --fail --silent --show-error --location "$URL/dashboard/index.html" >/dev/null
            curl --fail --silent --show-error --location "$URL/dashboard/cockpit.css" >/dev/null
            curl --fail --silent --show-error --location "$URL/phases/phase11/" | grep -q "Phase 11 P14R"
          done
