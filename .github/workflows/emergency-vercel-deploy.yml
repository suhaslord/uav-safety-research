name: Emergency Vercel production deploy

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aegisland-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: team_4fHq5Px7I3sXJ9v8FOyXNOHD
      VERCEL_PROJECT_ID: prj_FNAwpTD02Jrab6rgiwurb13WYjzM

    steps:
      - name: Checkout requested revision
        uses: actions/checkout@v4

      - name: Verify Vercel token is configured
        shell: bash
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "VERCEL_TOKEN repository secret is not configured."
            exit 1
          fi

      - name: Build self-contained production bundle
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .vercel-release
          mkdir -p .vercel-release

          # The release now ships the dashboard from the same commit being
          # deployed. There is no pinned historical cockpit and no runtime CDN
          # bootstrap. deploy/vercel contains the native homepage + routing;
          # dashboard contains the historical research archive assets.
          cp -R deploy/vercel/. .vercel-release/
          cp -R dashboard .vercel-release/dashboard

          mkdir -p .vercel-release/.vercel
          cat > .vercel-release/.vercel/project.json <<EOF
          {"orgId":"$VERCEL_ORG_ID","projectId":"$VERCEL_PROJECT_ID"}
          EOF

      - name: Assert release is native and self-contained
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'data-site-shell="native"' .vercel-release/index.html
          ! grep -q 'document.write' .vercel-release/index.html
          ! grep -q 'cdn.jsdelivr.net/gh/suhaslord/uav-safety-research' .vercel-release/index.html .vercel-release/vercel.json
          test -f .vercel-release/dashboard/phases/index.html
          test -f .vercel-release/dashboard/phases/phase.html
          test -f .vercel-release/dashboard/aegis-current.js
          test -f .vercel-release/dashboard/phase-runtime.js
          test -f .vercel-release/phase11.html

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Deploy exact bundle to production
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          URL=$(vercel deploy --prod --force --yes --cwd .vercel-release --token="$VERCEL_TOKEN")
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "Production deployment: $URL"

      - name: Verify deployed bundle and public alias
        shell: bash
        run: |
          set -euo pipefail
          DEPLOY_URL='${{ steps.deploy.outputs.url }}'
          PUBLIC_URL='https://aegisland-research-cockpit.vercel.app'

          # Verify the deployment succeeded by checking the deploy URL response
          echo "Checking deployment URL: $DEPLOY_URL"
          DEPLOY_HTML=$(curl --fail --silent --show-error --location --retry 5 --retry-delay 2 "$DEPLOY_URL/")
          
          # Preview URLs may return Vercel authentication/dashboard HTML instead of the actual site
          # Check for Vercel dashboard indicators (geist classes, Vercel branding)
          if printf '%s' "$DEPLOY_HTML" | grep -qi 'class="[^"]*geist\|Vercel.*Dashboard'; then
            echo "Preview URL returned Vercel dashboard/auth page (expected for private deployments)"
            echo "Skipping content verification for preview URL"
          else
            echo "Preview URL returned site content, verifying..."
            printf '%s' "$DEPLOY_HTML" | grep -q 'data-site-shell="native"'
            if printf '%s' "$DEPLOY_HTML" | grep -q 'document.write\|cdn.jsdelivr.net/gh/suhaslord/uav-safety-research'; then
              echo "Legacy production loader remains at preview URL"
              exit 1
            fi
          fi

          # Always verify the public production alias fully
          echo "Checking public URL: $PUBLIC_URL"
          PUBLIC_HTML=$(curl --fail --silent --show-error --location --retry 5 --retry-delay 2 "$PUBLIC_URL/")
          printf '%s' "$PUBLIC_HTML" | grep -q 'data-site-shell="native"'
          if printf '%s' "$PUBLIC_HTML" | grep -q 'document.write\|cdn.jsdelivr.net/gh/suhaslord/uav-safety-research'; then
            echo "Legacy production loader remains at public URL"
            exit 1
          fi

          # Verify critical content on public URL
          curl --fail --silent --show-error --location "$PUBLIC_URL/phases/" | grep -q "Every phase"
          curl --fail --silent --show-error --location "$PUBLIC_URL/phases/phase10r/" | grep -q "AegisLand Research Archive"
          curl --fail --silent --show-error --location "$PUBLIC_URL/phases/phase11/" | grep -q "Phase 11 P14R"
          curl --fail --silent --show-error --location "$PUBLIC_URL/aegis-current.js" >/dev/null
          
          echo "Verification complete: public alias is live with expected content"
