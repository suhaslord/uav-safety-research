name: Emergency Vercel production deploy

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'deploy/vercel/**'
      - 'dashboard/**'
      - '.github/workflows/emergency-vercel-deploy.yml'
      - '.github/qa/phase22-release-smoke.mjs'

permissions:
  contents: read

concurrency:
  group: aegisland-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: team_4fHq5Px7I3sXJ9v8FOyXNOHD
      VERCEL_PROJECT_ID: prj_FNAwpTD02Jrab6rgiwurb13WYjzM

    steps:
      - name: Checkout requested revision
        uses: actions/checkout@v4

      - name: Setup reconstruction runtime
        uses: actions/setup-python@v5
        with:
          python-version: 3.12

      - name: Cache verified KIOS source archive
        uses: actions/cache@v4
        with:
          path: .cache/phase25/airisim_dataset2.7z
          key: phase25-kios-archive-13682584-865515c2d8f5e9cd9b2ee1e1ec294270

      - name: Install pinned image reconstruction tools
        run: python -m pip install py7zr==1.1.3 numpy==2.3.5 pandas==2.2.3 Pillow==12.3.0

      - name: Recover and verify all Phase 25 frame images
        shell: bash
        run: |
          set -euo pipefail
          python scripts/download_kios_real_landing_dataset.py --out .cache/phase25 --accept-download
          python scripts/build_phase25_atlas_images.py \
            --archive .cache/phase25/airisim_dataset2.7z \
            --work .cache/phase25/rebuild \
            --out deploy/vercel/media/phase25

      - name: Verify Vercel token is configured
        shell: bash
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "VERCEL_TOKEN repository secret is not configured."
            exit 1
          fi

      - name: Verify current research website record and unmodified evidence figure
        run: python scripts/build_site_revalidation_data.py --check

      - name: Fetch licensed editorial media
        run: node deploy/vercel/fetch-editorial-media.mjs

      - name: Build self-contained production bundle
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .vercel-release
          mkdir -p .vercel-release
          cp -R deploy/vercel/. .vercel-release/
          # Preserve the sealed runtime, then layer live-only label corrections.
          # Vercel filesystem routes take precedence over rewrites.
          mv .vercel-release/failure-atlas.js .vercel-release/failure-atlas-frozen.js
          cp .vercel-release/failure-atlas-live.js .vercel-release/failure-atlas.js
          cp -R dashboard .vercel-release/dashboard
          python -c 'import json,os;open(".vercel-release/release.json","w").write(json.dumps({"commit":os.environ["GITHUB_SHA"],"branch":"main"})+"\n")'
          mkdir -p .vercel-release/.vercel
          cat > .vercel-release/.vercel/project.json <<EOF
          {"orgId":"$VERCEL_ORG_ID","projectId":"$VERCEL_PROJECT_ID"}
          EOF

      - name: Assert frozen Tesla-style release is native and self-contained
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'data-site-shell="native frozen-archive"' .vercel-release/index.html
          grep -q 'data-editorial-media="local-v2"' .vercel-release/index.html
          ! grep -q 'document.write' .vercel-release/index.html
          ! grep -q 'cdn.jsdelivr.net/gh/suhaslord/uav-safety-research' .vercel-release/index.html .vercel-release/vercel.json

          test -f .vercel-release/aegisland.css
          test -f .vercel-release/research-home.css
          test -f .vercel-release/research-media.css
          test -f .vercel-release/phase-polish.css
          test -f .vercel-release/ui-review.css
          test -f .vercel-release/site-refresh.css
          test -f .vercel-release/phase-report.css
          test -f .vercel-release/phase23.html
          test -f .vercel-release/model-vase.html
          test -f .vercel-release/model-vase.css
          test -f .vercel-release/aegisland-brand.css
          test -f .vercel-release/model-vase-mark.svg
          test "$(find .vercel-release/media/phase25 -type f -name '*.jpg' | wc -l)" -eq 516
          grep -q '"preview_count": 516' .vercel-release/media/phase25/manifest.json
          test -f .vercel-release/failure-atlas-live.js
          cmp deploy/vercel/failure-atlas.js .vercel-release/failure-atlas-frozen.js
          cmp deploy/vercel/failure-atlas-live.js .vercel-release/failure-atlas.js
          test -f .vercel-release/frozen-lineage.js
          test -f .vercel-release/dashboard/phase-visuals.js
          test -f .vercel-release/dashboard/phase-editorial-media.js
          test -f .vercel-release/dashboard/phase-editorial-media.css
          for ASSET in synthetic_clean.png synthetic_blur.png synthetic_low_light.png synthetic_occlusion.png synthetic_mixed.png; do
            test -s ".vercel-release/media/perception/$ASSET"
          done
          for ASSET in kios_clean.jpg kios_blur.jpg kios_low_light.jpg kios_noise.jpg kios_occlusion.jpg kios_mixed.jpg; do
            test -s ".vercel-release/media/perception/$ASSET"
          done

          for ASSET in acero-uav-flight.jpg acero-ground-control.jpg stereo-uav-preflight.jpg acero-uav-landing.jpg phase01-context.jpg phase02-context.jpg phase04-context.jpg phase05-context.jpg phase06b-context.jpg phase07-context.jpg phase08-context.jpg phase10-context.jpg phase10r-context.jpg phase12-context.jpg phase13a-context.jpg phase13b-context.jpg phase13c-context.jpg phase14-context.jpg phase15-context.jpg phase16-context.jpg phase17-context.jpg phase18-context.jpg phase19-context.jpg phase20-context.jpg phase21-context.jpg phase22-context.jpg; do
            test -s ".vercel-release/media/$ASSET"
          done
          for ASSET in aerocast-flight.mp4 aerocast-poster.jpg evaluation-nasa-clip.mp4 evaluation-nasa-poster.jpg; do
            test -s ".vercel-release/film/$ASSET"
          done

          test -f .vercel-release/dashboard/phases/index.html
          test -f .vercel-release/dashboard/phases/frozen.html
          test -f .vercel-release/phase11.html

          grep -q 'href="/aegisland.css?v=' .vercel-release/index.html
          ! grep -q 'href="/signature.css?v=' .vercel-release/index.html
          grep -q 'href="/research-home.css?v=' .vercel-release/index.html
          grep -q 'href="/research-media.css?v=' .vercel-release/index.html
          grep -q 'src="/media/acero-uav-flight.jpg"' .vercel-release/index.html
          grep -q 'href="/aegisland-brand.css?v=' .vercel-release/index.html
          grep -q 'src="/model-vase-mark.svg"' .vercel-release/index.html
          test "$(grep -o 'NASA field image · context only' .vercel-release/index.html | wc -l)" -eq 1
          grep -q 'Don Richey / NASA Ames Research Center' .vercel-release/index.html
          ! grep -q '<img[^>]*src="https://' .vercel-release/index.html
          grep -q 'Can the system know when its landing estimate is unreliable?' .vercel-release/index.html
          grep -q 'Model VASE · answer so far' .vercel-release/index.html
          grep -q 'Baseline measured · Phase 23 paired' .vercel-release/index.html
          grep -q 'These are different experiments. They have not been joined into one tested model.' .vercel-release/index.html
          grep -q 'id="current-audit"' .vercel-release/index.html
          grep -q 'href="/ui-review.css?v=' .vercel-release/index.html
          grep -q 'href="/site-refresh.css?v=' .vercel-release/index.html
          ! grep -q '/lab/lab.js' .vercel-release/index.html
          grep -q '/media/perception/synthetic_clean.png' .vercel-release/presentation.js
          ! grep -q 'raw.githubusercontent.com' .vercel-release/presentation.js
          grep -q 'home-lineage__track' .vercel-release/index.html
          grep -q '6 PASS / 7 FAIL' .vercel-release/index.html
          grep -q '0.8319' .vercel-release/index.html
          grep -q '0.7744' .vercel-release/index.html
          grep -q '100%' .vercel-release/index.html
          grep -q 'simulation_only=true' .vercel-release/index.html
          grep -q 'safety_acceptance=false' .vercel-release/index.html
          grep -q 'controller_tuning_allowed=false' .vercel-release/index.html
          grep -q 'Model VASE is an integrated research architecture, not a newly trained checkpoint.' .vercel-release/model-vase.html
          grep -q 'V3 PATH · CONNECTED' .vercel-release/model-vase.html
          grep -q 'class="vase-hero__media"' .vercel-release/model-vase.html
          grep -q 'src="/media/acero-uav-landing.jpg"' .vercel-release/model-vase.html
          grep -q 'class="home-field-media"' .vercel-release/index.html
          grep -q 'src="/film/aerocast-flight.mp4"' .vercel-release/index.html
          grep -q 'src="/film/evaluation-nasa-clip.mp4"' .vercel-release/index.html
          test "$(grep -o 'data-autoplay="visible"' .vercel-release/index.html | wc -l)" -eq 2
          grep -q 'muted loop preload="none" data-autoplay="visible"' .vercel-release/index.html
          grep -q 'data-presentation="evidence-led"' .vercel-release/index.html
          grep -q 'id="home-comparison"' .vercel-release/index.html
          test -s .vercel-release/home-evidence.css
          test -s .vercel-release/home-evidence.js
          grep -q 'src="/film/aerocast-flight.webm" type="video/webm"' .vercel-release/index.html
          grep -q 'src="/film/evaluation-nasa-clip.webm" type="video/webm"' .vercel-release/index.html
          test -s .vercel-release/film/aerocast-flight.webm
          test -s .vercel-release/film/evaluation-nasa-clip.webm
          grep -q 'href="/aegisland-brand.css?v=' .vercel-release/model-vase.html
          grep -q '#e82127' .vercel-release/model-vase.css
          grep -q '/media/phase25/${condition}/${item.id}' .vercel-release/failure-atlas-frozen.js
          grep -q 'Local image · unverified · measured predictions unchanged' .vercel-release/failure-atlas.js
          grep -q 'Loading the verified 86-frame image set' .vercel-release/failure-atlas.html

          grep -q 'href="/phase-polish.css?v=' .vercel-release/dashboard/phases/index.html
          grep -q 'href="/phase-polish.css?v=' .vercel-release/dashboard/phases/frozen.html
          grep -q 'href="/phase-polish.css?v=' .vercel-release/dashboard/phases/phase.html
          grep -q 'href="/phase-editorial-media.css?v=' .vercel-release/dashboard/phases/frozen.html
          grep -q 'href="/phase-editorial-media.css?v=' .vercel-release/dashboard/phases/phase.html
          grep -q 'src="/phase-visuals.js?v=' .vercel-release/dashboard/phases/frozen.html
          grep -q 'src="/phase-editorial-media.js?v=' .vercel-release/dashboard/phases/frozen.html
          grep -q 'src="/phase-visuals.js?v=' .vercel-release/dashboard/phases/phase.html
          grep -q 'src="/phase-editorial-media.js?v=' .vercel-release/dashboard/phases/phase.html
          grep -q 'src="/phase-visuals.js?v=' .vercel-release/phase11.html
          grep -q 'src="/phase-editorial-media.js?v=' .vercel-release/phase11.html
          ! grep -q 'href="/signature.css?v=' .vercel-release/dashboard/phases/index.html
          ! grep -q 'href="/signature.css?v=' .vercel-release/dashboard/phases/frozen.html
          grep -q 'Keep every result in view.' .vercel-release/dashboard/phases/index.html

          node - <<'NODE'
          global.window = {};
          require('./.vercel-release/frozen-lineage.js');
          const d = window.AEGIS_FROZEN_LINEAGE;
          if (!d || d.frozenThrough !== 'Phase 22') throw new Error('frozen frontier mismatch');
          if (d.phases.length !== 13) throw new Error('frozen lineage record count mismatch');
          if (d.counts.PASS !== 6 || d.counts.FAIL !== 7) throw new Error('pass/fail count mismatch');
          if (d.bySlug.phase13a.verdict !== 'FAIL' || d.bySlug.phase13b.verdict !== 'FAIL') throw new Error('Phase 13 failures were rewritten');
          if (d.bySlug.phase18.verdict !== 'FAIL') throw new Error('Phase 18 failure was rewritten');
          if (d.bySlug.phase19.verdict !== 'PASS' || d.bySlug.phase20.verdict !== 'PASS' || d.bySlug.phase21.verdict !== 'PASS' || d.bySlug.phase22.verdict !== 'PASS') throw new Error('late frozen pass missing');
          if (d.bySlug.phase22.resultSha !== '0ddc968b8bd48c2de6d904194b417854913389a8927cff0b15b96c6501f8294c') throw new Error('Phase 22 final result identity mismatch');
          if (d.bySlug.phase22.candidateSha !== '62e75d7b39088c2e66f1cc6be4d180501b79632f2f6847af1fbe0bd96be17551') throw new Error('Phase 22 candidate identity mismatch');
          if (d.frozenScientificHead !== '668d065714dde279857bc0e196f0ef7cc5e182ed') throw new Error('Phase 22 scientific head mismatch');
          if (d.phase22FinalRun !== '34043148327' || d.phase22FinalArtifact !== '9992317865') throw new Error('Phase 22 final run/artifact mismatch');
          if (d.phase22FinalArtifactDigest !== 'sha256:78fa8d0d5a0df2a59d2d65a3e30abb1e8c948c1f3b9b66a2cb262f00adb971cb') throw new Error('Phase 22 artifact digest mismatch');
          if (d.boundary.simulation_only !== true || d.boundary.safety_acceptance !== false || d.boundary.controller_tuning_allowed !== false) throw new Error('claim boundary mismatch');
          NODE

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Deploy exact bundle to production
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          URL=$(vercel deploy --prod --force --yes --cwd .vercel-release --meta githubCommitSha="$GITHUB_SHA" --meta githubCommitRef=main --token="$VERCEL_TOKEN")
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "Production deployment: $URL"

      - name: Verify deployed frozen archive and public alias
        shell: bash
        run: |
          set -euo pipefail
          DEPLOY_URL='${{ steps.deploy.outputs.url }}'
          PUBLIC_URL='https://aegisland-research-cockpit.vercel.app'

          echo "Checking deployment URL: $DEPLOY_URL"
          DEPLOY_HTML=$(curl --fail --silent --show-error --location --retry 5 --retry-delay 2 "$DEPLOY_URL/")
          if printf '%s' "$DEPLOY_HTML" | grep -qi 'class="[^"]*geist\|Vercel.*Dashboard'; then
            echo "Preview URL returned Vercel dashboard/auth page; verifying public alias instead."
          else
            ! printf '%s' "$DEPLOY_HTML" | grep 'document.write\|cdn.jsdelivr.net/gh/suhaslord/uav-safety-research' > /dev/null
          fi

          echo "=== Verifying public production alias: $PUBLIC_URL ==="
          PUBLIC_HTML=$(curl --fail --silent --show-error --location --retry 5 --retry-delay 2 "$PUBLIC_URL/")
          ! printf '%s' "$PUBLIC_HTML" | grep 'document.write\|cdn.jsdelivr.net/gh/suhaslord/uav-safety-research' > /dev/null
          printf '%s' "$PUBLIC_HTML" | grep 'data-site-shell="native frozen-archive"' > /dev/null
          printf '%s' "$PUBLIC_HTML" | grep 'data-editorial-media="local-v2"' > /dev/null
          printf '%s' "$PUBLIC_HTML" | grep 'href="/aegisland.css?v=' > /dev/null
          printf '%s' "$PUBLIC_HTML" | grep 'href="/research-home.css?v=' > /dev/null
          printf '%s' "$PUBLIC_HTML" | grep 'href="/research-media.css?v=' > /dev/null
          printf '%s' "$PUBLIC_HTML" | grep 'href="/aegisland-brand.css?v=' > /dev/null
          printf '%s' "$PUBLIC_HTML" | grep 'src="/model-vase-mark.svg"' > /dev/null
          test "$(printf '%s' "$PUBLIC_HTML" | grep -o 'NASA field image · context only' | wc -l)" -eq 1
          printf '%s' "$PUBLIC_HTML" | grep 'Don Richey / NASA Ames Research Center' > /dev/null
          printf '%s' "$PUBLIC_HTML" | grep 'Can the system know when its landing estimate is unreliable?' > /dev/null
          printf '%s' "$PUBLIC_HTML" | grep 'Model VASE · answer so far' > /dev/null
          printf '%s' "$PUBLIC_HTML" | grep 'Baseline measured · Phase 23 paired' > /dev/null
          ! printf '%s' "$PUBLIC_HTML" | grep '/lab/lab.js' > /dev/null
          printf '%s' "$PUBLIC_HTML" | grep 'id="current-audit"' > /dev/null
          printf '%s' "$PUBLIC_HTML" | grep 'href="/ui-review.css?v=' > /dev/null
          printf '%s' "$PUBLIC_HTML" | grep 'href="/site-refresh.css?v=' > /dev/null
          printf '%s' "$PUBLIC_HTML" | grep 'home-lineage__track' > /dev/null
          printf '%s' "$PUBLIC_HTML" | grep '0.8319' > /dev/null
          printf '%s' "$PUBLIC_HTML" | grep '0.7744' > /dev/null
          printf '%s' "$PUBLIC_HTML" | grep 'simulation_only=true' > /dev/null
          printf '%s' "$PUBLIC_HTML" | grep 'safety_acceptance=false' > /dev/null
          printf '%s' "$PUBLIC_HTML" | grep 'controller_tuning_allowed=false' > /dev/null
          test "$(printf '%s' "$PUBLIC_HTML" | grep -o 'data-autoplay="visible"' | wc -l)" -eq 2
          printf '%s' "$PUBLIC_HTML" | grep 'src="/film/aerocast-flight.webm" type="video/webm"' > /dev/null
          printf '%s' "$PUBLIC_HTML" | grep 'src="/film/evaluation-nasa-clip.webm" type="video/webm"' > /dev/null

          MODEL_HTML=$(curl --fail --silent --show-error --location "$PUBLIC_URL/model-vase/")
          printf '%s' "$MODEL_HTML" | grep 'Model VASE' > /dev/null
          printf '%s' "$MODEL_HTML" | grep 'V3 PATH · CONNECTED' > /dev/null
          printf '%s' "$MODEL_HTML" | grep 'src="/model-vase-mark.svg"' > /dev/null
          curl --fail --silent --show-error --location "$PUBLIC_URL/model-vase-evidence.js" >/dev/null
          ATLAS_HTML=$(curl --fail --silent --show-error --location "$PUBLIC_URL/failure-atlas/")
          printf '%s' "$ATLAS_HTML" | grep 'Loading the verified 86-frame image set' > /dev/null
          printf '%s' "$ATLAS_HTML" | grep 'Images selected locally are not hash-checked' > /dev/null
          HOME_HTML=$(curl --fail --silent --show-error --location "$PUBLIC_URL/")
          printf '%s' "$HOME_HTML" | grep 'Landing research, in the field.' > /dev/null
          MODEL_HTML=$(curl --fail --silent --show-error --location "$PUBLIC_URL/model-vase/")
          printf '%s' "$MODEL_HTML" | grep 'class="vase-hero__media"' > /dev/null
          PHASE23_HTML=$(curl --fail --silent --show-error --location "$PUBLIC_URL/phases/phase23/")
          printf '%s' "$PHASE23_HTML" | grep 'Explore all 86 frames in Failure Atlas' > /dev/null

          for ASSET in acero-uav-flight.jpg acero-ground-control.jpg stereo-uav-preflight.jpg acero-uav-landing.jpg phase01-context.jpg phase22-context.jpg; do
            curl --fail --silent --show-error --location "$PUBLIC_URL/media/$ASSET" -o "/tmp/$ASSET"
            test $(wc -c < "/tmp/$ASSET") -gt 50000
          done
          echo "✓ Editorial media: expanded local NASA photo set resolves"

          for ASSET in aerocast-flight.mp4 aerocast-flight.webm aerocast-poster.jpg evaluation-nasa-clip.mp4 evaluation-nasa-clip.webm evaluation-nasa-poster.jpg; do
            curl --fail --silent --show-error --location "$PUBLIC_URL/film/$ASSET" -o "/tmp/$ASSET"
            test $(wc -c < "/tmp/$ASSET") -gt 1000
          done
          echo "✓ Homepage MP4/WebM clips and poster frames resolve"

          for CONDITION in clean blur low_light noise occlusion mixed; do
            curl --fail --silent --show-error --location "$PUBLIC_URL/media/perception/kios_$CONDITION.jpg" -o /dev/null
            curl --fail --silent --show-error --location "$PUBLIC_URL/media/phase25/$CONDITION/land_pad2__2050.jpg" -o "/tmp/phase25-$CONDITION.jpg"
            test $(wc -c < "/tmp/phase25-$CONDITION.jpg") -gt 1000
          done
          echo "✓ Failure Atlas: one reconstructed image in every condition resolves"

          curl --fail --silent --show-error --location "$PUBLIC_URL/aegisland.css" >/dev/null
          curl --fail --silent --show-error --location "$PUBLIC_URL/research-home.css" >/dev/null
          curl --fail --silent --show-error --location "$PUBLIC_URL/research-media.css" >/dev/null
          curl --fail --silent --show-error --location "$PUBLIC_URL/ui-review.css" >/dev/null
          curl --fail --silent --show-error --location "$PUBLIC_URL/site-refresh.css" >/dev/null
          curl --fail --silent --show-error --location "$PUBLIC_URL/aegisland-brand.css" >/dev/null
          curl --fail --silent --show-error --location "$PUBLIC_URL/model-vase-mark.svg" >/dev/null
          curl --fail --silent --show-error --location "$PUBLIC_URL/model-vase.css" >/dev/null
          curl --fail --silent --show-error --location "$PUBLIC_URL/failure-atlas.js" >/dev/null
          curl --fail --silent --show-error --location "$PUBLIC_URL/phase-polish.css" >/dev/null
          curl --fail --silent --show-error --location "$PUBLIC_URL/phase-editorial-media.css" >/dev/null
          curl --fail --silent --show-error --location "$PUBLIC_URL/phase-visuals.js" >/dev/null
          curl --fail --silent --show-error --location "$PUBLIC_URL/phase-editorial-media.js" >/dev/null
          curl --fail --silent --show-error --location "$PUBLIC_URL/frozen-lineage.js" -o /tmp/frozen-lineage.js
          node - <<'NODE'
          global.window = {};
          require('/tmp/frozen-lineage.js');
          const d = window.AEGIS_FROZEN_LINEAGE;
          if (d.frozenThrough !== 'Phase 22' || d.phases.length !== 13) throw new Error('public lineage shape mismatch');
          if (d.counts.PASS !== 6 || d.counts.FAIL !== 7) throw new Error('public pass/fail count mismatch');
          if (d.bySlug.phase13a.verdict !== 'FAIL' || d.bySlug.phase18.verdict !== 'FAIL' || d.bySlug.phase22.verdict !== 'PASS') throw new Error('public verdict mismatch');
          if (d.bySlug.phase22.resultSha !== '0ddc968b8bd48c2de6d904194b417854913389a8927cff0b15b96c6501f8294c') throw new Error('public Phase 22 result mismatch');
          if (d.bySlug.phase22.candidateSha !== '62e75d7b39088c2e66f1cc6be4d180501b79632f2f6847af1fbe0bd96be17551') throw new Error('public Phase 22 candidate mismatch');
          if (d.frozenScientificHead !== '668d065714dde279857bc0e196f0ef7cc5e182ed') throw new Error('public scientific head mismatch');
          NODE
          echo "✓ Frozen lineage asset: exact 6 PASS / 7 FAIL record and Phase 22 identities present"

          ARCHIVE_HTML=$(curl --fail --silent --show-error --location "$PUBLIC_URL/phases/")
          printf '%s' "$ARCHIVE_HTML" | grep 'Keep every result in view.' > /dev/null
          printf '%s' "$ARCHIVE_HTML" | grep 'href="/phase-polish.css?v=' > /dev/null
          ! printf '%s' "$ARCHIVE_HTML" | grep 'href="/signature.css?v=' > /dev/null
          echo "✓ Archive: rewritten phase index present"

          for PHASE in phase12 phase13a phase13b phase13c phase14 phase15 phase16 phase17 phase18 phase19 phase20 phase21 phase22; do
            PHASE_HTML=$(curl --fail --silent --show-error --location "$PUBLIC_URL/phases/$PHASE/")
            printf '%s' "$PHASE_HTML" | grep 'phaseContent' > /dev/null
            printf '%s' "$PHASE_HTML" | grep 'href="/phase-polish.css?v=' > /dev/null
            printf '%s' "$PHASE_HTML" | grep 'src="/phase-visuals.js?v=' > /dev/null
            printf '%s' "$PHASE_HTML" | grep 'src="/phase-editorial-media.js?v=' > /dev/null
          done
          echo "✓ Frozen detail routes: Phase 12 through Phase 22 resolve through the polished shared detail system with contextual photography"

          PHASE1_HTML=$(curl --fail --silent --show-error --location "$PUBLIC_URL/phases/phase1/")
          printf '%s' "$PHASE1_HTML" | grep 'href="/phase-polish.css?v=' > /dev/null
          printf '%s' "$PHASE1_HTML" | grep 'src="/phase-visuals.js?v=' > /dev/null
          PHASE10R_HTML=$(curl --fail --silent --show-error --location "$PUBLIC_URL/phases/phase10r/")
          printf '%s' "$PHASE10R_HTML" | grep 'href="/phase-polish.css?v=' > /dev/null
          PHASE11_HTML=$(curl --fail --silent --show-error --location "$PUBLIC_URL/phases/phase11/")
          printf '%s' "$PHASE11_HTML" | grep 'Phase 11 P14R' > /dev/null
          printf '%s' "$PHASE11_HTML" | grep 'src="/phase-visuals.js?v=' > /dev/null
          PHASE23_HTML=$(curl --fail --silent --show-error --location "$PUBLIC_URL/phases/phase23/")
          printf '%s' "$PHASE23_HTML" | grep 'Phase 23 · KIOS protected detector benchmark' > /dev/null
          printf '%s' "$PHASE23_HTML" | grep 'href="/phase-report.css?v=' > /dev/null
          for CONDITION in clean blur low_light noise occlusion mixed; do
            curl --fail --silent --show-error --location "$PUBLIC_URL/media/perception/kios_${CONDITION}.jpg" -o /dev/null
          done
          ATLAS_HTML=$(curl --fail --silent --show-error --location "$PUBLIC_URL/failure-atlas/")
          printf '%s' "$ATLAS_HTML" | grep 'Loading the verified 86-frame image set' > /dev/null
          printf '%s' "$ATLAS_HTML" | grep 'failure-atlas.js?v=8' > /dev/null
          curl --fail --silent --show-error --location "$PUBLIC_URL/media/phase25/clean/land_pad__6500.jpg" -o /dev/null
          curl --fail --silent --show-error --location "$PUBLIC_URL/media/phase25/mixed/land_pad2__2100.jpg" -o /dev/null
          echo "✓ Phase 23 examples and reconstructed Failure Atlas frames load from production"

          curl --fail --silent --show-error --location "$PUBLIC_URL/data/research-revalidation.json" -o /tmp/research-revalidation.json
          curl --fail --silent --show-error --location "$PUBLIC_URL/failure-atlas-data.json" -o /tmp/research-atlas.json
          python - <<'PY'
          import json
          current=json.load(open('/tmp/research-revalidation.json'))
          atlas=json.load(open('/tmp/research-atlas.json'))
          assert current['phase23']['phase23_cells_checked']==24
          assert current['phase23']['maximum_absolute_delta']==0
          assert current['phase23']['clean_stressed_pair_count']==860
          assert current['phase26']['status']=='NO_DATASET_ADMITTED'
          assert current['phase26']['minimum_accepted_dhash_distance']==10
          assert atlas['status']=='paired_verified'
          assert len(atlas['phase23']['cases'])==516
          assert atlas['phase23']['prediction_rows']==71420
          PY
          curl --fail --silent --show-error --location "$PUBLIC_URL/media/research-revalidation-occlusion.png" -o /tmp/research-revalidation-occlusion.png
          test $(wc -c < /tmp/research-revalidation-occlusion.png) -gt 1000
          REPRO_HTML=$(curl --fail --silent --show-error --location "$PUBLIC_URL/reproduce/")
          printf '%s' "$REPRO_HTML" | grep 'validate_research_release.py' > /dev/null
          printf '%s' "$REPRO_HTML" | grep '1.0.0rc1' > /dev/null

          echo "=== Verification complete: current verified research and the unchanged frozen simulation archive are published ==="

      - name: Verify production desktop/mobile evidence and navigation
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
          QA_BASE_URL=https://aegisland-research-cockpit.vercel.app node .github/qa/phase22-release-smoke.mjs
          QA_BASE_URL=https://aegisland-research-cockpit.vercel.app QA_OUT=qa-artifacts/home-evidence node .github/qa/home-evidence-smoke.mjs
          QA_BASE_URL=https://aegisland-research-cockpit.vercel.app node .github/qa/website-regression-smoke.mjs
          python -c 'import json,os,urllib.request; d=json.load(urllib.request.urlopen("https://aegisland-research-cockpit.vercel.app/release.json")); assert d["commit"]==os.environ["GITHUB_SHA"],d'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: production-responsive-qa
          path: qa-artifacts/
