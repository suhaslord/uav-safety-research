name: Emergency Vercel production deploy

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aegisland-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: team_4fHq5Px7I3sXJ9v8FOyXNOHD
      VERCEL_PROJECT_ID: prj_FNAwpTD02Jrab6rgiwurb13WYjzM

    steps:
      - name: Checkout requested revision
        uses: actions/checkout@v4

      - name: Verify Vercel token is configured
        shell: bash
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "VERCEL_TOKEN repository secret is not configured."
            exit 1
          fi

      - name: Build self-contained production bundle
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .vercel-release
          mkdir -p .vercel-release

          # Ship the dashboard from the same commit being deployed. There is no
          # pinned historical cockpit and no runtime CDN bootstrap.
          cp -R deploy/vercel/. .vercel-release/
          cp -R dashboard .vercel-release/dashboard

          mkdir -p .vercel-release/.vercel
          cat > .vercel-release/.vercel/project.json <<EOF
          {"orgId":"$VERCEL_ORG_ID","projectId":"$VERCEL_PROJECT_ID"}
          EOF

      - name: Assert release is native and self-contained
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'data-site-shell="native"' .vercel-release/index.html
          ! grep -q 'document.write' .vercel-release/index.html
          ! grep -q 'cdn.jsdelivr.net/gh/suhaslord/uav-safety-research' .vercel-release/index.html .vercel-release/vercel.json
          test -f .vercel-release/dashboard/phases/index.html
          test -f .vercel-release/dashboard/phases/phase.html
          test -f .vercel-release/dashboard/aegis-current.js
          test -f .vercel-release/dashboard/phase-runtime.js
          test -f .vercel-release/phase11.html
          test -f .vercel-release/phase12.html
          grep -q 'Open Phase 12' .vercel-release/index.html
          grep -q '2.23035' .vercel-release/index.html
          grep -q '935935' .vercel-release/phase12.html

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Deploy exact bundle to production
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          URL=$(vercel deploy --prod --force --yes --cwd .vercel-release --token="$VERCEL_TOKEN")
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "Production deployment: $URL"

      - name: Verify deployed bundle and public alias
        shell: bash
        run: |
          set -euo pipefail
          DEPLOY_URL='${{ steps.deploy.outputs.url }}'
          PUBLIC_URL='https://aegisland-research-cockpit.vercel.app'

          echo "Checking deployment URL: $DEPLOY_URL"
          DEPLOY_HTML=$(curl --fail --silent --show-error --location --retry 5 --retry-delay 2 "$DEPLOY_URL/")

          if printf '%s' "$DEPLOY_HTML" | grep -qi 'class="[^"]*geist\|Vercel.*Dashboard'; then
            echo "Preview URL returned Vercel dashboard/auth page; verifying public alias instead."
          else
            echo "Preview URL returned site content; checking for legacy loaders."
            if printf '%s' "$DEPLOY_HTML" | grep -q 'document.write\|cdn.jsdelivr.net/gh/suhaslord/uav-safety-research'; then
              echo "ERROR: Legacy production loader found at preview URL"
              exit 1
            fi
          fi

          echo ""
          echo "=== Verifying public production alias: $PUBLIC_URL ==="
          PUBLIC_HTML=$(curl --fail --silent --show-error --location --retry 5 --retry-delay 2 "$PUBLIC_URL/")

          if printf '%s' "$PUBLIC_HTML" | grep -q 'document.write\|cdn.jsdelivr.net/gh/suhaslord/uav-safety-research'; then
            echo "ERROR: Legacy production loader remains at public URL homepage"
            exit 1
          fi
          echo "✓ Homepage: no legacy loaders"

          printf '%s' "$PUBLIC_HTML" | grep -q 'data-site-shell="native"'
          printf '%s' "$PUBLIC_HTML" | grep -q 'Open Phase 12'
          printf '%s' "$PUBLIC_HTML" | grep -q '2.23035'
          printf '%s' "$PUBLIC_HTML" | grep -q '95.53%'
          printf '%s' "$PUBLIC_HTML" | grep -q 'safety_acceptance=false'
          echo "✓ Homepage: Phase 12 final result and claim boundary present"

          echo ""
          echo "Verifying Phase 12 page content..."
          PHASE12_HTML=$(curl --fail --silent --show-error --location --retry 5 --retry-delay 2 "$PUBLIC_URL/phases/phase12/")
          printf '%s' "$PHASE12_HTML" | grep -q 'Phase 12'
          printf '%s' "$PHASE12_HTML" | grep -q 'View progression'
          printf '%s' "$PHASE12_HTML" | grep -q 'Read final report'
          printf '%s' "$PHASE12_HTML" | grep -q '935935'
          printf '%s' "$PHASE12_HTML" | grep -q '2.23035'
          printf '%s' "$PHASE12_HTML" | grep -q '95.53%'
          printf '%s' "$PHASE12_HTML" | grep -q 'simulation_only=true'
          printf '%s' "$PHASE12_HTML" | grep -q 'safety_acceptance=false'
          printf '%s' "$PHASE12_HTML" | grep -q 'controller_tuning_allowed=false'
          echo "✓ Phase 12: final replication content present"

          echo ""
          echo "Verifying Phase 11 remains archived and explicit..."
          PHASE11_HTML=$(curl --fail --silent --show-error --location --retry 5 --retry-delay 2 "$PUBLIC_URL/phases/phase11/")
          printf '%s' "$PHASE11_HTML" | grep -q 'Phase 11 P14R'
          printf '%s' "$PHASE11_HTML" | grep -q '2.435'
          printf '%s' "$PHASE11_HTML" | grep -q '2.25'
          echo "✓ Phase 11: failed predecessor remains visible"

          echo ""
          echo "Verifying archive and assets..."
          ARCHIVE_HTML=$(curl --fail --silent --show-error --location --retry 5 --retry-delay 2 "$PUBLIC_URL/phases/")
          printf '%s' "$ARCHIVE_HTML" | grep -q 'Every phase'
          curl --fail --silent --show-error --location "$PUBLIC_URL/aegis-current.js" >/dev/null
          echo "✓ Archive and current-frontier bridge accessible"

          echo ""
          echo "=== Verification complete: public alias serves Phase 12 content ==="
