name: Phase 27 development detector pilot

on:
  pull_request:
    paths:
      - 'scripts/prepare_phase27_dev_augmentation.py'
      - 'scripts/train_phase27_dev_candidate.py'
      - 'tests/test_phase27_dev_augmentation.py'
      - 'docs/phase27_dev_detector_candidate.md'
      - '.github/workflows/phase27-dev-detector-pilot.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  development-only-comparison:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      YOLO_CONFIG_DIR: /tmp/Ultralytics
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install development ML stack
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]' py7zr
          python -m pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          python -m pip install ultralytics

      - name: Unit tests and untrusted-fixture guards
        run: pytest -q tests/test_phase27_dev_augmentation.py

      - name: Install official archive extractor
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y p7zip-full

      - name: Restore authenticated KIOS archive cache
        uses: actions/cache@v4
        with:
          path: .cache/phase25/airisim_dataset2.7z
          key: phase25-kios-archive-13682584-865515c2d8f5e9cd9b2ee1e1ec294270

      - name: Reconstruct SHA-verified KIOS split
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/phase27-kios"
          if test -f .cache/phase25/airisim_dataset2.7z; then
            cp .cache/phase25/airisim_dataset2.7z "$RUNNER_TEMP/phase27-kios/airisim_dataset2.7z"
          fi
          for attempt in 1 2 3; do
            if python scripts/download_kios_real_landing_dataset.py \
              --out "$RUNNER_TEMP/phase27-kios" --accept-download --extract; then
              break
            fi
            rm -f "$RUNNER_TEMP/phase27-kios/airisim_dataset2.7z"
            if test "$attempt" -eq 3; then
              exit 1
            fi
            sleep $((attempt * 5))
          done
          python scripts/prepare_kios_real_yolo_split.py \
            --dataset-root "$RUNNER_TEMP/phase27-kios/extracted" \
            --out "$RUNNER_TEMP/phase27-split"

      - name: Create train-only camera-stress images
        run: |
          python -m scripts.prepare_phase27_dev_augmentation \
            --split-root "$RUNNER_TEMP/phase27-split" \
            --out "$RUNNER_TEMP/phase27-aug" \
            --seed 20261013 --variants 2

      - name: Train baseline and candidate, compare only untouched development validation
        run: |
          python -m scripts.train_phase27_dev_candidate \
            --source-root "$RUNNER_TEMP/phase27-split" \
            --candidate-root "$RUNNER_TEMP/phase27-aug" \
            --out "$RUNNER_TEMP/phase27-comparison" \
            --initialization yolo11n.pt --epochs 2 --imgsz 320 \
            --batch 16 --seed 20261013 --device cpu

      - name: Archive descriptive pilot and authenticated development checkpoints
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: phase27-dev-only-model-pilot
          path: |
            ${{ runner.temp }}/phase27-aug/receipt.json
            ${{ runner.temp }}/phase27-comparison/comparison.json
            ${{ runner.temp }}/phase27-comparison/training/baseline/weights/best.pt
            ${{ runner.temp }}/phase27-comparison/training/candidate/weights/best.pt
            ${{ runner.temp }}/phase27-comparison/training/baseline/results.csv
            ${{ runner.temp }}/phase27-comparison/training/candidate/results.csv
          if-no-files-found: error
          retention-days: 30
