name: Phase 11 P14 partition freeze

on:
  push:
    branches: [phase11-p14-bounded-independent-rescue]
    paths:
      - .github/workflows/phase11-p14-partition.yml

permissions:
  contents: read

jobs:
  partition:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install project
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Verify preregistered P14 scientific head
        run: |
          git fetch --depth=1 origin e02bb0635a92af2e3701154e19ad218f0283cdb4
          git diff --exit-code e02bb0635a92af2e3701154e19ad218f0283cdb4 HEAD -- \
            scripts/run_phase11_p14_bounded_independent_rescue.py \
            tests/test_phase11_p14_bounded_independent_rescue.py \
            docs/phase11_p14_bounded_independent_rescue_preregistration.md \
            docs/phase11_p15_final_holdout_preregistration.md
      - name: Run P14 invariants
        run: |
          pytest -q \
            tests/test_phase11_p9_soft_update_direct_conformal.py \
            tests/test_phase11_p14_bounded_independent_rescue.py
      - name: Freeze fit and severity partition only
        run: |
          rm -rf results/phase11_p14_partition
          python scripts/run_phase11_p14_bounded_independent_rescue.py \
            --stage partition \
            --out results/phase11_p14_partition \
            --git-sha "${GITHUB_SHA}" | tee phase11-p14-partition.log
          test -f results/phase11_p14_partition/fit_frames.csv
          test -f results/phase11_p14_partition/partition_frames.csv
          test -f results/phase11_p14_partition/partition_freeze.json
          test ! -f results/phase11_p14_partition/calibration_frames.csv
          test ! -f results/phase11_p14_partition/transfer_result.json
          test ! -f results/phase11_p14_partition/validation_result.json
          test ! -e results/phase11_p15_holdout
      - name: Partition digests
        run: |
          sha256sum results/phase11_p14_partition/partition_freeze.json
          sha256sum results/phase11_p14_partition/manifest.json
          cat results/phase11_p14_partition/partition_freeze.json
      - uses: actions/upload-artifact@v4
        with:
          name: phase11-p14-partition-freeze
          path: |
            results/phase11_p14_partition/
            phase11-p14-partition.log
          if-no-files-found: error
          retention-days: 30
