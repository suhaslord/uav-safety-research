name: Phase 11 P14 seen transfer

on:
  push:
    branches: [phase11-p14-bounded-independent-rescue]
    paths:
      - .github/workflows/phase11-p14-transfer.yml

permissions:
  contents: read
  actions: read

jobs:
  transfer:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install project
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Verify frozen P14 scientific protocol unchanged
        run: |
          git fetch --depth=1 origin e02bb0635a92af2e3701154e19ad218f0283cdb4
          git diff --exit-code e02bb0635a92af2e3701154e19ad218f0283cdb4 HEAD -- \
            scripts/run_phase11_p14_bounded_independent_rescue.py \
            tests/test_phase11_p14_bounded_independent_rescue.py \
            docs/phase11_p14_bounded_independent_rescue_preregistration.md \
            docs/phase11_p15_final_holdout_preregistration.md
          pytest -q tests/test_phase11_p9_soft_update_direct_conformal.py tests/test_phase11_p14_bounded_independent_rescue.py
      - uses: actions/download-artifact@v4
        with:
          name: phase11-p14-candidate-freeze
          path: candidate_artifact
          github-token: ${{ github.token }}
          repository: suhaslord/uav-safety-research
          run-id: 31978605370
      - name: Verify exact frozen candidate digest
        run: |
          CANDIDATE="candidate_artifact/results/phase11_p14_freeze/candidate_freeze.json"
          test -f "$CANDIDATE"
          echo "9c58dcbb053dfd1e759e281e29346ae54acdadd83e5a8934a4296ee7ec3452fa  $CANDIDATE" | sha256sum -c -
      - name: Expose seen transfer exactly once
        run: |
          rm -rf results/phase11_p14_transfer
          python scripts/run_phase11_p14_bounded_independent_rescue.py \
            --stage transfer \
            --candidate candidate_artifact/results/phase11_p14_freeze/candidate_freeze.json \
            --out results/phase11_p14_transfer \
            --git-sha "${GITHUB_SHA}" | tee phase11-p14-transfer.log
          test -f results/phase11_p14_transfer/transfer_event_frames.csv
          test -f results/phase11_p14_transfer/transfer_natural_frames.csv
          test -f results/phase11_p14_transfer/transfer_result.json
          test -f results/phase11_p14_transfer/transfer_natural_diagnostic.json
          test ! -f results/phase11_p14_transfer/validation_result.json
          test ! -e results/phase11_p15_holdout
      - name: Transfer result digest and eligibility
        run: |
          sha256sum results/phase11_p14_transfer/transfer_result.json
          sha256sum results/phase11_p14_transfer/transfer_natural_diagnostic.json
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('results/phase11_p14_transfer/transfer_result.json').read_text())
          print('P14_TRANSFER_GATES='+json.dumps(r['gates'],sort_keys=True))
          print('P14_VALIDATION_ELIGIBLE='+str(bool(r['all_primary_gates_pass'])).lower())
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: phase11-p14-seen-transfer
          path: |
            results/phase11_p14_transfer/
            phase11-p14-transfer.log
          if-no-files-found: error
          retention-days: 30
