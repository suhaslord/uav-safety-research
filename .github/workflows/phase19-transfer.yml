name: Phase 19 distribution-wide residual advantage transfer

on:
  push:
    branches: [phase19/distribution-wide-residual-advantage]
    paths: [.github/workflows/phase19-transfer.yml]

permissions: { contents: read, actions: read }

env:
  P19_DEV_RUN: '34012185448'
  P19_DEV_SHA: 515e431aa0e91faa2bf204277fdcb9ec3defbdc3e0242e7f5c8cd4a53b81ddd6
  P19_DEV_SCI: 4fec27c6d789189bb7bb352bcf47089b4df2155c
  P12_RUN: '34004695243'
  P12_SHA: e2372ca597cdd983f098f1a45524c077798114c59a62bf9faccefd17b67a4991
  P14_RUN: '34010431456'
  P14_SHA: 0443d4e45a1966c77544c5c9965de8caec6e622c79ef8c2ce47aee82a3c95981
  P17_RUN: '34011621058'
  P17_SHA: 2ca52a418f5616e0e83ef84d0c9238ee429260cd4de7a553356b0c1bba44d8e0
  P18_RUN: '34012030160'
  P18_SHA: ad96ca1a5119fcd594a84fd72a04f8efcc377ba788383d90dda9ef7eecad4431
  P19_TRANSFER_SEED: '1919192'

jobs:
  transfer:
    runs-on: ubuntu-24.04
    steps:
      - name: Guard evidence exposure
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          D=$(gh api '/repos/${{ github.repository }}/actions/artifacts?name=phase19-development&per_page=100' --jq '[.artifacts[]|select(.expired==false)]|length')
          T=$(gh api '/repos/${{ github.repository }}/actions/artifacts?name=phase19-transfer&per_page=100' --jq '[.artifacts[]|select(.expired==false)]|length')
          test "$D" = 1; test "$T" = 0
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - name: Verify freeze
        run: |
          pip install -e ".[dev]"
          pytest -q tests/test_phase19_distribution_wide_residual_advantage.py
          CHANGED=$(git diff --name-only "$P19_DEV_SCI"..HEAD)
          BAD=$(printf '%s\n' "$CHANGED" | grep -Ev '^(docs/phase19_development_result\.md|\.github/workflows/phase19-transfer\.yml)$' || true)
          test -z "$BAD" || { echo "$BAD"; exit 1; }
          grep -q "$P19_DEV_SHA" docs/phase19_development_result.md
      - name: Recover dev
        uses: actions/download-artifact@v4
        with: { name: phase19-development, path: p19dev, github-token: '${{ github.token }}', repository: suhaslord/uav-safety-research, run-id: '${{ env.P19_DEV_RUN }}' }
      - name: Recover p12
        uses: actions/download-artifact@v4
        with: { name: phase12-development-v3, path: p12, github-token: '${{ github.token }}', repository: suhaslord/uav-safety-research, run-id: '${{ env.P12_RUN }}' }
      - name: Recover p14
        uses: actions/download-artifact@v4
        with: { name: phase14-bridge-candidate, path: p14, github-token: '${{ github.token }}', repository: suhaslord/uav-safety-research, run-id: '${{ env.P14_RUN }}' }
      - name: Recover p17 fit
        uses: actions/download-artifact@v4
        with: { name: phase17-fit-candidate, path: p17, github-token: '${{ github.token }}', repository: suhaslord/uav-safety-research, run-id: '${{ env.P17_RUN }}' }
      - name: Recover failed p18 protected
        uses: actions/download-artifact@v4
        with: { name: phase18-validation, path: p18, github-token: '${{ github.token }}', repository: suhaslord/uav-safety-research, run-id: '${{ env.P18_RUN }}' }
      - name: Verify identities
        run: |
          P19=$(find p19dev -path '*/results/phase19_development/dev_result.json' -print -quit)
          P12=$(find p12 -path '*/results/phase12_candidate_v3/candidate_freeze.json' -print -quit)
          P14=$(find p14 -path '*/results/phase14_fit/bridge_candidate.json' -print -quit)
          P17=$(find p17 -path '*/results/phase17_fit/fit_candidate.json' -print -quit)
          P18=$(find p18 -path '*/results/phase18_validation/validation_result.json' -print -quit)
          echo "$P19_DEV_SHA  $P19"|sha256sum -c -; echo "$P12_SHA  $P12"|sha256sum -c -; echo "$P14_SHA  $P14"|sha256sum -c -; echo "$P17_SHA  $P17"|sha256sum -c -; echo "$P18_SHA  $P18"|sha256sum -c -
          python - <<'PY'
          import json; from pathlib import Path
          assert json.loads(next(Path('p19dev').rglob('dev_result.json')).read_text())['phase19_pass'] is True
          assert json.loads(next(Path('p18').rglob('validation_result.json')).read_text())['phase18_pass'] is False
          PY
          echo "P12_FILE=$P12" >> $GITHUB_ENV; echo "P14_FILE=$P14" >> $GITHUB_ENV; echo "P17_FILE=$P17" >> $GITHUB_ENV; echo "P18_FILE=$P18" >> $GITHUB_ENV; echo "P19_SCI=$(git rev-parse HEAD)" >> $GITHUB_ENV
      - name: Expose transfer once
        run: |
          python scripts/run_phase19_distribution_wide_residual_advantage.py --stage transfer --phase12-candidate "$P12_FILE" --phase14-bridge "$P14_FILE" --phase17-fit-candidate "$P17_FILE" --phase18-validation-result "$P18_FILE" --out results/phase19_transfer --git-sha "$P19_SCI" 2>&1 | tee phase19-transfer.log
      - name: Verify result
        run: |
          python - <<'PY'
          import json,os; from pathlib import Path
          r=json.loads(Path('results/phase19_transfer/transfer_result.json').read_text()); assert r['evaluated_seed_seen_after_run']==int(os.environ['P19_TRANSFER_SEED']); assert r['families']==list(range(2049,2073)); assert r['phase18_failure_preserved'] and r['q90_is_descriptive_only'] and r['no_refit']; print('P19_TRANSFER_PASS='+str(r['phase19_pass']).lower()); print(json.dumps(r['gates'],indent=2)); print(json.dumps(r['contexts'],indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase19-transfer
          path: |
            results/phase19_transfer/
            phase19-transfer.log
          if-no-files-found: error
          retention-days: 90
