name: Phase 6D Candidate Parallel Development

on:
  push:
    paths:
      - '.github/workflows/phase6d-candidate-parallel.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  candidate:
    strategy:
      fail-fast: false
      matrix:
        condition: [clean, blur, low_light, occlusion, mixed]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run Phase 6D candidate condition
        run: |
          python scripts/run_phase6d_candidate.py \
            --condition "${{ matrix.condition }}" \
            --episodes 30 \
            --seed 626262 \
            --calibration-seed 616161 \
            --out "results/phase6d_candidate/${{ matrix.condition }}"
      - name: Upload candidate condition artifact
        uses: actions/upload-artifact@v4
        with:
          name: phase6d-candidate-${{ matrix.condition }}
          path: results/phase6d_candidate/${{ matrix.condition }}
          if-no-files-found: error
          retention-days: 45
