name: AegisLand mobile UI sweep 504

on:
  push:
    branches:
      - aegis-mobile-ui-sweep
      - aegis-tesla-liquid-glass-repair
    paths:
      - 'deploy/vercel/**'
      - 'dashboard/**'
      - '.github/qa/mobile-ui-sweep-504.mjs'
      - '.github/qa/mobile-menu-smoke.mjs'
      - '.github/qa/local-vercel-server.mjs'
      - '.github/workflows/mobile-ui-sweep-504.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mobile-grade:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Fetch licensed editorial media
        run: node deploy/vercel/fetch-editorial-media.mjs

      - name: Install mobile QA dependencies
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0 sharp@0.34.3
          npx playwright install --with-deps chromium

      - name: Start local Vercel mirror
        shell: bash
        run: |
          node .github/qa/local-vercel-server.mjs >/tmp/aegis-mobile-local.log 2>&1 &
          echo $! >/tmp/aegis-mobile-local.pid
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173/ >/dev/null; then
              curl --fail --silent --head http://127.0.0.1:4173/final-convergence.css | grep -qi 'content-type: text/css'
              echo '✓ local mirror ready'
              exit 0
            fi
            sleep 1
          done
          cat /tmp/aegis-mobile-local.log
          exit 1

      - name: Capture and analyze 504+ mobile screenshots
        env:
          QA_BASE_URL: http://127.0.0.1:4173
        run: node .github/qa/mobile-ui-sweep-504.mjs

      - name: Upload mobile QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aegisland-mobile-ui-sweep-504
          path: qa-artifacts/mobile-ui-sweep-504/
          if-no-files-found: warn
          retention-days: 14
