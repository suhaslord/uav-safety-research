name: Phase 15 recoverability feasibility frontier freeze

on:
  push:
    branches: [phase15/recoverability-feasibility-frontier]
    paths:
      - .github/workflows/phase15-freeze.yml

permissions:
  contents: read
  actions: read

env:
  PHASE14_FIT_RUN_ID: '34010431456'
  PHASE14_BRIDGE_CANDIDATE_SHA256: 0443d4e45a1966c77544c5c9965de8caec6e622c79ef8c2ce47aee82a3c95981

jobs:
  freeze:
    runs-on: ubuntu-24.04
    steps:
      - name: Refuse second Phase 15 frontier freeze
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          COUNT=$(gh api \
            -H 'Accept: application/vnd.github+json' \
            '/repos/${{ github.repository }}/actions/artifacts?name=phase15-frontier-candidate&per_page=100' \
            --jq '[.artifacts[] | select(.expired == false)] | length')
          test "$COUNT" = "0" || { echo "Phase 15 frontier candidate already exists; refusing refreeze"; exit 1; }

      - name: Check out preregistered Phase 15 scientific head
        uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Verify Phase 15 implementation before freeze
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          python -m compileall -q \
            scripts/run_phase15_recoverability_feasibility_frontier.py \
            scripts/run_phase14_uncertainty_recoverability_bridge.py \
            scripts/run_phase13_external_validity_gauntlet.py
          pytest -q \
            tests/test_phase14_uncertainty_recoverability_bridge.py \
            tests/test_phase15_recoverability_feasibility_frontier.py
          test -f docs/phase15_preregistration.md
          grep -q '1515151' docs/phase15_preregistration.md
          grep -q 'recoverability feasibility frontier' docs/phase15_preregistration.md
          grep -q 'Phase 14 remains immutable and failed' docs/phase15_preregistration.md

      - name: Recover already-seen Phase 14 identification artifact
        uses: actions/download-artifact@v4
        with:
          name: phase14-bridge-candidate
          path: seen_phase14_fit_artifact
          github-token: ${{ github.token }}
          repository: suhaslord/uav-safety-research
          run-id: ${{ env.PHASE14_FIT_RUN_ID }}

      - name: Verify source identity and freeze scientific SHA
        run: |
          BRIDGE=$(find seen_phase14_fit_artifact -path '*/results/phase14_fit/bridge_candidate.json' -print -quit)
          TRANSITIONS=$(find seen_phase14_fit_artifact -path '*/results/phase14_fit/fit_transitions.csv' -print -quit)
          test -n "$BRIDGE"
          test -n "$TRANSITIONS"
          echo "$PHASE14_BRIDGE_CANDIDATE_SHA256  $BRIDGE" | sha256sum -c -
          echo "PHASE14_BRIDGE=$BRIDGE" >> "$GITHUB_ENV"
          echo "PHASE14_FIT_TRANSITIONS=$TRANSITIONS" >> "$GITHUB_ENV"
          echo "PHASE15_SCIENTIFIC_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Freeze Phase 15 frontier from already-seen fit evidence
        run: |
          rm -rf results/phase15_frontier
          python scripts/run_phase15_recoverability_feasibility_frontier.py \
            --stage freeze \
            --phase14-bridge "$PHASE14_BRIDGE" \
            --phase14-fit-transitions "$PHASE14_FIT_TRANSITIONS" \
            --out results/phase15_frontier \
            --git-sha "$PHASE15_SCIENTIFIC_SHA" 2>&1 | tee phase15-freeze.log
          test -f results/phase15_frontier/frontier_candidate.json

      - name: Verify frozen frontier contract
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          c = json.loads(Path('results/phase15_frontier/frontier_candidate.json').read_text())
          assert c['schema'] == 'aegisland.phase15.recoverability-feasibility.frontier-candidate.v1'
          assert c['scientific_git_sha'] == os.environ['PHASE15_SCIENTIFIC_SHA']
          assert c['source_phase14_bridge_sha256'] == os.environ['PHASE14_BRIDGE_CANDIDATE_SHA256']
          assert c['reference_half_width_m'] == {'lateral': 0.30, 'altitude': 0.85}
          assert c['quantiles'] == [0.90, 0.95, 0.975, 0.99]
          for axis in ('lateral', 'altitude'):
              a = float(c['axes'][axis]['a'])
              assert abs(a) < 1.0
              r = c['axes'][axis]['minimal_rpi_half_width_m']
              vals = [float(r[k]) for k in ('0.9', '0.95', '0.975', '0.99')]
              assert vals == sorted(vals)
              assert vals[0] > float(c['axes'][axis]['reference_half_width_m'])
          assert c['simulation_only'] is True
          assert c['safety_acceptance'] is False
          assert c['controller_tuning_allowed'] is False
          print('PHASE15_FRONTIER_FROZEN=true')
          print(json.dumps(c['axes'], indent=2, sort_keys=True))
          PY

      - name: Upload frozen Phase 15 frontier candidate
        uses: actions/upload-artifact@v4
        with:
          name: phase15-frontier-candidate
          path: |
            results/phase15_frontier/
            phase15-freeze.log
          if-no-files-found: error
          retention-days: 90
