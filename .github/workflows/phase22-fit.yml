name: Phase 22 frozen additive context transfer fit

on:
  push:
    branches: [phase22/frozen-additive-context-transfer]
    paths:
      - .github/workflows/phase22-fit.yml

permissions:
  contents: read
  actions: read

env:
  P12_RUN: '34004695243'
  P12_SHA: e2372ca597cdd983f098f1a45524c077798114c59a62bf9faccefd17b67a4991
  P14_RUN: '34010431456'
  P14_SHA: 0443d4e45a1966c77544c5c9965de8caec6e622c79ef8c2ce47aee82a3c95981
  P17_FIT_RUN: '34011621058'
  P17_FIT_SHA: 2ca52a418f5616e0e83ef84d0c9238ee429260cd4de7a553356b0c1bba44d8e0
  P21_FINAL_RUN: '34015012804'
  P21_FINAL_SHA: bc85a746cf1b770fb4119feb3979789975ed5201065d94de47c6dcc3a051d9ee
  P22_FIT_SEED: '2222220'

jobs:
  fit:
    runs-on: ubuntu-24.04
    steps:
      - name: Refuse second Phase 22 fit exposure
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          C=$(gh api -H 'Accept: application/vnd.github+json' '/repos/${{ github.repository }}/actions/artifacts?name=phase22-fit&per_page=100' --jq '[.artifacts[] | select(.expired == false)] | length')
          test "$C" = "0" || { echo "Phase 22 fit artifact already exists"; exit 1; }

      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }

      - name: Verify implementation before evidence
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          python -m compileall -q scripts/run_phase22_frozen_additive_context_transfer.py
          pytest -q tests/test_phase13c_pandas_writeable_array_maintenance.py tests/test_phase20_shapley_context_attenuation.py tests/test_phase21_orthogonal_context_spectrum.py tests/test_phase22_frozen_additive_context_transfer.py
          grep -q '2222220' docs/phase22_preregistration.md
          grep -q 'R2_RMSE >= 0.65' docs/phase22_preregistration.md
          grep -q 'MAEpred_RMSE <= 0.025' docs/phase22_preregistration.md
          grep -q 'stable-sign' docs/phase22_preregistration.md
          grep -q 'Every role may be exposed exactly once' docs/phase22_preregistration.md
          grep -q 'q90 absolute residual remains descriptive only' docs/phase22_preregistration.md

      - name: Recover Phase 12
        uses: actions/download-artifact@v4
        with: { name: phase12-development-v3, path: p12, github-token: '${{ github.token }}', repository: suhaslord/uav-safety-research, run-id: '${{ env.P12_RUN }}' }

      - name: Recover Phase 14
        uses: actions/download-artifact@v4
        with: { name: phase14-bridge-candidate, path: p14, github-token: '${{ github.token }}', repository: suhaslord/uav-safety-research, run-id: '${{ env.P14_RUN }}' }

      - name: Recover Phase 17 fit
        uses: actions/download-artifact@v4
        with: { name: phase17-fit-candidate, path: p17fit, github-token: '${{ github.token }}', repository: suhaslord/uav-safety-research, run-id: '${{ env.P17_FIT_RUN }}' }

      - name: Recover exact Phase 21 final result
        uses: actions/download-artifact@v4
        with: { name: phase21-final, path: p21f, github-token: '${{ github.token }}', repository: suhaslord/uav-safety-research, run-id: '${{ env.P21_FINAL_RUN }}' }

      - name: Verify exact identities and freeze scientific head
        run: |
          P12=$(find p12 -path '*/results/phase12_candidate_v3/candidate_freeze.json' -print -quit)
          P14=$(find p14 -path '*/results/phase14_fit/bridge_candidate.json' -print -quit)
          P17=$(find p17fit -path '*/results/phase17_fit/fit_candidate.json' -print -quit)
          P21=$(find p21f -path '*/results/phase21_final/final_result.json' -print -quit)
          test -n "$P12"; test -n "$P14"; test -n "$P17"; test -n "$P21"
          echo "$P12_SHA  $P12" | sha256sum -c -
          echo "$P14_SHA  $P14" | sha256sum -c -
          echo "$P17_FIT_SHA  $P17" | sha256sum -c -
          echo "$P21_FINAL_SHA  $P21" | sha256sum -c -
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(next(Path('p21f').rglob('final_result.json')).read_text())
          assert r['phase21_pass'] is True
          assert r['phase20_final_pass_preserved'] is True
          assert r['phase19_final_pass_preserved_via_phase20'] is True
          assert r['phase18_failure_preserved_via_phase20'] is True
          assert r['q90_is_descriptive_only'] is True
          assert r['no_refit'] is True and r['zero_adaptation'] is True
          assert r['factorial_context_count'] == 32
          PY
          echo "P12_FILE=$P12" >> "$GITHUB_ENV"
          echo "P14_FILE=$P14" >> "$GITHUB_ENV"
          echo "P17_FILE=$P17" >> "$GITHUB_ENV"
          echo "P21_FILE=$P21" >> "$GITHUB_ENV"
          echo "P22_SCI=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Expose Phase 22 fit evidence exactly once
        run: |
          rm -rf results/phase22_fit
          python scripts/run_phase22_frozen_additive_context_transfer.py --stage fit --phase12-candidate "$P12_FILE" --phase14-bridge "$P14_FILE" --phase17-fit-candidate "$P17_FILE" --phase21-final-result "$P21_FILE" --out results/phase22_fit --git-sha "$P22_SCI" 2>&1 | tee phase22-fit.log
          test -f results/phase22_fit/fit_result.json
          test -f results/phase22_fit/fit_candidate.json

      - name: Verify permanent fit boundary and record verdict
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          r=json.loads(Path('results/phase22_fit/fit_result.json').read_text())
          c=json.loads(Path('results/phase22_fit/fit_candidate.json').read_text())
          assert r['schema']=='aegisland.phase22.frozen-additive-context-transfer.fit-result.v1'
          assert c['schema']=='aegisland.phase22.frozen-additive-context-transfer.fit-candidate.v1'
          assert r['evaluated_seed_seen_after_run']==int(os.environ['P22_FIT_SEED'])
          assert r['families']==list(range(2313,2337))
          assert r['scientific_git_sha']==os.environ['P22_SCI']
          assert r['factorial_context_count']==32 and len(r['contexts'])==32
          assert len(r['gates'])==8
          assert c['factor_order']==['edge','oblique','dim','blur_noise','low_contrast']
          assert c['interaction_terms_retained'] is False
          assert c['q90_is_descriptive_only'] is True and c['no_post_fit_refit'] is True
          assert c['simulation_only'] is True and c['safety_acceptance'] is False and c['controller_tuning_allowed'] is False
          print('PHASE22_FIT_PASS='+str(bool(r['phase22_fit_pass'])).lower())
          print('PHASE22_FIT_ELIGIBLE='+str(bool(c['fit_eligible'])).lower())
          print(json.dumps(r['gates'],indent=2,sort_keys=True))
          print(json.dumps(c['models'],indent=2,sort_keys=True))
          PY
          sha256sum results/phase22_fit/fit_result.json results/phase22_fit/fit_candidate.json

      - name: Upload permanent Phase 22 fit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase22-fit
          path: |
            results/phase22_fit/
            phase22-fit.log
          if-no-files-found: error
          retention-days: 90
