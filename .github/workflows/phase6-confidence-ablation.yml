name: Phase 6 Confidence Ablation

on:
  push:
    paths:
      - '.github/workflows/phase6-confidence-ablation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  confidence-ablation:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Unit tests
        run: pytest -q
      - name: Compare scalar and contextual confidence
        run: |
          python scripts/run_phase6_confidence_ablation.py \
            --sequences 16 \
            --frames 100 \
            --seed 646464 \
            --calibration-seed 616161 \
            --calibration-samples 220 \
            --out results/phase6_confidence_ablation
      - name: Upload confidence ablation
        uses: actions/upload-artifact@v4
        with:
          name: phase6-confidence-ablation
          path: results/phase6_confidence_ablation
          if-no-files-found: error
          retention-days: 30
