name: Phase 13 zero-shot Thirteen-Domain Gauntlet development

on:
  push:
    branches: [phase13/external-validity-domain-shift]
    paths:
      - .github/workflows/phase13-development.yml

permissions:
  contents: read
  actions: read

env:
  FROZEN_PHASE12_DEV_RUN_ID: '34004695243'
  FROZEN_PHASE12_CANDIDATE_SHA256: e2372ca597cdd983f098f1a45524c077798114c59a62bf9faccefd17b67a4991

jobs:
  development:
    runs-on: ubuntu-24.04
    steps:
      - name: Refuse a second Phase 13 development exposure
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          COUNT=$(gh api \
            -H 'Accept: application/vnd.github+json' \
            '/repos/${{ github.repository }}/actions/artifacts?name=phase13-development&per_page=100' \
            --jq '[.artifacts[] | select(.expired == false)] | length')
          test "$COUNT" = "0" || { echo "Phase 13 development artifact already exists; refusing a second evidence exposure"; exit 1; }

      - name: Check out preregistered Phase 13 scientific head
        uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install and verify scientific invariants before evidence generation
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          python -m compileall -q \
            scripts/run_phase13_external_validity_gauntlet.py \
            scripts/run_phase12_adaptive_normalized_conformal.py \
            scripts/run_phase12_adaptive_normalized_conformal_v2.py \
            scripts/run_phase12_adaptive_normalized_conformal_v3.py
          pytest -q \
            tests/test_phase11_p9_soft_update_direct_conformal.py \
            tests/test_phase11_p14_bounded_independent_rescue.py \
            tests/test_phase11_p14r_robust_group_envelope.py \
            tests/test_phase12_adaptive_normalized_conformal.py \
            tests/test_phase12_adaptive_normalized_conformal_v2.py \
            tests/test_phase12_adaptive_normalized_conformal_v3.py \
            tests/test_phase13_external_validity_gauntlet.py

      - name: Recover exact frozen Phase 12 candidate
        uses: actions/download-artifact@v4
        with:
          name: phase12-development-v3
          path: frozen_phase12_candidate_artifact
          github-token: ${{ github.token }}
          repository: suhaslord/uav-safety-research
          run-id: ${{ env.FROZEN_PHASE12_DEV_RUN_ID }}

      - name: Verify predecessor candidate identity
        run: |
          CANDIDATE=$(find frozen_phase12_candidate_artifact -path '*/results/phase12_candidate_v3/candidate_freeze.json' -print -quit)
          test -n "$CANDIDATE"
          echo "$FROZEN_PHASE12_CANDIDATE_SHA256  $CANDIDATE" | sha256sum -c -
          echo "CANDIDATE=$CANDIDATE" >> "$GITHUB_ENV"
          echo "PHASE13_SCIENTIFIC_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Expose Phase 13 development evidence exactly once
        run: |
          rm -rf results/phase13_development
          python scripts/run_phase13_external_validity_gauntlet.py \
            --stage dev \
            --candidate "$CANDIDATE" \
            --out results/phase13_development \
            --git-sha "$PHASE13_SCIENTIFIC_SHA" | tee phase13-development.log
          test -f results/phase13_development/dev_result.json
          test -f results/phase13_development/manifest.json

      - name: Verify result boundary and record scientific verdict
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          r = json.loads(Path('results/phase13_development/dev_result.json').read_text())
          assert r['schema'] == 'aegisland.phase13.external-validity-gauntlet.dev-result.v1'
          assert r['domain_count'] == 13
          assert len(r['domain_names']) == 13
          assert r['evaluated_seed_seen_after_run'] == 946946
          assert r['frozen_phase12_candidate_sha256'] == os.environ['FROZEN_PHASE12_CANDIDATE_SHA256']
          assert r['scientific_git_sha'] == os.environ['PHASE13_SCIENTIFIC_SHA']
          assert r['zero_shot'] is True
          assert r['adaptation_performed'] is False
          assert r['recalibration_performed'] is False
          assert r['simulation_only'] is True
          assert r['safety_acceptance'] is False
          assert r['controller_tuning_allowed'] is False
          print('PHASE13_DEVELOPMENT_PERMANENTLY_SEEN=true')
          print('PHASE13_DEVELOPMENT_PASS=' + str(bool(r['phase13_pass'])).lower())
          print(json.dumps(r['phase13_gates'], indent=2, sort_keys=True))
          PY

      - name: Upload permanent Phase 13 development evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase13-development
          path: |
            results/phase13_development/
            phase13-development.log
          if-no-files-found: error
          retention-days: 180
