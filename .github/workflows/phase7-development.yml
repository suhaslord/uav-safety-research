name: Phase 7 External Validity Development

on:
  push:
    paths:
      - '.github/workflows/phase7-development.yml'

jobs:
  development:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run Phase 7 factorial development benchmark
        run: |
          python scripts/run_phase7_external_validity.py \
            --episodes 5 \
            --seed 979797 \
            --calibration-seed 616161 \
            --temporal-calibration-samples 180 \
            --component-calibration-samples 280 \
            --conditions clean low_light occlusion mixed \
            --faults independent reference_drift shared_lateral_bias shared_dropout latency_burst \
            --plants legacy phase7 \
            --out results/phase7_factorial_development
          printf '%s\n' "$GITHUB_SHA" > results/phase7_factorial_development/git_sha.txt
      - name: Upload Phase 7 development artifact
        uses: actions/upload-artifact@v4
        with:
          name: phase7-external-validity-factorial-development
          path: results/phase7_factorial_development
          retention-days: 30
