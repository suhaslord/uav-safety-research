name: Phase 7 External Validity Development

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/phase7-development.yml'

jobs:
  development:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run audited Phase 7 factorial development benchmark
        run: |
          python scripts/run_phase7_external_validity.py \
            --episodes 5 \
            --seed 979797 \
            --calibration-seed 616161 \
            --temporal-calibration-samples 180 \
            --component-calibration-samples 280 \
            --conditions clean low_light occlusion mixed \
            --faults independent reference_drift shared_lateral_bias shared_dropout latency_burst \
            --plants legacy phase7 \
            --out results/phase7_factorial_development
      - name: Verify result-bundle provenance
        run: |
          python scripts/validate_result_manifest.py results/phase7_factorial_development/result_manifest.json
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          out = Path('results/phase7_factorial_development')
          bundle = json.loads((out / 'dashboard_bundle.json').read_text(encoding='utf-8'))
          metadata = json.loads((out / 'run_metadata.json').read_text(encoding='utf-8'))
          recorded = (out / 'git_sha.txt').read_text(encoding='utf-8').strip()
          expected = os.environ['GITHUB_SHA']
          assert recorded == expected
          assert metadata['git_sha'] == expected
          assert bundle['metadata']['git_sha'] == expected
          assert bundle['schema'] == 'aegisland.phase7.dashboard-bundle.v1'
          print(f'Provenance verified for {expected}')
          PY
      - name: Upload Phase 7 development artifact
        uses: actions/upload-artifact@v4
        with:
          name: phase7-external-validity-factorial-development
          path: results/phase7_factorial_development
          retention-days: 30
