name: Phase 6 Altitude Response Benchmark

on:
  push:
    paths:
      - '.github/workflows/phase6-altitude-response.yml'
      - 'scripts/benchmark_phase6_altitude_response.py'
      - 'src/uav_safety/selective_confidence_v2.py'
      - 'src/uav_safety/image_temporal.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  altitude-response:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run perception-only altitude response benchmark
        run: |
          python scripts/benchmark_phase6_altitude_response.py \
            --samples 40 \
            --seed 687431 \
            --calibration-seed 616161 \
            --out results/phase6_altitude_response
      - name: Upload altitude response artifact
        uses: actions/upload-artifact@v4
        with:
          name: phase6-altitude-response
          path: results/phase6_altitude_response
          if-no-files-found: error
          retention-days: 45
