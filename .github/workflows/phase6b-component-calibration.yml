name: Phase 6B Component Calibration

on:
  push:
    paths:
      - '.github/workflows/phase6b-component-calibration.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  component-calibration:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Unit tests
        run: pytest -q
      - name: Run Phase 6B full-domain component calibration benchmark
        run: |
          python scripts/run_phase6_component_calibration.py \
            --sequences 20 \
            --frames 100 \
            --seed 656565 \
            --calibration-seed 616161 \
            --calibration-samples 280 \
            --out results/phase6b_component_calibration
      - name: Upload component calibration artifact
        uses: actions/upload-artifact@v4
        with:
          name: phase6b-component-calibration-full-domain
          path: results/phase6b_component_calibration
          if-no-files-found: error
          retention-days: 30
