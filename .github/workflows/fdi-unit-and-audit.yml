name: FDI fast regression tests

on:
  pull_request:
    branches: [main]
    paths:
      - "experiments/ornik_fdi_webots/**"
      - "scripts/audit_fdi_h1_artifact.py"
      - "tests/test_fdi_artifact_audit.py"
      - ".github/workflows/fdi-unit-and-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

# Multiple small commits can arrive while earlier checks are still queued.
# Keep only the most recent verification for each PR/branch.
concurrency:
  group: fdi-fast-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  frozen-detector-and-audit-unit-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate syntax before unit tests
        run: |
          set -euo pipefail
          python -m compileall -q experiments/ornik_fdi_webots scripts/audit_fdi_h1_artifact.py tests/test_fdi_artifact_audit.py
      - name: Run frozen-detector and synthetic robustness tests
        run: |
          set -euo pipefail
          python -m unittest discover -s experiments/ornik_fdi_webots -p 'test_fdi_*.py' -v
      - name: Run independent audit regression tests
        run: python -m unittest discover -s tests -p 'test_fdi_artifact_audit.py' -v
