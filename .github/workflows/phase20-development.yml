name: Phase 20 Shapley context attenuation development

on:
  push:
    branches: [phase20/shapley-context-attenuation]
    paths:
      - .github/workflows/phase20-development.yml

permissions:
  contents: read
  actions: read

env:
  P12_RUN: '34004695243'
  P12_SHA: e2372ca597cdd983f098f1a45524c077798114c59a62bf9faccefd17b67a4991
  P14_RUN: '34010431456'
  P14_SHA: 0443d4e45a1966c77544c5c9965de8caec6e622c79ef8c2ce47aee82a3c95981
  P17_FIT_RUN: '34011621058'
  P17_FIT_SHA: 2ca52a418f5616e0e83ef84d0c9238ee429260cd4de7a553356b0c1bba44d8e0
  P19_FINAL_RUN: '34012403543'
  P19_FINAL_SHA: 8c23b9b9c8c9fb2f9146bf739e52074f8709d2fe9a81c794e64fb43f360acebf
  P20_DEV_SEED: '2020201'

jobs:
  development:
    runs-on: ubuntu-24.04
    steps:
      - name: Refuse second Phase 20 development exposure
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          C=$(gh api -H 'Accept: application/vnd.github+json' '/repos/${{ github.repository }}/actions/artifacts?name=phase20-development&per_page=100' --jq '[.artifacts[] | select(.expired == false)] | length')
          test "$C" = "0" || { echo "Phase 20 development artifact already exists"; exit 1; }

      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }

      - name: Verify implementation before evidence
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          python -m compileall -q scripts/run_phase20_shapley_context_attenuation.py
          pytest -q tests/test_phase17_context_conditional_coefficient_mismatch.py tests/test_phase20_shapley_context_attenuation.py
          grep -q 'exactly `2^5 = 32` contexts' docs/phase20_preregistration.md
          grep -q 'No modifier is preregistered as the winner' docs/phase20_preregistration.md
          grep -q '2020201' docs/phase20_preregistration.md
          grep -q 'q90 absolute residual is retained as descriptive context only' docs/phase20_preregistration.md

      - name: Recover Phase 12
        uses: actions/download-artifact@v4
        with: { name: phase12-development-v3, path: p12, github-token: '${{ github.token }}', repository: suhaslord/uav-safety-research, run-id: '${{ env.P12_RUN }}' }

      - name: Recover Phase 14
        uses: actions/download-artifact@v4
        with: { name: phase14-bridge-candidate, path: p14, github-token: '${{ github.token }}', repository: suhaslord/uav-safety-research, run-id: '${{ env.P14_RUN }}' }

      - name: Recover Phase 17 fit
        uses: actions/download-artifact@v4
        with: { name: phase17-fit-candidate, path: p17fit, github-token: '${{ github.token }}', repository: suhaslord/uav-safety-research, run-id: '${{ env.P17_FIT_RUN }}' }

      - name: Recover exact Phase 19 final result
        uses: actions/download-artifact@v4
        with: { name: phase19-final, path: p19f, github-token: '${{ github.token }}', repository: suhaslord/uav-safety-research, run-id: '${{ env.P19_FINAL_RUN }}' }

      - name: Verify exact identities and freeze head
        run: |
          P12=$(find p12 -path '*/results/phase12_candidate_v3/candidate_freeze.json' -print -quit)
          P14=$(find p14 -path '*/results/phase14_fit/bridge_candidate.json' -print -quit)
          P17=$(find p17fit -path '*/results/phase17_fit/fit_candidate.json' -print -quit)
          P19=$(find p19f -path '*/results/phase19_final/final_result.json' -print -quit)
          test -n "$P12"; test -n "$P14"; test -n "$P17"; test -n "$P19"
          echo "$P12_SHA  $P12" | sha256sum -c -
          echo "$P14_SHA  $P14" | sha256sum -c -
          echo "$P17_FIT_SHA  $P17" | sha256sum -c -
          echo "$P19_FINAL_SHA  $P19" | sha256sum -c -
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(next(Path('p19f').rglob('final_result.json')).read_text())
          assert r['phase19_pass'] is True
          assert r['phase18_failure_preserved'] is True
          assert r['q90_is_descriptive_only'] is True
          assert r['no_refit'] is True and r['zero_adaptation'] is True
          PY
          echo "P12_FILE=$P12" >> "$GITHUB_ENV"
          echo "P14_FILE=$P14" >> "$GITHUB_ENV"
          echo "P17_FILE=$P17" >> "$GITHUB_ENV"
          echo "P19_FILE=$P19" >> "$GITHUB_ENV"
          echo "P20_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Expose Phase 20 development evidence exactly once
        run: |
          rm -rf results/phase20_development
          python scripts/run_phase20_shapley_context_attenuation.py --stage dev --phase12-candidate "$P12_FILE" --phase14-bridge "$P14_FILE" --phase17-fit-candidate "$P17_FILE" --phase19-final-result "$P19_FILE" --out results/phase20_development --git-sha "$P20_SHA" 2>&1 | tee phase20-development.log
          test -f results/phase20_development/dev_result.json

      - name: Verify permanent development boundary and record verdict
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          r=json.loads(Path('results/phase20_development/dev_result.json').read_text())
          assert r['schema']=='aegisland.phase20.shapley-context-attenuation.dev-result.v1'
          assert r['evaluated_seed_seen_after_run']==int(os.environ['P20_DEV_SEED'])
          assert r['families']==list(range(2121,2145))
          assert r['scientific_git_sha']==os.environ['P20_SHA']
          assert r['phase19_final_pass_preserved'] is True
          assert r['phase18_failure_preserved_via_phase19'] is True
          assert r['factorial_context_count']==32 and len(r['contexts'])==32
          assert r['q90_is_descriptive_only'] is True
          assert r['no_refit'] is True and r['zero_adaptation'] is True
          assert r['simulation_only'] is True and r['safety_acceptance'] is False and r['controller_tuning_allowed'] is False
          assert len(r['gates'])==10
          print('PHASE20_DEV_PASS='+str(bool(r['phase20_pass'])).lower())
          print(json.dumps(r['gates'],indent=2,sort_keys=True))
          print(json.dumps(r['rmse_shapley_attenuation'],indent=2,sort_keys=True))
          print(json.dumps(r['mae_shapley_attenuation'],indent=2,sort_keys=True))
          PY

      - name: Upload permanent Phase 20 development evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase20-development
          path: |
            results/phase20_development/
            phase20-development.log
          if-no-files-found: error
          retention-days: 90
