name: Phase 6D Development Simulation

on:
  push:
    paths:
      - '.github/workflows/phase6d-development.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  development-simulation:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Full test suite
        run: pytest -q
      - name: Run paired synthetic Phase 6D development matrix
        run: |
          python scripts/run_phase6d_development.py \
            --episodes 30 \
            --seed 626262 \
            --calibration-seed 616161 \
            --out results/phase6d_development
      - name: Decompose simulated touchdown failures
        run: python scripts/analyze_phase6_failures.py --results results/phase6d_development
      - name: Upload Phase 6D development artifact
        uses: actions/upload-artifact@v4
        with:
          name: phase6d-development-simulation
          path: results/phase6d_development
          if-no-files-found: error
          retention-days: 45
