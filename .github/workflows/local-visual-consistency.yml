name: Local visual consistency QA

on:
  push:
    branches:
      - main
      - 'fix/**'
      - 'chatgpt/**'
    paths:
      - 'deploy/vercel/**'
      - 'dashboard/aegis-current.js'
      - 'dashboard/phase-taxonomy.js'
      - 'dashboard/phase-personalization.css'
      - 'dashboard/phase-personalization.js'
      - 'dashboard/phase-visuals.js'
      - 'dashboard/phase-editorial-media.css'
      - 'dashboard/phase-editorial-media.js'
      - 'dashboard/phases/**'
      - '.github/qa/local-vercel-server.mjs'
      - '.github/qa/visual-consistency-smoke.mjs'
      - '.github/qa/editorial-media-smoke.mjs'
      - '.github/qa/exhaustive-visual-audit.mjs'
      - '.github/qa/capture-corrected-screenshots.mjs'
      - '.github/workflows/local-visual-consistency.yml'
  pull_request:
    paths:
      - 'deploy/vercel/**'
      - 'dashboard/aegis-current.js'
      - 'dashboard/phase-taxonomy.js'
      - 'dashboard/phase-personalization.css'
      - 'dashboard/phase-personalization.js'
      - 'dashboard/phase-visuals.js'
      - 'dashboard/phase-editorial-media.css'
      - 'dashboard/phase-editorial-media.js'
      - 'dashboard/phases/**'
      - '.github/qa/local-vercel-server.mjs'
      - '.github/qa/visual-consistency-smoke.mjs'
      - '.github/qa/editorial-media-smoke.mjs'
      - '.github/qa/exhaustive-visual-audit.mjs'
      - '.github/qa/capture-corrected-screenshots.mjs'
      - '.github/workflows/local-visual-consistency.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  visual-consistency:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup image reconstruction runtime
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/cache@v4
        with:
          path: .cache/phase25/airisim_dataset2.7z
          key: phase25-kios-archive-13682584-865515c2d8f5e9cd9b2ee1e1ec294270

      - name: Install pinned image reconstruction tools
        run: python -m pip install py7zr==1.1.3 numpy==2.3.5 pandas==2.2.3 Pillow==12.3.0

      - name: Build verified Failure Atlas image set
        run: |
          python scripts/download_kios_real_landing_dataset.py --out .cache/phase25 --accept-download
          python scripts/build_phase25_atlas_images.py \
            --archive .cache/phase25/airisim_dataset2.7z \
            --work .cache/phase25/rebuild \
            --out deploy/vercel/media/phase25

      - name: Fetch licensed editorial media
        run: node deploy/vercel/fetch-editorial-media.mjs

      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Start local Vercel-equivalent bundle
        run: |
          node .github/qa/local-vercel-server.mjs > /tmp/aegis-local-server.log 2>&1 &
          echo $! > /tmp/aegis-local-server.pid
          for i in {1..30}; do
            curl -fsS http://127.0.0.1:4173/ >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/aegis-local-server.log
          exit 1

      - name: Run visual consistency smoke
        env:
          QA_BASE_URL: http://127.0.0.1:4173
        run: node .github/qa/visual-consistency-smoke.mjs

      - name: Run editorial media smoke
        env:
          QA_BASE_URL: http://127.0.0.1:4173
        run: node .github/qa/editorial-media-smoke.mjs

      - name: Capture every route at desktop tablet and mobile
        env:
          QA_BASE_URL: http://127.0.0.1:4173
        run: node .github/qa/exhaustive-visual-audit.mjs

      - name: Capture corrected representative screenshots
        if: success()
        env:
          QA_BASE_URL: http://127.0.0.1:4173
        run: node .github/qa/capture-corrected-screenshots.mjs

      - name: Upload exhaustive visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aegisland-exhaustive-visual-evidence
          path: qa-artifacts/exhaustive/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload corrected visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aegisland-corrected-visual-evidence
          path: corrected-visual-artifacts/
          if-no-files-found: warn
          retention-days: 14
